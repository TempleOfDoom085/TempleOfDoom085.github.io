<script>
'use strict';
let W=innerWidth,H=innerHeight;
const canvas=document.getElementById('c');

// ══════════════════════════════════════════════════════
// QUALITY TIERS — picked from hardware, then adapted live
// ══════════════════════════════════════════════════════
const coarse=matchMedia('(pointer:coarse)').matches;
const reduceMotion=matchMedia('(prefers-reduced-motion: reduce)').matches;
const cores=navigator.hardwareConcurrency||4;
const mem=navigator.deviceMemory||4;
let tier=(coarse||mem<4)?0:(cores<=4?1:2);
const TIERS=[
  {dpr:0.85,vol:0.30,steps:24,shadow:0},
  {dpr:1.15,vol:0.46,steps:32,shadow:1},
  {dpr:1.50,vol:0.64,steps:44,shadow:1}
];
const STAR_COUNT=[14000,30000,52000][tier];

function bail(msg){
  document.querySelectorAll('.cl').forEach(el=>el.remove());
  const d=document.createElement('div');
  d.style.cssText='position:fixed;inset:0;z-index:200;display:flex;align-items:center;justify-content:center;padding:2rem';
  const inner=document.createElement('div');
  inner.style.cssText='text-align:center;color:rgba(0,204,255,.55);font-size:.7rem;letter-spacing:.2em;'+
    'line-height:2.4;text-transform:uppercase;max-width:34rem';
  inner.innerHTML=msg;d.appendChild(inner);document.body.appendChild(d);
}
let renderer;
try{
  renderer=new THREE.WebGLRenderer({canvas,antialias:false,alpha:false,powerPreference:'high-performance',stencil:false});
}catch(e){ renderer=null; }
if(!renderer){
  canvas.style.display='none';
  bail('WebGL unavailable in this browser<br>the deep field renderer needs hardware acceleration<br><br>'+
       '<a href="/" style="color:rgba(0,204,255,.8)">← back to portfolio</a>');
  throw new Error('WebGL unavailable');
}
renderer.setPixelRatio(Math.min(devicePixelRatio,TIERS[tier].dpr));
renderer.setSize(W,H);
renderer.setClearColor(0x000000,1);

const scene=new THREE.Scene();
const camera=new THREE.PerspectiveCamera(52,W/H,0.1,300);
camera.position.z=4.5;

function makeRT(w,h){return new THREE.WebGLRenderTarget(Math.max(2,w|0),Math.max(2,h|0),
  {minFilter:THREE.LinearFilter,magFilter:THREE.LinearFilter,format:THREE.RGBAFormat,depthBuffer:false,stencilBuffer:false});}
function clearRT(rt){const p=renderer.getRenderTarget();renderer.setRenderTarget(rt);renderer.clear(true,true,true);renderer.setRenderTarget(p);}

// ══════════════════════════════════════════════════════
// STARFIELD
// Three things separate a real star field from a CG one, and all three are
// distributions rather than effects:
//   · luminosity follows a steep power law — a handful of bright sources
//     among a great many faint ones, never a uniform spread
//   · colour comes from a blackbody spectrum at the star's temperature, and
//     real populations are dominated by cool orange dwarfs, not blue
//   · the PSF is Moffat, not Gaussian: a sharp core with faint wide wings
// Diffraction spikes appear ONLY above a brightness threshold, and grow with
// it, because that is how a real instrument behaves.
// ══════════════════════════════════════════════════════
function bbRGB(T){
  const t=T/100;let r,g,b;
  if(t<=66){r=255;}else{r=329.698727446*Math.pow(t-60,-0.1332047592);}
  if(t<=66){g=99.4708025861*Math.log(t)-161.1195681661;}else{g=288.1221695283*Math.pow(t-60,-0.0755148492);}
  if(t>=66){b=255;}else if(t<=19){b=0;}else{b=138.5177312231*Math.log(t-10)-305.0447927307;}
  const c=v=>Math.min(255,Math.max(0,v))/255;
  return [c(r),c(g),c(b)];
}
function starTemp(){
  const u=Math.random();
  if(u<.76) return 2600+Math.random()*1300;   // M — most of any real field
  if(u<.90) return 3900+Math.random()*1300;   // K
  if(u<.962)return 5200+Math.random()*800;    // G
  if(u<.987)return 6000+Math.random()*1500;   // F
  if(u<.9975)return 7500+Math.random()*2500;  // A
  return 10000+Math.random()*18000;           // B/O — rare, hot, blue
}
const TOTAL=STAR_COUNT;
const sPos=new Float32Array(TOTAL*3),sCol=new Float32Array(TOTAL*3),
      sLum=new Float32Array(TOTAL),sSpk=new Float32Array(TOTAL),sOff=new Float32Array(TOTAL);
for(let i=0;i<TOTAL;i++){
  let x,y,z;
  if(i/TOTAL<0.55){
    const arm=Math.floor(Math.random()*3),armAngle=(arm/3)*Math.PI*2;
    const r=0.5+Math.pow(Math.random(),0.7)*20;
    const spread=0.3+r*.09;
    const theta=armAngle+r*.3+(Math.random()-.5)*.7;
    x=Math.cos(theta)*r+(Math.random()-.5)*spread;
    y=(Math.random()-.5)*spread*.6;
    z=Math.sin(theta)*r+(Math.random()-.5)*spread;
  } else {
    const r=3+Math.random()*18;
    const th=Math.random()*Math.PI*2,ph=Math.acos(2*Math.random()-1);
    x=r*Math.sin(ph)*Math.cos(th);y=r*Math.sin(ph)*Math.sin(th);z=r*Math.cos(ph);
  }
  sPos[i*3]=x;sPos[i*3+1]=y;sPos[i*3+2]=z;
  const T=starTemp();
  // Inverse-CDF sample of m over [0,6] weighted by 10^(0.6m), then flux=10^(-0.4m).
  const mag=Math.log10(1+Math.random()*(Math.pow(10,2.1)-1))/0.6;
  let lum=Math.pow(10,-0.4*mag);
  if(T>9000)lum=Math.min(1,lum*2.2);                 // hot stars run luminous
  const c=bbRGB(T);
  sCol[i*3]=c[0];sCol[i*3+1]=c[1];sCol[i*3+2]=c[2];
  sLum[i]=lum;
  sSpk[i]=Math.max(0,Math.min(1,(lum-.72)/.28));
  sOff[i]=Math.random()*Math.PI*2;
}
const starGeo=new THREE.BufferGeometry();
starGeo.setAttribute('position',new THREE.BufferAttribute(sPos,3));
starGeo.setAttribute('aCol',new THREE.BufferAttribute(sCol,3));
starGeo.setAttribute('aLum',new THREE.BufferAttribute(sLum,1));
starGeo.setAttribute('aSpk',new THREE.BufferAttribute(sSpk,1));
starGeo.setAttribute('aOff',new THREE.BufferAttribute(sOff,1));
const starMat=new THREE.ShaderMaterial({
  uniforms:{time:{value:0},pxs:{value:renderer.getPixelRatio()/1.5}},
  vertexShader:`attribute vec3 aCol;attribute float aLum,aSpk,aOff;uniform float time,pxs;
    varying vec3 vC;varying float vI,vS;
    void main(){
      vC=aCol;vS=aSpk;
      vec4 mv=modelViewMatrix*vec4(position,1.);
      // Inverse-square dimming with range; the PSF itself stays put.
      float att=clamp(90./(mv.z*mv.z),.18,1.4);
      float app=clamp(aLum*att,0.,1.);
      // Scintillation is tiny for a real exposure — a hint, not a disco.
      vI=app*(.94+.06*sin(time*1.4+aOff));
      // Only saturation blooming widens a star, so radius tracks sqrt(flux).
      gl_PointSize=min((1.8+sqrt(app)*8.0)*(1.+aSpk*1.6)*pxs,26.);
      gl_Position=projectionMatrix*mv;
    }`,
  fragmentShader:`varying vec3 vC;varying float vI,vS;
    void main(){
      vec2 c=gl_PointCoord-.5;float r=length(c)*2.;
      if(r>1.)discard;
      // Moffat PSF: sharp core, faint extended wings. Gaussians look synthetic.
      float m=pow(1.+r*r*9.,-2.6);
      if(vS>0.){
        float s=max(exp(-abs(c.x)*70.)*exp(-abs(c.y)*9.),exp(-abs(c.y)*70.)*exp(-abs(c.x)*9.));
        m+=s*vS*.55;
      }
      m*=smoothstep(1.,.72,r);        // reach zero before the sprite edge
      gl_FragColor=vec4(vC,m*vI);
    }`,
  transparent:true,depthWrite:false,blending:THREE.AdditiveBlending});
const starField=new THREE.Points(starGeo,starMat);scene.add(starField);

// ══════════════════════════════════════════════════════
// BACKGROUND GALAXIES
// Every real deep field is littered with them — small, elongated, reddened by
// distance. Nothing says "photograph" faster, and they cost one draw call.
// ══════════════════════════════════════════════════════
const GAL_N=coarse?36:80;
const gPos=new Float32Array(GAL_N*3),gCol=new Float32Array(GAL_N*3),
      gAng=new Float32Array(GAL_N),gQ=new Float32Array(GAL_N),gSz=new Float32Array(GAL_N);
for(let i=0;i<GAL_N;i++){
  const r=24+Math.random()*34;
  const th=Math.random()*Math.PI*2,ph=Math.acos(2*Math.random()-1);
  gPos[i*3]=r*Math.sin(ph)*Math.cos(th);gPos[i*3+1]=r*Math.sin(ph)*Math.sin(th);gPos[i*3+2]=r*Math.cos(ph);
  // Redshifted and dust-reddened: warm tans and ambers, a few bluer spirals.
  const u=Math.random();
  const c=u<.62?[1.0,.80,.60]:(u<.86?[1.0,.90,.78]:[.74,.82,1.0]);
  const dim=.20+Math.random()*.45;
  gCol[i*3]=c[0]*dim;gCol[i*3+1]=c[1]*dim;gCol[i*3+2]=c[2]*dim;
  gAng[i]=Math.random()*Math.PI;
  gQ[i]=.26+Math.random()*.74;             // axis ratio — edge-on to face-on
  gSz[i]=10+Math.random()*26;
}
const galaxyGeo=new THREE.BufferGeometry();
galaxyGeo.setAttribute('position',new THREE.BufferAttribute(gPos,3));
galaxyGeo.setAttribute('aCol',new THREE.BufferAttribute(gCol,3));
galaxyGeo.setAttribute('aAng',new THREE.BufferAttribute(gAng,1));
galaxyGeo.setAttribute('aQ',new THREE.BufferAttribute(gQ,1));
galaxyGeo.setAttribute('aSize',new THREE.BufferAttribute(gSz,1));
const galaxyMat=new THREE.ShaderMaterial({
  uniforms:{pxs:{value:renderer.getPixelRatio()/1.5}},
  vertexShader:`attribute vec3 aCol;attribute float aAng,aQ,aSize;uniform float pxs;
    varying vec3 vC;varying float vA,vQ;
    void main(){vC=aCol;vA=aAng;vQ=aQ;
      vec4 mv=modelViewMatrix*vec4(position,1.);
      gl_PointSize=min(aSize*pxs*(150./-mv.z),40.);
      gl_Position=projectionMatrix*mv;}`,
  fragmentShader:`varying vec3 vC;varying float vA,vQ;
    void main(){
      vec2 c=gl_PointCoord-.5;
      float s=sin(vA),co=cos(vA);
      vec2 q=vec2(c.x*co-c.y*s,(c.x*s+c.y*co)/vQ);   // rotate, then squash
      float d=length(q)*2.;
      if(d>1.)discard;
      float disc=exp(-d*3.4);                        // exponential disc
      float bulge=exp(-d*d*30.)*.55;                 // central concentration
      gl_FragColor=vec4(vC,(disc+bulge)*smoothstep(1.,.6,d)*.85);
    }`,
  transparent:true,depthWrite:false,blending:THREE.AdditiveBlending});
scene.add(new THREE.Points(galaxyGeo,galaxyMat));

// ══════════════════════════════════════════════════════
// SUPERNOVA — a star in the field goes up, throws a shell
// ══════════════════════════════════════════════════════
const shockGeo=new THREE.RingGeometry(.01,.045,48);
const shockwaves=[];
function spawnShock(at,col,speed,scale){
  const mat=new THREE.MeshBasicMaterial({color:col,transparent:true,opacity:.30,depthWrite:false,
    side:THREE.DoubleSide,blending:THREE.AdditiveBlending});
  const wave=new THREE.Mesh(shockGeo,mat);
  wave.rotation.set(Math.random()*Math.PI,Math.random()*Math.PI,0);
  if(at)wave.position.copy(at);
  scene.add(wave);shockwaves.push({wave,t:0,sp:speed,sc:scale});
}
const novaGeo=new THREE.BufferGeometry();
novaGeo.setAttribute('position',new THREE.BufferAttribute(new Float32Array(3),3));
novaGeo.boundingSphere=new THREE.Sphere(new THREE.Vector3(),24);
const novaMat=new THREE.ShaderMaterial({
  uniforms:{amp:{value:0},pxs:{value:renderer.getPixelRatio()/1.5}},
  vertexShader:`uniform float amp,pxs;varying float vA;
    void main(){vA=amp;vec4 mv=modelViewMatrix*vec4(position,1.);
    gl_PointSize=min(amp*66.*pxs*(60./-mv.z),150.);gl_Position=projectionMatrix*mv;}`,
  fragmentShader:`varying float vA;
    void main(){vec2 c=gl_PointCoord-.5;float d=length(c)*2.;if(d>1.)discard;
    float spike=max(exp(-abs(c.x)*62.)*exp(-abs(c.y)*7.),exp(-abs(c.y)*62.)*exp(-abs(c.x)*7.));
    float core=pow(1.+d*d*9.,-2.6);
    float edge=pow(max(0.,1.-d),1.5);
    vec3 col=mix(vec3(.66,.80,1.),vec3(1.,.95,.86),core);   // hot, blue-white
    gl_FragColor=vec4(col,(core+spike*.7)*edge*vA*.95);}`,
  transparent:true,depthWrite:false,blending:THREE.AdditiveBlending});
scene.add(new THREE.Points(novaGeo,novaMat));
let novaLife=-1,novaMax=0;
function spawnNova(){
  const th=Math.random()*Math.PI*2,r=3.5+Math.random()*7;
  novaGeo.attributes.position.setXYZ(0,Math.cos(th)*r,(Math.random()-.5)*1.4,Math.sin(th)*r);
  novaGeo.attributes.position.needsUpdate=true;
  novaLife=0;novaMax=330;
  spawnShock(new THREE.Vector3().fromBufferAttribute(novaGeo.attributes.position,0),0x7799cc,.010,3.2);
}

// ══════════════════════════════════════════════════════
// COMET — head plus a tail laid out by distance, not by
// frame history, so its length never depends on framerate
// ══════════════════════════════════════════════════════
const COMET_N=110;
const cPos=new Float32Array(COMET_N*3),cA=new Float32Array(COMET_N);
const cometGeo=new THREE.BufferGeometry();
cometGeo.setAttribute('position',new THREE.BufferAttribute(cPos,3));
cometGeo.setAttribute('aA',new THREE.BufferAttribute(cA,1));
cometGeo.boundingSphere=new THREE.Sphere(new THREE.Vector3(),30);
const cometMat=new THREE.ShaderMaterial({
  uniforms:{amp:{value:0},pxs:{value:renderer.getPixelRatio()/1.5}},
  vertexShader:`attribute float aA;uniform float amp,pxs;varying float vA;
    void main(){vA=aA*amp;vec4 mv=modelViewMatrix*vec4(position,1.);
    gl_PointSize=min((1.5+aA*8.)*pxs*(40./-mv.z),42.);gl_Position=projectionMatrix*mv;}`,
  fragmentShader:`varying float vA;
    void main(){float d=length(gl_PointCoord-.5)*2.;if(d>1.)discard;
    vec3 col=mix(vec3(.50,.72,.96),vec3(.94,.97,1.),vA);   // ion tail runs blue
    gl_FragColor=vec4(col,pow(1.-d,2.)*vA*.7);}`,
  transparent:true,depthWrite:false,blending:THREE.AdditiveBlending});
scene.add(new THREE.Points(cometGeo,cometMat));
let cometLife=-1,cometMax=0;
const cometHead=new THREE.Vector3(),cometVel=new THREE.Vector3(),cometDir=new THREE.Vector3();
function spawnComet(){
  const th=Math.random()*Math.PI*2;
  cometHead.set(Math.cos(th)*13,(Math.random()-.5)*5,Math.sin(th)*13);
  cometVel.set(-cometHead.x,(Math.random()-.5)*2.5,-cometHead.z).normalize()
          .add(new THREE.Vector3(-Math.sin(th)*.95,0,Math.cos(th)*.95)).normalize();
  cometDir.copy(cometVel);cometVel.multiplyScalar(.055);
  for(let i=0;i<COMET_N;i++)cA[i]=Math.pow(1-i/(COMET_N-1),1.8);
  cometGeo.attributes.aA.needsUpdate=true;
  cometLife=0;cometMax=380;
}

// ══════════════════════════════════════════════════════
// VOLUMETRIC NEBULA
// The realism here is not the noise, it is the physics of what the noise
// means. Two quantities come out of one density field:
//   · EMISSION — ionised gas that glows, coloured by which line dominates:
//     OIII teal close to the ionising source, Halpha crimson further out
//   · EXTINCTION — dust that only blocks. Optically thick cores absorb far
//     more than they emit, and that asymmetry is what carves the dark lanes
//     that define a real nebula's silhouette
// Rays also terminate on scene depth, so stars sit inside the cloud.
// ══════════════════════════════════════════════════════
const volScene=new THREE.Scene(),volCam=new THREE.OrthographicCamera(-1,1,1,-1,0,1);
const volMat=new THREE.ShaderMaterial({
  uniforms:{
    camPos:{value:new THREE.Vector3()},camFwd:{value:new THREE.Vector3()},
    invProjView:{value:new THREE.Matrix4()},prevViewProj:{value:new THREE.Matrix4()},
    tDepth:{value:null},tPrev:{value:null},
    time:{value:0},maxSteps:{value:TIERS[tier].steps},shadowOn:{value:TIERS[tier].shadow},
    useDepth:{value:0},camNear:{value:0.1},camFar:{value:300},
    histWeight:{value:0},frameSeed:{value:1.7}
  },
  vertexShader:'varying vec2 vUv;void main(){vUv=uv;gl_Position=vec4(position.xy,0.,1.);}',
  fragmentShader:`
    precision highp float;
    uniform vec3 camPos,camFwd;uniform mat4 invProjView,prevViewProj;
    uniform sampler2D tDepth,tPrev;
    uniform float time,maxSteps,shadowOn,useDepth,camNear,camFar,histWeight,frameSeed;
    varying vec2 vUv;

    float h3(vec3 p){
      p=fract(p*0.3183099+vec3(.11,.17,.13));
      p*=17.0;
      return fract(p.x*p.y*p.z*(p.x+p.y+p.z));
    }
    float n3(vec3 p){
      vec3 i=floor(p),f=fract(p);f=f*f*(3.-2.*f);
      return mix(mix(mix(h3(i),h3(i+vec3(1,0,0)),f.x),
                     mix(h3(i+vec3(0,1,0)),h3(i+vec3(1,1,0)),f.x),f.y),
                 mix(mix(h3(i+vec3(0,0,1)),h3(i+vec3(1,0,1)),f.x),
                     mix(h3(i+vec3(0,1,1)),h3(i+vec3(1,1,1)),f.x),f.y),f.z);
    }
    // Ridged noise sharpens the high band into filaments and sheets. Plain
    // fbm gives soft cotton wool; real dust has edges.
    float fbmR(vec3 p){
      float v=0.,a=.5;
      for(int i=0;i<5;i++){
        float n=n3(p);
        v+=a*(i>0?(1.-abs(n*2.-1.)):n);
        p=p*2.11+vec3(1.7,9.2,4.3);a*=.54;
      }
      return v*.86;
    }
    float fbm2(vec3 p){return n3(p)*.62+n3(p*2.07+vec3(1.7,9.2,4.3))*.31;}

    const float R=3.25;
    float envelope(vec3 p){
      vec3 q=p;q.y*=1.60;
      float disc=length(q);
      vec3 lp=p;lp.y-=clamp(p.y,-1.,1.)*.82;
      float lobe=length(lp)*1.34;
      return 1.-smoothstep(.18,3.15,min(disc,lobe));
    }
    float cloud(vec3 p){
      float t=time*.015;
      vec3 q=vec3(fbm2(p+t),fbm2(p+vec3(5.2,1.3,2.8)-t*.8),fbm2(p+vec3(2.9,7.4,3.1)+t*.6));
      float d=fbmR(p*1.15+q*1.7-t);
      return d*envelope(p+q*.24);
    }
    float cloudCheap(vec3 p){return fbm2(p*1.15)*envelope(p);}

    void main(){
      vec4 wN=invProjView*vec4(vUv*2.-1.,-1.,1.);
      vec4 wF=invProjView*vec4(vUv*2.-1., 1.,1.);
      wN.xyz/=wN.w;wF.xyz/=wF.w;
      vec3 ro=camPos,rd=normalize(wF.xyz-wN.xyz);

      float b=dot(ro,rd),cc=dot(ro,ro)-R*R;
      float disc=b*b-cc;
      if(disc<=0.){gl_FragColor=vec4(0.);return;}
      float sq=sqrt(disc);
      float t0=max(-b-sq,.05),t1=-b+sq;

      if(useDepth>.5){
        float dz=texture2D(tDepth,vUv).x;
        if(dz<1.){
          float ndc=dz*2.-1.;
          float viewZ=(2.*camNear*camFar)/(camFar+camNear-ndc*(camFar-camNear));
          t1=min(t1,viewZ/max(dot(rd,camFwd),1e-4));
        }
      }
      if(t1<=t0){gl_FragColor=vec4(0.);return;}

      float dt=(t1-t0)/maxSteps;
      float jitter=h3(vec3(gl_FragCoord.xy,frameSeed));
      float t=t0+dt*jitter;

      const vec3 Ha  =vec3(.80,.27,.21);   // hydrogen-alpha, 656nm
      const vec3 OIII=vec3(.24,.56,.53);   // doubly-ionised oxygen, 501nm
      const vec3 HOT =vec3(.96,.86,.70);   // continuum where it is brightest
      const vec3 DUST=vec3(.034,.019,.013);

      vec3 col=vec3(0.);float alpha=0.;
      for(int i=0;i<44;i++){
        if(float(i)>=maxSteps||alpha>.985)break;
        vec3 p=ro+rd*t;
        float d=cloud(p);
        float k=dt/.22;

        float dn=d*1.9;                         // bring the field into 0..~1.3
        float emis=pow(clamp((dn-.42)/.58,0.,1.),2.0);
        // Dust only takes hold in the densest gas, which is what carves lanes.
        float dust=pow(clamp((dn-.62)/.38,0.,1.),1.2);
        float ext=dust*1.60*k;

        if(ext>.0012||emis>.0012){
          float lt=1.;
          if(shadowOn>.5){
            vec3 ldir=normalize(-p);float ss=length(p)*.42;
            float sh=cloudCheap(p+ldir*ss)+cloudCheap(p+ldir*ss*2.2);
            lt=exp(-sh*2.3);
          }
          vec3 ldir=normalize(-p);
          float ct=dot(rd,ldir),g=.52;
          float hg=(1.-g*g)/pow(1.+g*g-2.*g*ct,1.5)*.0796;

          // Ionisation falls off with distance from the source, so the line
          // ratio shifts from OIII near in to Halpha further out.
          float shield=smoothstep(.98,.44,dn);        // thick gas self-shields
          float ion=(1.-smoothstep(.22,1.90,length(p)))*mix(.30,1.,shield);
          vec3 c=mix(Ha,OIII,smoothstep(.12,.58,ion));
          c=mix(c,HOT,smoothstep(.72,.98,ion)*.55);
          c*=lt*(.50+hg*1.9)+.045;

          float tr=1.-alpha;
          col+=(c*emis*3.10+DUST*dust*.22)*k*tr;
          alpha+=ext*tr;
        }
        t+=dt;
      }

      vec4 cur=vec4(col,min(alpha,1.));
      if(histWeight>.001){
        float tRep=max(dot(-ro,rd),.1);
        vec4 pc=prevViewProj*vec4(ro+rd*tRep,1.);
        vec2 puv=(pc.xy/pc.w)*.5+.5;
        if(pc.w>0.&&puv.x>0.&&puv.x<1.&&puv.y>0.&&puv.y<1.){
          vec4 hist=texture2D(tPrev,puv);
          if(abs(hist.a-cur.a)<.22)cur=mix(cur,hist,histWeight);
        }
      }
      gl_FragColor=cur;
    }`,
  depthTest:false,depthWrite:false});
const volQuad=new THREE.Mesh(new THREE.PlaneGeometry(2,2),volMat);volQuad.frustumCulled=false;volScene.add(volQuad);

const DEPTH_OK=renderer.capabilities.isWebGL2||!!renderer.extensions.get('WEBGL_depth_texture');
const depthScene=new THREE.Scene();
const starDepthMat=new THREE.ShaderMaterial({
  uniforms:{pxs:{value:1},cap:{value:7}},
  vertexShader:`attribute float aLum,aSpk;uniform float pxs,cap;varying float vApp;void main(){
    vec4 mv=modelViewMatrix*vec4(position,1.);
    float att=clamp(90./(mv.z*mv.z),.18,1.4);
    float app=clamp(aLum*att,0.,1.);
    vApp=app;
    gl_PointSize=min((1.2+sqrt(app)*3.0)*pxs,cap);gl_Position=projectionMatrix*mv;}`,
  fragmentShader:`varying float vApp;
    void main(){
      if(vApp<.42)discard;                       // faint stars do not occlude
      if(length(gl_PointCoord-.5)>.5)discard;
      gl_FragColor=vec4(1.);}`,
  colorWrite:false,depthWrite:true,depthTest:true,blending:THREE.NoBlending});
depthScene.add(new THREE.Points(starGeo,starDepthMat));

let volA,volB,depthRT;
function rebuildVolTargets(){
  const vw=Math.max(2,W*TIERS[tier].vol|0),vh=Math.max(2,H*TIERS[tier].vol|0);
  if(volA){volA.dispose();volB.dispose();if(depthRT)depthRT.dispose();}
  volA=makeRT(vw,vh);volB=makeRT(vw,vh);clearRT(volA);clearRT(volB);
  if(DEPTH_OK){
    depthRT=new THREE.WebGLRenderTarget(vw,vh,{minFilter:THREE.NearestFilter,magFilter:THREE.NearestFilter,
      format:THREE.RGBAFormat,depthBuffer:true,stencilBuffer:false});
    depthRT.depthTexture=new THREE.DepthTexture(vw,vh,THREE.UnsignedIntType);
    volMat.uniforms.tDepth.value=depthRT.depthTexture;
    volMat.uniforms.useDepth.value=1;
  }
  const dpr=renderer.getPixelRatio(),k=TIERS[tier].vol/dpr;
  starDepthMat.uniforms.pxs.value=(dpr/1.5)*k;
  starDepthMat.uniforms.cap.value=Math.max(1,7*k);
}
rebuildVolTargets();

// ══════════════════════════════════════════════════════
// POST — render → cloud composite → bloom → stretch/grade
// God rays and the anamorphic streak are gone. Neither exists in a telescope
// image; they were the loudest "rendered, not photographed" signal on screen.
// Dropping them also buys back 20 texture taps a pixel.
// ══════════════════════════════════════════════════════
const composer=new THREE.EffectComposer(renderer);
composer.setPixelRatio(renderer.getPixelRatio());
composer.addPass(new THREE.RenderPass(scene,camera));

const volComposite=new THREE.ShaderPass({
  uniforms:{tDiffuse:{value:null},tVol:{value:null}},
  vertexShader:'varying vec2 vUv;void main(){vUv=uv;gl_Position=projectionMatrix*modelViewMatrix*vec4(position,1.);}',
  fragmentShader:`uniform sampler2D tDiffuse,tVol;varying vec2 vUv;
    void main(){
      vec4 v=texture2D(tVol,vUv);
      vec3 bg=texture2D(tDiffuse,vUv).rgb;
      // Dust genuinely occludes what is behind it, so this is close to full
      // extinction; rays already stopped at anything in FRONT of the cloud.
      gl_FragColor=vec4(bg*(1.-v.a*.96)+v.rgb,1.);
    }`
});
composer.addPass(volComposite);

// Sensor bloom is tight and only around genuinely saturated sources.
const bloom=new THREE.UnrealBloomPass(new THREE.Vector2(W,H),0.42,0.36,0.72);
composer.addPass(bloom);

const finalPass=new THREE.ShaderPass({
  uniforms:{tDiffuse:{value:null},time:{value:0},novaFlash:{value:0}},
  vertexShader:'varying vec2 vUv;void main(){vUv=uv;gl_Position=projectionMatrix*modelViewMatrix*vec4(position,1.);}',
  fragmentShader:`
    uniform sampler2D tDiffuse;uniform float time,novaFlash;
    varying vec2 vUv;
    float rnd(vec2 p){return fract(sin(dot(p+time,vec2(127.1,311.7)))*43758.5453);}
    void main(){
      // A whisper of lateral colour, the way a real refractor has some.
      vec2 d=vUv-.5;float dist=length(d);vec2 off=normalize(d+1e-6)*.0008*dist*dist*2.;
      vec3 col=vec3(texture2D(tDiffuse,vUv+off).r,
                    texture2D(tDiffuse,vUv).g,
                    texture2D(tDiffuse,vUv-off).b);

      col+=vec3(.66,.76,1.)*novaFlash;

      // Asinh stretch — the standard transfer for astronomical data. It lifts
      // faint nebulosity while compressing the cores instead of clipping them.
      // Black point comes off first, or the stretch lifts the sky itself.
      col=max(vec3(0.),col-.002);
      const float A=2.0;
      col=log(col*A+sqrt(col*col*(A*A)+1.))/log(A+sqrt(A*A+1.));

      // Sensor noise: slightly chromatic, and strongest in the shadows.
      float lum=dot(col,vec3(.299,.587,.114));
      vec3 grain=vec3(rnd(vUv),rnd(vUv+.31),rnd(vUv+.73))-.5;
      col+=grain*.030*(1.-smoothstep(0.,.55,lum));

      col*=smoothstep(1.18,.34,length(vUv-.5)*1.45);   // gentle optical falloff
      col+=(fract(dot(gl_FragCoord.xy,vec2(.7548776,.5698403)))-.5)/255.;
      gl_FragColor=vec4(clamp(col,0.,1.),1.);}`,
  renderToScreen:true
});
composer.addPass(finalPass);

// ══════════════════════════════════════════════════════
// INPUT + RESIZE
// ══════════════════════════════════════════════════════
let contextLost=false;
canvas.addEventListener('webglcontextlost',e=>{e.preventDefault();contextLost=true;},false);
canvas.addEventListener('webglcontextrestored',()=>{rebuildVolTargets();contextLost=false;},false);

let paraX=0,paraY=0,paraTX=0,paraTY=0;
function pointer(x,y){paraTX=(x/W-.5)*2;paraTY=(y/H-.5)*2;}
addEventListener('mousemove',e=>pointer(e.clientX,e.clientY),{passive:true});
addEventListener('touchmove',e=>{const t=e.touches[0];if(t)pointer(t.clientX,t.clientY);},{passive:true});

let resizeTimer=0;
addEventListener('resize',()=>{
  clearTimeout(resizeTimer);
  resizeTimer=setTimeout(()=>{
    W=innerWidth;H=innerHeight;
    renderer.setSize(W,H);composer.setSize(W,H);
    camera.aspect=W/H;camera.updateProjectionMatrix();
    rebuildVolTargets();
  },150);
},{passive:true});

// ══════════════════════════════════════════════════════
// ADAPTIVE QUALITY
// ══════════════════════════════════════════════════════
const pxsUniforms=[starMat,galaxyMat,novaMat,cometMat];
function applyTier(t){
  tier=t;const q=TIERS[t];
  const dpr=Math.min(devicePixelRatio,q.dpr);
  renderer.setPixelRatio(dpr);composer.setPixelRatio(dpr);
  pxsUniforms.forEach(m=>m.uniforms.pxs.value=dpr/1.5);
  volMat.uniforms.maxSteps.value=q.steps;
  volMat.uniforms.shadowOn.value=q.shadow;
  rebuildVolTargets();
}
let frameMs=16.7,slowRun=0,fastRun=0,drops=0,vsyncMs=16.7,warmup=0;
const startTier=tier;

const fpsEl=document.getElementById('fps'),starEl=document.getElementById('stars');
starEl.textContent='SOURCES: '+(TOTAL/1000).toFixed(0)+'K + '+GAL_N+' GALAXIES';
let hudT=-1e9;

// ══════════════════════════════════════════════════════
// ANIMATE
// ══════════════════════════════════════════════════════
const clock=new THREE.Clock();
let time=0;
const _invPV=new THREE.Matrix4(),_camFwd=new THREE.Vector3(),_prevCamPos=new THREE.Vector3();
let frameNo=0;
let nextNova=26000,nextComet=48000,elapsed=0;

function jn(x){var i=Math.floor(x),f=x-i,u=f*f*(3-2*f),
  a=(Math.sin(i*127.1)*43758.5453)%1,b=(Math.sin((i+1)*127.1)*43758.5453)%1;
  a=a<0?a+1:a;b=b<0?b+1:b;return a*(1-u)+b*u;}
function jfbm(x){return jn(x)*.5+jn(x*2.1)*.25+jn(x*4.3)*.125;}
const motion=reduceMotion?.25:1;

function animate(){
  requestAnimationFrame(animate);
  const dtRaw=clock.getDelta();
  if(document.hidden||contextLost)return;
  const dt=Math.min(dtRaw,1/20);
  const fs=dt*60;
  time+=dt*0.21;
  elapsed+=dt*1000;

  starMat.uniforms.time.value=time;
  starField.rotation.y+=.00006*fs*motion;

  if(elapsed>nextNova){nextNova=elapsed+55000+Math.random()*50000;if(novaLife<0)spawnNova();}
  if(elapsed>nextComet){nextComet=elapsed+62000+Math.random()*60000;if(cometLife<0)spawnComet();}

  for(let i=shockwaves.length-1;i>=0;i--){
    const sw=shockwaves[i];sw.t+=sw.sp*fs;
    sw.wave.scale.setScalar(sw.t*sw.sc);
    sw.wave.material.opacity=Math.max(0,.55*(1-sw.t));
    if(sw.t>=1){scene.remove(sw.wave);sw.wave.material.dispose();shockwaves.splice(i,1);}
  }

  if(novaLife>=0){
    novaLife+=fs;const ph=novaLife/novaMax;
    const amp=ph<.035?ph/.035:Math.pow(Math.max(0,1-(ph-.035)/.965),2.3);
    novaMat.uniforms.amp.value=amp;
    finalPass.uniforms.novaFlash.value=amp*.05;
    if(novaLife>=novaMax){novaLife=-1;novaMat.uniforms.amp.value=0;finalPass.uniforms.novaFlash.value=0;}
  }

  if(cometLife>=0){
    cometLife+=fs;const ph=cometLife/cometMax;
    cometHead.addScaledVector(cometVel,fs);
    for(let i=0,j=0;i<COMET_N;i++,j+=3){
      const f=i/(COMET_N-1),back=f*8.2;
      cPos[j]  =cometHead.x-cometDir.x*back;
      cPos[j+1]=cometHead.y-cometDir.y*back+f*f*.5;
      cPos[j+2]=cometHead.z-cometDir.z*back;
    }
    cometGeo.attributes.position.needsUpdate=true;
    cometMat.uniforms.amp.value=Math.min(1,ph*14)*Math.min(1,(1-ph)*5);
    if(cometLife>=cometMax){cometLife=-1;cometMat.uniforms.amp.value=0;}
  }

  // ── Camera: slow drift, a long dolly, and eased mouse parallax
  paraX+=(paraTX-paraX)*Math.min(1,dt*2.2);
  paraY+=(paraTY-paraY)*Math.min(1,dt*2.2);
  const cT=time*.022;
  const dolly=1.+Math.sin(time*.36)*.26*motion;
  const camOrbitR=(4.2+jfbm(cT*.5)*.6-.25)*dolly;
  const camOrbitA=time*.038*motion+jfbm(cT*.9)*.12;
  camera.position.x=Math.sin(camOrbitA)*camOrbitR*.40+paraX*.42*motion;
  camera.position.y=(jfbm(cT*.6+5.)-.5)*1.1*motion-paraY*.26*motion;
  camera.position.z=Math.cos(camOrbitA)*camOrbitR*.92;
  camera.lookAt((jfbm(time*1.8+1.7)-.5)*.018*motion-paraX*.06*motion,
                (jfbm(time*1.5+4.1)-.5)*.012*motion+paraY*.04*motion,0);
  camera.updateMatrixWorld();

  finalPass.uniforms.time.value=time;

  // ── Depth prepass, then the cloud
  if(DEPTH_OK){
    renderer.setRenderTarget(depthRT);
    renderer.clear(true,true,false);
    renderer.render(depthScene,camera);
  }
  volMat.uniforms.time.value=time;
  volMat.uniforms.camPos.value.copy(camera.position);
  camera.getWorldDirection(_camFwd);
  volMat.uniforms.camFwd.value.copy(_camFwd);
  volMat.uniforms.camNear.value=camera.near;
  volMat.uniforms.camFar.value=camera.far;
  _invPV.copy(camera.projectionMatrix).multiply(camera.matrixWorldInverse).invert();
  volMat.uniforms.invProjView.value.copy(_invPV);

  const camSpeed=camera.position.distanceTo(_prevCamPos)/Math.max(dt,1e-4);
  _prevCamPos.copy(camera.position);
  volMat.uniforms.histWeight.value=Math.max(0,Math.min(.84,.84-camSpeed*.9));
  volMat.uniforms.tPrev.value=volB.texture;
  volMat.uniforms.frameSeed.value=1.7+(frameNo%8)*13.37;
  frameNo++;

  renderer.setRenderTarget(volA);
  renderer.render(volScene,volCam);
  renderer.setRenderTarget(null);
  volComposite.uniforms.tVol.value=volA.texture;
  const vt=volA;volA=volB;volB=vt;
  volMat.uniforms.prevViewProj.value.copy(camera.projectionMatrix).multiply(camera.matrixWorldInverse);

  composer.render();

  frameMs+=(Math.min(dtRaw,.25)*1000-frameMs)*.05;
  if(warmup<40){warmup++;}
  else if(dtRaw>.004)vsyncMs=Math.min(vsyncMs,Math.max(dtRaw*1000,6));
  const slowAt=Math.max(22,vsyncMs*1.7),fastAt=vsyncMs*1.12;
  if(warmup>=40){
    if(frameMs>slowAt&&tier>0){if(++slowRun>45){applyTier(tier-1);drops++;slowRun=0;fastRun=0;}}
    else slowRun=0;
    if(frameMs<fastAt&&tier<startTier&&drops<3){if(++fastRun>300*(drops+1)){applyTier(tier+1);fastRun=0;}}
    else fastRun=0;
  }

  const now=performance.now();
  if(now-hudT>500){hudT=now;fpsEl.textContent=Math.round(1000/Math.max(frameMs,4.17))+' FPS · Q'+tier;}
}
animate();
</script>
</body>
</html>

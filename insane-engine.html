</nav>
<canvas id="c"></canvas>
<div class="cl tl">ENERGY CORE ACTIVE<br>PARTICLES: 50K</div>
<div class="cl bl">MOVE MOUSE TO INTERACT</div>
<div class="cl br">BLOOM · GOD RAYS<br>CHROMA · LENS FX</div>
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script src="https://unpkg.com/three@0.128.0/examples/js/shaders/LuminosityHighPassShader.js"></script>
<script src="https://unpkg.com/three@0.128.0/examples/js/shaders/CopyShader.js"></script>
<script src="https://unpkg.com/three@0.128.0/examples/js/postprocessing/EffectComposer.js"></script>
<script src="https://unpkg.com/three@0.128.0/examples/js/postprocessing/RenderPass.js"></script>
<script src="https://unpkg.com/three@0.128.0/examples/js/postprocessing/ShaderPass.js"></script>
<script src="https://unpkg.com/three@0.128.0/examples/js/postprocessing/UnrealBloomPass.js"></script>
<script>
'use strict';
let W=innerWidth,H=innerHeight;
const canvas=document.getElementById('c');
const renderer=new THREE.WebGLRenderer({canvas,antialias:true,alpha:false,powerPreference:'high-performance'});
renderer.setSize(W,H);renderer.setPixelRatio(Math.min(devicePixelRatio,2));
renderer.setClearColor(0x000000,1);
renderer.toneMapping=THREE.ACESFilmicToneMapping;renderer.toneMappingExposure=0.24;

const scene=new THREE.Scene();
const camera=new THREE.PerspectiveCamera(55,W/H,0.1,200);
camera.position.z=4.5;

// ══════════════════════════════════════════════════════
// 4-LAYER VOLUMETRIC NEBULA (depth planes)
// ══════════════════════════════════════════════════════
const nebulaVS=`varying vec2 vUv;void main(){vUv=uv;gl_Position=projectionMatrix*modelViewMatrix*vec4(position,1.);}`;
const nebulaFS=`
  precision highp float;
  uniform float time,seed,bright;varying vec2 vUv;
  float h(vec2 p){return fract(sin(dot(p,vec2(127.1,311.7)))*43758.5453);}
  float n(vec2 p){vec2 i=floor(p),f=fract(p);f=f*f*(3.-2.*f);
    return mix(mix(h(i),h(i+vec2(1,0)),f.x),mix(h(i+vec2(0,1)),h(i+vec2(1)),f.x),f.y);}
  float fbm(vec2 p){float v=0.,a=.5;for(int i=0;i<5;i++){v+=a*n(p);p*=2.1;a*=.5;}return v;}
  void main(){
    vec2 uv=(vUv-.5)*4.+seed;
    float t=time*.035;
    vec2 q=vec2(fbm(uv+t),fbm(uv+vec2(1.7,9.2+seed)+t*.8));
    vec2 r=vec2(fbm(uv+2.*q+t*.6+seed),fbm(uv+2.*q+vec2(8.3,2.8)+t*.5));
    float f=fbm(uv+2.2*r);
    // Hubble-style: warm amber/brown center, dusty lanes, pink/blue outer
    vec3 dust=vec3(.025+seed*.005,.012,.005);   // dark dust brown
    vec3 warmCore=vec3(.22,.10,.02);             // amber glow
    vec3 pinkCluster=vec3(.18,.03,.08);          // HII pink
    vec3 blueArm=vec3(.01,.04,.16);              // blue star arm
    vec3 c1=mix(dust,warmCore,clamp(f*2.2,0.,1.));
    vec3 c2=mix(c1,pinkCluster,clamp((f-.35)*3.,0.,1.)*step(.4,seed));
    vec3 c3=mix(c2,blueArm,clamp(pow(f,4.)*4.,0.,1.)*(1.-step(.4,seed)));
    gl_FragColor=vec4(c3*bright,1.);
  }`;

const nebulaLayers=[
  {z:-9.0,sz:50,seed:0.0, bright:0.26,op:1.0},
  {z:-6.5,sz:36,seed:2.3, bright:0.14,op:0.5},
  {z:-4.5,sz:26,seed:5.7, bright:0.10,op:0.28},
  {z:-2.5,sz:18,seed:9.1, bright:0.05,op:0.12},
];
const nebulaMeshes=nebulaLayers.map(l=>{
  const m=new THREE.Mesh(new THREE.PlaneGeometry(l.sz,l.sz),
    new THREE.ShaderMaterial({uniforms:{time:{value:0},seed:{value:l.seed},bright:{value:l.bright}},
      vertexShader:nebulaVS,fragmentShader:nebulaFS,depthWrite:false,transparent:true,opacity:l.op,side:THREE.BackSide}));
  m.position.z=l.z;scene.add(m);return m;
});

// ══════════════════════════════════════════════════════
// 50,000 GALAXY PARTICLES
// ══════════════════════════════════════════════════════
const TOTAL=50000;
const gPos=new Float32Array(TOTAL*3),gCol=new Float32Array(TOTAL*3),gSz=new Float32Array(TOTAL),gOff=new Float32Array(TOTAL);
for(let i=0;i<TOTAL;i++){
  const layer=i/TOTAL;
  let x,y,z;
  if(layer<0.65){
    const arm=Math.floor(Math.random()*3),armAngle=(arm/3)*Math.PI*2;
    const r=0.5+Math.pow(Math.random(),0.7)*20;
    const spread=0.3+r*.09;
    const theta=armAngle+r*.3+(Math.random()-.5)*.7;
    x=Math.cos(theta)*r+(Math.random()-.5)*spread;
    y=(Math.random()-.5)*spread*.3;
    z=Math.sin(theta)*r+(Math.random()-.5)*spread;
  } else {
    const r=3+Math.random()*18;
    const th=Math.random()*Math.PI*2,ph=Math.acos(2*Math.random()-1);
    x=r*Math.sin(ph)*Math.cos(th);y=r*Math.sin(ph)*Math.sin(th);z=r*Math.cos(ph);
  }
  gPos[i*3]=x;gPos[i*3+1]=y;gPos[i*3+2]=z;
  const c=Math.random();
  if(c<.10){gCol[i*3]=.85;gCol[i*3+1]=.92;gCol[i*3+2]=1.;}        // blue-white hot star
  else if(c<.22){gCol[i*3]=1.;gCol[i*3+1]=.82;gCol[i*3+2]=.42;}   // warm yellow
  else if(c<.38){gCol[i*3]=1.;gCol[i*3+1]=.52;gCol[i*3+2]=.18;}   // orange star
  else if(c<.52){gCol[i*3]=.95;gCol[i*3+1]=.28;gCol[i*3+2]=.38;}  // HII pink/red
  else if(c<.64){gCol[i*3]=.9;gCol[i*3+1]=.68;gCol[i*3+2]=.22;}   // amber
  else if(c<.76){gCol[i*3]=.42;gCol[i*3+1]=.55;gCol[i*3+2]=.95;}  // blue cluster
  else if(c<.88){gCol[i*3]=.75;gCol[i*3+1]=.38;gCol[i*3+2]=.12;}  // rust brown
  else{gCol[i*3]=1.;gCol[i*3+1]=.95;gCol[i*3+2]=.85;}             // cream core star
  gSz[i]=.25+Math.random()*1.2;gOff[i]=Math.random()*Math.PI*2;
}
const galGeo=new THREE.BufferGeometry();
galGeo.setAttribute('position',new THREE.BufferAttribute(gPos,3));
galGeo.setAttribute('aCol',new THREE.BufferAttribute(gCol,3));
galGeo.setAttribute('aSize',new THREE.BufferAttribute(gSz,1));
galGeo.setAttribute('aOff',new THREE.BufferAttribute(gOff,1));
const galMat=new THREE.ShaderMaterial({
  uniforms:{time:{value:0}},
  vertexShader:`attribute vec3 aCol;attribute float aSize,aOff;uniform float time;varying vec3 vC;varying float vA;
    void main(){vC=aCol;float tw=.05+.15*abs(sin(time*1.6+aOff));vA=tw;vec4 mv=modelViewMatrix*vec4(position,1.);
    gl_PointSize=aSize*(180./-mv.z);gl_Position=projectionMatrix*mv;}`,
  fragmentShader:`varying vec3 vC;varying float vA;
    void main(){float d=length(gl_PointCoord-.5)*2.;if(d>1.)discard;
    float a=pow(1.-d,2.)*vA;gl_FragColor=vec4(vC,a);}`, // dim stars
  transparent:true,depthWrite:false,blending:THREE.AdditiveBlending
});
scene.add(new THREE.Points(galGeo,galMat));

// ══════════════════════════════════════════════════════
// FOREGROUND SPARKLE MOTES (depth / parallax feel)
// ══════════════════════════════════════════════════════
const MOTES=300;
const mPos=new Float32Array(MOTES*3),mCol=new Float32Array(MOTES*3),mSz=new Float32Array(MOTES),mOff2=new Float32Array(MOTES);
for(let i=0;i<MOTES;i++){
  mPos[i*3]=(Math.random()-.5)*6;mPos[i*3+1]=(Math.random()-.5)*4;mPos[i*3+2]=1.5+Math.random()*2.5;
  const h=Math.random()<.5?.08:.12;const c=new THREE.Color().setHSL(h,1.,.75);
  mCol[i*3]=c.r;mCol[i*3+1]=c.g;mCol[i*3+2]=c.b;
  mSz[i]=1.5+Math.random()*3.5;mOff2[i]=Math.random()*Math.PI*2;
}
const mGeo=new THREE.BufferGeometry();
mGeo.setAttribute('position',new THREE.BufferAttribute(mPos,3));
mGeo.setAttribute('aCol',new THREE.BufferAttribute(mCol,3));
mGeo.setAttribute('aSize',new THREE.BufferAttribute(mSz,1));
mGeo.setAttribute('aOff',new THREE.BufferAttribute(mOff2,1));
scene.add(new THREE.Points(mGeo,new THREE.ShaderMaterial({
  uniforms:{time:{value:0}},
  vertexShader:`attribute vec3 aCol;attribute float aSize,aOff;uniform float time;varying vec3 vC;varying float vA;
    void main(){vC=aCol;float tw=.2+.8*pow(abs(sin(time*2.2+aOff)),3.);vA=tw;vec4 mv=modelViewMatrix*vec4(position,1.);
    gl_PointSize=aSize*tw*(300./-mv.z);gl_Position=projectionMatrix*mv;}`,
  fragmentShader:`varying vec3 vC;varying float vA;
    void main(){vec2 c=gl_PointCoord-.5;float d=length(c)*2.;if(d>1.)discard;
    // Star spike cross shape
    float spike=max(exp(-abs(c.x)*80.)*exp(-abs(c.y)*8.),exp(-abs(c.y)*80.)*exp(-abs(c.x)*8.));
    float core=exp(-d*d*30.);
    float a=(core+spike*.6)*vA;gl_FragColor=vec4(vC,a);}`,
  transparent:true,depthWrite:false,blending:THREE.AdditiveBlending
})));

// ══════════════════════════════════════════════════════
// LIGHTING — soft, even, no harsh spots
// ══════════════════════════════════════════════════════
scene.add(new THREE.AmbientLight(0x0a0604,1.5));
const coreLight=new THREE.PointLight(0xff8822,0.8,10);scene.add(coreLight);

// ══════════════════════════════════════════════════════
// ENERGY CORE — smooth morphing sphere, no wireframes
// ══════════════════════════════════════════════════════

// Morphing plasma sphere — vertex displacement + plasma surface
const coreMat=new THREE.ShaderMaterial({
  uniforms:{time:{value:0},camPos:{value:camera.position}},
  vertexShader:`
    precision highp float;
    uniform float time; uniform vec3 camPos;
    varying vec3 vNorm; varying vec3 vWorld; varying float vDisp;
    float h3(vec3 p){return fract(sin(dot(p,vec3(127.1,311.7,74.7)))*43758.5453);}
    float n3(vec3 p){
      vec3 i=floor(p),f=fract(p);f=f*f*(3.-2.*f);
      return mix(mix(mix(h3(i),h3(i+vec3(1,0,0)),f.x),mix(h3(i+vec3(0,1,0)),h3(i+vec3(1,1,0)),f.x),f.y),
                 mix(mix(h3(i+vec3(0,0,1)),h3(i+vec3(1,0,1)),f.x),mix(h3(i+vec3(0,1,1)),h3(i+vec3(1,1,1)),f.x),f.y),f.z);}
    float fbm3(vec3 p){float v=0.,a=.5;for(int i=0;i<4;i++){v+=a*n3(p);p*=2.1;a*=.5;}return v;}
    void main(){
      // Organic morphing displacement along normal
      float d1=fbm3(position*2.2+time*.28)*.16;
      float d2=fbm3(position*4.5-time*.18)*.07;
      float d3=fbm3(position*1.1+time*.12)*.09;
      float disp=d1+d2+d3;
      vDisp=disp;
      vec3 displaced=position+normal*disp;
      vWorld=(modelMatrix*vec4(displaced,1.)).xyz;
      vNorm=normalize(normalMatrix*(normal+displaced*.3));
      gl_Position=projectionMatrix*modelViewMatrix*vec4(displaced,1.);
    }`,
  fragmentShader:`
    precision highp float;
    uniform float time; uniform vec3 camPos;
    varying vec3 vNorm; varying vec3 vWorld; varying float vDisp;
    float h(vec2 p){return fract(sin(dot(p,vec2(127.1,311.7)))*43758.5453);}
    float n2(vec2 p){vec2 i=floor(p),f=fract(p);f=f*f*(3.-2.*f);
      return mix(mix(h(i),h(i+vec2(1,0)),f.x),mix(h(i+vec2(0,1)),h(i+vec2(1)),f.x),f.y);}
    float fbm(vec2 p){float v=0.,a=.5;for(int i=0;i<4;i++){v+=a*n2(p);p*=2.;a*=.5;}return v;}
    void main(){
      vec3 viewDir=normalize(camPos-vWorld);
      float fr=pow(1.-abs(dot(normalize(vNorm),viewDir)),2.2);
      float pulse=.72+sin(time*2.4)*.09+sin(time*6.5)*.03;
      // Surface plasma using spherical coords of world pos
      float theta=atan(vWorld.z,vWorld.x);float phi=acos(vWorld.y/length(vWorld));
      vec2 sw=vec2(theta,phi)*2.5+vec2(time*.3,time*.22);
      float plasma=fbm(sw)*.5+fbm(sw*1.8+time*.16)*.3+fbm(sw*.6-time*.1)*.2;
      // Use displacement for color variation — peaks are brighter/hotter
      float heat=smoothstep(.1,.4,vDisp*4.);
      vec3 cool=vec3(.32,.12,.02);   // deep amber-brown
      vec3 mid =vec3(.82,.52,.08);   // golden orange
      vec3 hot =vec3(1.,.92,.65);    // near-white cream core
      vec3 col=mix(cool,mid,plasma)*pulse;
      col=mix(col,hot,heat*plasma*.65);
      col+=vec3(.55,.15,.02)*fr*.9;  // warm orange fresnel rim
      col=min(col,vec3(.95,.78,.45));
      // Soft self-illumination — no harsh light patches
      float selfLit=.35+plasma*.25+vDisp*1.2;
      gl_FragColor=vec4(col*selfLit,0.97);
    }`,
  transparent:true,side:THREE.FrontSide});
const coreObj=new THREE.Mesh(new THREE.SphereGeometry(.42,128,128),coreMat);
scene.add(coreObj);

// Outer glow — smooth atmospheric halo, even all around
const glowMat=new THREE.ShaderMaterial({
  uniforms:{camPos:{value:camera.position},time:{value:0}},
  vertexShader:`varying vec3 vNorm;varying vec3 vWorld;void main(){vNorm=normalize(normalMatrix*normal);vWorld=(modelMatrix*vec4(position,1.)).xyz;gl_Position=projectionMatrix*modelViewMatrix*vec4(position,1.);}`,
  fragmentShader:`
    uniform vec3 camPos;uniform float time;
    varying vec3 vNorm;varying vec3 vWorld;
    void main(){
      vec3 view=normalize(camPos-vWorld);
      float rim=pow(1.-abs(dot(vNorm,view)),3.5);
      // Even warm halo — amber-orange like galactic core glow
      float breathe=.8+sin(time*2.1)*.12;
      vec3 col=vec3(.55,.22,.04)*rim*breathe;
      gl_FragColor=vec4(col,rim*.22);
    }`,
  transparent:true,depthWrite:false,side:THREE.BackSide,blending:THREE.AdditiveBlending});
scene.add(new THREE.Mesh(new THREE.SphereGeometry(0.88,64,64),glowMat));


// ══════════════════════════════════════════════════════
// MAGNETIC FIELD LINES — dipole arcs
// ══════════════════════════════════════════════════════
for(let i=0;i<14;i++){
  const phi=(i/14)*Math.PI*2;
  const tilt=.3+Math.abs(Math.sin(phi))*.5;
  const pts=[];
  for(let t=0;t<=40;t++){
    const a=(t/40)*Math.PI;
    const r=Math.sin(a)*Math.sin(a)*(1.4+tilt);
    const x=Math.cos(phi)*r*Math.sin(a);
    const y=(a/Math.PI-.5)*2*(1.2+tilt);
    const z=Math.sin(phi)*r*Math.sin(a);
    pts.push(new THREE.Vector3(x,y,z));
  }
  const mat=new THREE.LineBasicMaterial({
    color:new THREE.Color().setHSL(.08+Math.random()*.06,1.,.45),
    transparent:true,opacity:.06+Math.random()*.05,depthWrite:false});
  scene.add(new THREE.Line(new THREE.BufferGeometry().setFromPoints(pts),mat));
}

// ══════════════════════════════════════════════════════
// CORONA SPIKES
// ══════════════════════════════════════════════════════
const coronaSpikes=[];
for(let i=0;i<24;i++){
  const th=(i/24)*Math.PI*2,ph=(Math.random()-.5)*Math.PI;
  const dir=new THREE.Vector3(Math.cos(th)*Math.cos(ph),Math.sin(ph),Math.sin(th)*Math.cos(ph));
  const baseLen=.45+Math.random()*.55;
  const pts=[new THREE.Vector3().copy(dir).multiplyScalar(.38),new THREE.Vector3().copy(dir).multiplyScalar(.38+baseLen)];
  const mat=new THREE.LineBasicMaterial({color:new THREE.Color().setHSL(.07+Math.random()*.08,1.,.72),transparent:true,opacity:0,depthWrite:false});
  const spike=new THREE.Line(new THREE.BufferGeometry().setFromPoints(pts),mat);
  scene.add(spike);coronaSpikes.push({spike,dir,baseLen,phase:Math.random()*Math.PI*2});
}

// ══════════════════════════════════════════════════════
// ORBIT RINGS
// ══════════════════════════════════════════════════════
const rings=[];
[[1.25,0xcc6610,.30,.6,0,0],[1.65,0x8b4422,.22,0,.8,.4],[2.05,0xdd8833,.15,-.5,.3,.7]].forEach(([r,col,op,rx,ry,rz])=>{
  const pts=[];for(let i=0;i<=300;i++){const a=(i/300)*Math.PI*2;pts.push(new THREE.Vector3(Math.cos(a)*r,Math.sin(a)*r,0));}
  const ring=new THREE.Line(new THREE.BufferGeometry().setFromPoints(pts),
    new THREE.LineBasicMaterial({color:col,transparent:true,opacity:op,depthWrite:false}));
  ring.rotation.set(rx,ry,rz);scene.add(ring);rings.push(ring);
});

// ══════════════════════════════════════════════════════
// ORBITERS — 70 dots
// ══════════════════════════════════════════════════════
const orbiters=[];
for(let i=0;i<70;i++){
  const r=1.0+Math.random()*1.3,sp=.22+Math.random()*.65,tilt=(Math.random()-.5)*2.,ph=Math.random()*Math.PI*2;
  const hue=Math.random()<.6?.07+Math.random()*.08:.12+Math.random()*.05;
  const sz=.012+Math.random()*.022,br=.3+Math.random()*.5;
  const dot=new THREE.Mesh(new THREE.SphereGeometry(sz,8,8),
    new THREE.MeshBasicMaterial({color:new THREE.Color().setHSL(hue,1.,br),transparent:true,opacity:.8}));
  scene.add(dot);orbiters.push({dot,r,sp,tilt,ph});
}

// ══════════════════════════════════════════════════════
// ENERGY ARC LIGHTNING
// ══════════════════════════════════════════════════════
const arcs=[];
function makeArc(){
  const srcAngle=Math.random()*Math.PI*2;
  const r=1.2+Math.random()*.9;
  const src=new THREE.Vector3(Math.cos(srcAngle)*r,(Math.random()-.5)*.8,Math.sin(srcAngle)*r);
  const tgt=new THREE.Vector3((Math.random()-.5)*.5,(Math.random()-.5)*.5,(Math.random()-.5)*.5);
  const mid=src.clone().lerp(tgt,.5);
  mid.x+=(Math.random()-.5)*.6;mid.y+=(Math.random()-.5)*.6;mid.z+=(Math.random()-.5)*.6;
  const curve=new THREE.CatmullRomCurve3([src,mid,tgt]);
  const pts=curve.getPoints(30);
  const mat=new THREE.LineBasicMaterial({
    color:new THREE.Color().setHSL(Math.random()<.6?.08:.05,1.,.75),
    transparent:true,opacity:.0,depthWrite:false});
  const line=new THREE.Line(new THREE.BufferGeometry().setFromPoints(pts),mat);
  scene.add(line);
  arcs.push({line,life:0,maxLife:40+Math.random()*30,peak:8+Math.random()*8});
}
for(let i=0;i<6;i++)makeArc();
setInterval(()=>{if(arcs.length<8)makeArc();},600);

// ══════════════════════════════════════════════════════
// SOLAR WIND PARTICLE EMITTER
// ══════════════════════════════════════════════════════
const WIND=2000;
const wPos=new Float32Array(WIND*3),wVel=new Float32Array(WIND*3),wCol=new Float32Array(WIND*3),wAge=new Float32Array(WIND);
for(let i=0;i<WIND;i++){
  const th=Math.random()*Math.PI*2,ph=Math.acos(2*Math.random()-1);
  const sp=.012+Math.random()*.025;
  wVel[i*3]=Math.sin(ph)*Math.cos(th)*sp;wVel[i*3+1]=Math.sin(ph)*Math.sin(th)*sp;wVel[i*3+2]=Math.cos(ph)*sp;
  wPos[i*3]=wVel[i*3]*.4;wPos[i*3+1]=wVel[i*3+1]*.4;wPos[i*3+2]=wVel[i*3+2]*.4;
  const hue=Math.random()<.6?.07:.12;const c=new THREE.Color().setHSL(hue,1.,.75);
  wCol[i*3]=c.r;wCol[i*3+1]=c.g;wCol[i*3+2]=c.b;
  wAge[i]=Math.random()*150;
}
const windGeo=new THREE.BufferGeometry();
windGeo.setAttribute('position',new THREE.BufferAttribute(wPos,3));
windGeo.setAttribute('aCol',new THREE.BufferAttribute(wCol,3));
const windMat=new THREE.PointsMaterial({vertexColors:true,size:.025,transparent:true,opacity:.5,depthWrite:false,blending:THREE.AdditiveBlending,sizeAttenuation:true});
const windPoints=new THREE.Points(windGeo,windMat);scene.add(windPoints);

// ══════════════════════════════════════════════════════
// SHOCKWAVE RINGS
// ══════════════════════════════════════════════════════
const shockwaves=[];
function spawnShock(){
  const geo=new THREE.RingGeometry(.01,.045,64);
  const mat=new THREE.MeshBasicMaterial({color:0xff8822,transparent:true,opacity:.75,depthWrite:false,side:THREE.DoubleSide,blending:THREE.AdditiveBlending});
  const wave=new THREE.Mesh(geo,mat);
  wave.rotation.set(Math.random()*Math.PI,Math.random()*Math.PI,0);
  scene.add(wave);shockwaves.push({wave,t:0});
}
setInterval(spawnShock,2800);setTimeout(spawnShock,300);setTimeout(spawnShock,1400);

// ══════════════════════════════════════════════════════
// CORE ERUPTION BURST (every 5s, 400 particles)
// ══════════════════════════════════════════════════════
const burstParticles=[];
function spawnEruption(){
  const N=400;
  for(let i=0;i<N;i++){
    const th=Math.random()*Math.PI*2,ph=Math.acos(2*Math.random()-1);
    const speed=.05+Math.random()*.12;
    const vx=Math.sin(ph)*Math.cos(th)*speed,vy=Math.sin(ph)*Math.sin(th)*speed,vz=Math.cos(ph)*speed;
    const hue=Math.random()<.5?.07:.1;const c=new THREE.Color().setHSL(hue,1.,.85);
    const geo=new THREE.BufferGeometry().setFromPoints([new THREE.Vector3(0,0,0)]);
    const mat=new THREE.PointsMaterial({color:c,size:.04,transparent:true,opacity:.9,depthWrite:false,blending:THREE.AdditiveBlending});
    const p=new THREE.Points(geo,mat);scene.add(p);
    burstParticles.push({p,vx,vy,vz,life:0,maxLife:50+Math.random()*30});
  }
}
setInterval(spawnEruption,5000);setTimeout(spawnEruption,800);

// ══════════════════════════════════════════════════════
// FLUID SIM + BACKGROUND PLANE
// ══════════════════════════════════════════════════════
let rt1=makeRT(W,H),rt2=makeRT(W,H);clearRT(rt1);clearRT(rt2);
let mxActive=false,mx=.5,my=.5,mxPrev=.5,myPrev=.5;
const fluidMat=new THREE.ShaderMaterial({
  uniforms:{prev:{value:null},mouse:{value:new THREE.Vector2(.5,.5)},prevMouse:{value:new THREE.Vector2(.5,.5)},res:{value:new THREE.Vector2(W,H)},active:{value:0.}},
  vertexShader:'void main(){gl_Position=vec4(position,1.);}',
  fragmentShader:`uniform sampler2D prev;uniform vec2 mouse,prevMouse,res;uniform float active;
    void main(){vec2 uv=gl_FragCoord.xy/res;vec3 col=texture2D(prev,uv).rgb;
    if(active>.5){vec2 vel=mouse-prevMouse;float sp=length(vel)*16.;float d=distance(uv,mouse);
    float splash=exp(-d*7.)*min(sp,.9)*1.3;vec3 ink=vec3(.02+mouse.x*.2,.12+(1.-mouse.y)*.26,.35+mouse.y*.42);
    col+=ink*splash;col=mix(col,texture2D(prev,uv-vel*.03).rgb,.18);}
    col*=.975;col=min(col,vec3(.7));gl_FragColor=vec4(col,1.);}`});
const fluidScene=new THREE.Scene(),fluidCam=new THREE.OrthographicCamera(-1,1,1,-1,0,1);
fluidScene.add(new THREE.Mesh(new THREE.PlaneGeometry(2,2),fluidMat));
const bgMat=new THREE.ShaderMaterial({
  uniforms:{tex:{value:null}},
  vertexShader:'varying vec2 v;void main(){v=uv;gl_Position=projectionMatrix*modelViewMatrix*vec4(position,1.);}',
  fragmentShader:`uniform sampler2D tex;varying vec2 v;
    void main(){vec3 c=texture2D(tex,v).rgb;c*=2.2;c=c/(1.+c);float lum=dot(c,vec3(.299,.587,.114));c=mix(vec3(lum),c,1.25);gl_FragColor=vec4(c,1.);}`,
  depthWrite:false});
const bgPlane=new THREE.Mesh(new THREE.PlaneGeometry(24,24),bgMat);bgPlane.position.z=-5.5;scene.add(bgPlane);

// ══════════════════════════════════════════════════════
// POST-PROCESSING: bloom → god rays → chroma → lens streak → grain
// ══════════════════════════════════════════════════════
const composer=new THREE.EffectComposer(renderer);
composer.addPass(new THREE.RenderPass(scene,camera));

// Bloom — lowered strength to fix brightness
const bloom=new THREE.UnrealBloomPass(new THREE.Vector2(W,H),1.1,0.55,0.82);
composer.addPass(bloom);

// GOD RAYS — radial light shaft blur from core screen position
const godRaysPass=new THREE.ShaderPass({
  uniforms:{tDiffuse:{value:null},coreUV:{value:new THREE.Vector2(.5,.5)},exposure:{value:.12},decay:{value:.97},weight:{value:.010},samples:{value:80}},
  vertexShader:'varying vec2 vUv;void main(){vUv=uv;gl_Position=projectionMatrix*modelViewMatrix*vec4(position,1.);}',
  fragmentShader:`
    uniform sampler2D tDiffuse;uniform vec2 coreUV;uniform float exposure,decay,weight;
    varying vec2 vUv;
    void main(){
      vec2 delta=(vUv-coreUV)/80.;vec2 uv=vUv;float illum=1.;vec3 rays=vec3(0.);
      for(int i=0;i<80;i++){
        uv-=delta;vec2 suv=clamp(uv,0.,1.);
        vec3 s=texture2D(tDiffuse,suv).rgb;
        float br=max(s.r,max(s.g,s.b));
        rays+=s*illum*weight*smoothstep(.15,.6,br);illum*=decay;}
      vec3 orig=texture2D(tDiffuse,vUv).rgb;
      gl_FragColor=vec4(orig+rays*exposure,1.);}`,
});
composer.addPass(godRaysPass);

// ANAMORPHIC LENS STREAK — horizontal streak across frame from core
const streakPass=new THREE.ShaderPass({
  uniforms:{tDiffuse:{value:null},coreUV:{value:new THREE.Vector2(.5,.5)},intensity:{value:.18},time:{value:0}},
  vertexShader:'varying vec2 vUv;void main(){vUv=uv;gl_Position=projectionMatrix*modelViewMatrix*vec4(position,1.);}',
  fragmentShader:`
    uniform sampler2D tDiffuse;uniform vec2 coreUV;uniform float intensity,time;
    varying vec2 vUv;
    void main(){
      vec3 orig=texture2D(tDiffuse,vUv).rgb;
      // Horizontal streak
      float dy=abs(vUv.y-coreUV.y);
      float streak=exp(-dy*dy*180.)*intensity;
      // Streak color — warm gold anamorphic
      float dx=abs(vUv.x-.5);float falloff=1.-smoothstep(.0,.5,dx);
      vec3 streakCol=vec3(1.,.72,.18)*streak*falloff*.7;
      // Flicker
      float fl=.85+sin(time*8.7)*.15;
      gl_FragColor=vec4(orig+streakCol*fl,1.);}`,
});
composer.addPass(streakPass);

// CHROMATIC ABERRATION
const chromaPass=new THREE.ShaderPass({
  uniforms:{tDiffuse:{value:null},amount:{value:.0035}},
  vertexShader:'varying vec2 vUv;void main(){vUv=uv;gl_Position=projectionMatrix*modelViewMatrix*vec4(position,1.);}',
  fragmentShader:`uniform sampler2D tDiffuse;uniform float amount;varying vec2 vUv;
    void main(){vec2 d=vUv-.5;float dist=length(d);vec2 off=normalize(d)*amount*dist*dist*3.;
    float r=texture2D(tDiffuse,vUv+off).r;float g=texture2D(tDiffuse,vUv).g;float b=texture2D(tDiffuse,vUv-off).b;
    gl_FragColor=vec4(r,g,b,1.);}`,
});
composer.addPass(chromaPass);

// FILM GRAIN + VIGNETTE (final)
const grainPass=new THREE.ShaderPass({
  uniforms:{tDiffuse:{value:null},time:{value:0},grain:{value:.025}},
  vertexShader:'varying vec2 vUv;void main(){vUv=uv;gl_Position=projectionMatrix*modelViewMatrix*vec4(position,1.);}',
  fragmentShader:`uniform sampler2D tDiffuse;uniform float time,grain;varying vec2 vUv;
    float rnd(vec2 p){return fract(sin(dot(p+time,vec2(127.1,311.7)))*43758.5453);}
    void main(){vec4 col=texture2D(tDiffuse,vUv);col.rgb+=rnd(vUv)*grain-grain*.5;
    float vig=smoothstep(1.05,.3,length(vUv-.5)*1.55);col.rgb*=vig;
    gl_FragColor=vec4(clamp(col.rgb,0.,1.),1.);}`,
  renderToScreen:true
});
composer.addPass(grainPass);

// ══════════════════════════════════════════════════════
// LENS FLARE ELEMENTS (billboard planes in 3D scene)
// ══════════════════════════════════════════════════════
const flareGroup=new THREE.Group();scene.add(flareGroup);
// Central glow flare
const flareMat=new THREE.ShaderMaterial({
  uniforms:{time:{value:0}},
  vertexShader:`varying vec2 vUv;void main(){vUv=uv;gl_Position=projectionMatrix*modelViewMatrix*vec4(position,1.);}`,
  fragmentShader:`uniform float time;varying vec2 vUv;
    void main(){vec2 c=vUv-.5;float d=length(c);float a=pow(1.-d*2.,4.5)*.52;
    if(a<.001)discard;float fl=.85+sin(time*5.5)*.15;
    vec3 col=mix(vec3(1.,.55,.12),vec3(1.,.95,.72),pow(1.-d*2.,8.));
    gl_FragColor=vec4(col*fl,a*fl);}`,
  transparent:true,depthWrite:false,blending:THREE.AdditiveBlending,side:THREE.DoubleSide});
flareGroup.add(new THREE.Mesh(new THREE.PlaneGeometry(.7,.7),flareMat));
// Hexagonal aperture ring
const hexMat=new THREE.ShaderMaterial({
  uniforms:{time:{value:0}},
  vertexShader:`varying vec2 vUv;void main(){vUv=uv;gl_Position=projectionMatrix*modelViewMatrix*vec4(position,1.);}`,
  fragmentShader:`uniform float time;varying vec2 vUv;
    void main(){vec2 c=vUv-.5;float d=length(c);
    // Hex shape
    float ang=atan(c.y,c.x);float hex=cos(floor(ang/1.047)*1.047-ang)*length(c)/.5;
    float ring=exp(-pow(hex-.42,2.)*90.)*.3+exp(-pow(d-.28,2.)*120.)*.2;
    float fl=.7+sin(time*3.2)*.3;
    gl_FragColor=vec4(vec3(1.,.58,.18)*ring*fl,ring*fl*.7);}`,
  transparent:true,depthWrite:false,blending:THREE.AdditiveBlending,side:THREE.DoubleSide});
flareGroup.add(new THREE.Mesh(new THREE.PlaneGeometry(1.4,1.4),hexMat));

// Input
window.addEventListener('mousemove',e=>{mxActive=true;mxPrev=mx;myPrev=my;mx=e.clientX/W;my=1-e.clientY/H;});
window.addEventListener('resize',()=>{
  W=innerWidth;H=innerHeight;renderer.setSize(W,H);composer.setSize(W,H);
  camera.aspect=W/H;camera.updateProjectionMatrix();
  rt1.dispose();rt2.dispose();rt1=makeRT(W,H);rt2=makeRT(W,H);clearRT(rt1);clearRT(rt2);
  fluidMat.uniforms.res.value.set(W,H);
});
function makeRT(w,h){return new THREE.WebGLRenderTarget(w,h,{minFilter:THREE.LinearFilter,magFilter:THREE.LinearFilter,format:THREE.RGBAFormat});}
function clearRT(rt){renderer.setRenderTarget(rt);renderer.setClearColor(0,1);renderer.clear(true,true,true);renderer.setRenderTarget(null);}

// ══════════════════════════════════════════════════════
// ANIMATE
// ══════════════════════════════════════════════════════
// Layered JS value noise — gives camera and core genuinely aperiodic motion.
// Pure sine waves create the "screensaver" look; FBM noise breaks that pattern.
function jfract(x){return x-Math.floor(x);}
function jnoise(x){const i=Math.floor(x),f=jfract(x),u=f*f*(3-2*f);
  return jfract(Math.sin(i*127.1)*43758.5453)*(1-u)+jfract(Math.sin((i+1)*127.1)*43758.5453)*u;}
function jfbm(x){return jnoise(x)*.5+jnoise(x*2.1)*.25+jnoise(x*4.3)*.125;}

let time=0,coreRef={rotation:{x:0,y:0,z:0}};

// Project core to screen UV for god rays
const coreScreenPos=new THREE.Vector3();
const coreWorldPos=new THREE.Vector3(0,0,0);

(function animate(){
  requestAnimationFrame(animate);
  time+=.006;

  // Fluid sim
  fluidMat.uniforms.prev.value=rt1.texture;
  fluidMat.uniforms.mouse.value.set(mx,my);
  fluidMat.uniforms.prevMouse.value.set(mxPrev,myPrev);
  fluidMat.uniforms.active.value=mxActive?1.:0.;
  renderer.setRenderTarget(rt2);renderer.render(fluidScene,fluidCam);
  renderer.setRenderTarget(null);
  const tmp=rt1;rt1=rt2;rt2=tmp;bgMat.uniforms.tex.value=rt1.texture;
  mxActive=false;

  // Nebula drift
  nebulaMeshes.forEach((m,i)=>m.material.uniforms.time.value=time*(1-.1*i));

  // Galaxy
  galMat.uniforms.time.value=time;
  (scene.children.find(c=>c.isPoints&&c.geometry.attributes.aOff))?.rotation&&
    (scene.children.filter(c=>c.isPoints&&c.geometry.attributes.aOff)[0].rotation.y+=.00006);

  // Motes twinkle
  scene.children.filter(c=>c.isPoints&&c.geometry===mGeo)[0]?.material&&
    (scene.children.find(c=>c.isPoints&&c.geometry===mGeo).material.uniforms.time.value=time);

  // Core
  // Variable rotation: noise-modulated speed mimics differential rotation —
  // the equatorial bulge accelerates and decelerates, never constant
  coreObj.rotation.y+=0.0012+jnoise(time*.3)*.0008;
  coreMat.uniforms.time.value=time;coreMat.uniforms.camPos.value.copy(camera.position);
  glowMat.uniforms.time.value=time;glowMat.uniforms.camPos.value.copy(camera.position);
  // Three-layer pulse: slow breathe (cinematic pacing) + mid flicker + fast micro
  // Scene dips to ~72% intensity periodically — prevents constant brightness peak.
  // Real stellar surfaces are NEVER two-frequency: this is the key realism upgrade.
  const breathe=0.72+jfbm(time*.11)*.28;
  coreLight.intensity=breathe*(0.78+jnoise(time*3.8)*.14+jnoise(time*9.2)*.05);

  // Corona
  coronaSpikes.forEach(c=>{
    const p=.25+Math.sin(time*2.2+c.phase)*.45+Math.sin(time*5.5+c.phase*1.9)*.18;
    c.spike.material.opacity=Math.max(0,p*.6);
    const len=c.baseLen*(.5+p*.9);
    const pos=c.spike.geometry.attributes.position;
    pos.setXYZ(1,c.dir.x*(.38+len),c.dir.y*(.38+len),c.dir.z*(.38+len));pos.needsUpdate=true;
  });

  // Rings
  rings[0].rotation.z+=.004;rings[1].rotation.x+=.003;rings[2].rotation.y+=.005;

  // Orbiters
  orbiters.forEach(o=>{const a=time*o.sp+o.ph;o.dot.position.set(Math.cos(a)*o.r,Math.sin(o.tilt)*Math.sin(a)*o.r*.55,Math.sin(a)*o.r*Math.cos(o.tilt));});

  // Shockwaves
  for(let i=shockwaves.length-1;i>=0;i--){
    const sw=shockwaves[i];sw.t+=.024;
    sw.wave.scale.setScalar(sw.t*4.5);
    sw.wave.material.opacity=Math.max(0,.75*(1-sw.t));
    if(sw.t>=1){scene.remove(sw.wave);shockwaves.splice(i,1);}
  }

  // Energy arcs
  arcs.forEach((a,i)=>{
    a.life++;const phase=a.life/a.maxLife;
    if(phase<.15)a.line.material.opacity=phase/.15*.7;
    else if(phase<.5)a.line.material.opacity=.7;
    else a.line.material.opacity=Math.max(0,.7*(1-phase)/.5);
    if(a.life>=a.maxLife){
      scene.remove(a.line);arcs.splice(i,1);makeArc();
    }
  });

  // Solar wind
  const wp=windGeo.attributes.position;
  for(let i=0;i<WIND;i++){
    wAge[i]++;
    if(wAge[i]>120+Math.random()*60){
      wAge[i]=0;const th=Math.random()*Math.PI*2,ph=Math.acos(2*Math.random()-1);
      const sp=.012+Math.random()*.025;
      wVel[i*3]=Math.sin(ph)*Math.cos(th)*sp;wVel[i*3+1]=Math.sin(ph)*Math.sin(th)*sp;wVel[i*3+2]=Math.cos(ph)*sp;
      wp.setXYZ(i,wVel[i*3]*.4,wVel[i*3+1]*.4,wVel[i*3+2]*.4);
    } else {
      // Irrational-ratio turbulence: phi (1.618) and pi (3.141) ensure the
      // per-particle beat pattern never becomes periodic — cheap but aperiodic.
      // Solar wind has Parker spiral turbulence; this approximates it.
      const tb=.00035;const ii=i*.017;
      wp.setXYZ(i,
        wp.getX(i)+wVel[i*3]  +Math.sin(time*2.393+ii)*tb,
        wp.getY(i)+wVel[i*3+1]+Math.sin(time*1.618+ii*1.83)*tb,
        wp.getZ(i)+wVel[i*3+2]+Math.sin(time*3.141+ii*2.71)*tb);
    }
  }
  wp.needsUpdate=true;

  // Eruption bursts
  for(let i=burstParticles.length-1;i>=0;i--){
    const b=burstParticles[i];b.life++;
    const ph=b.life/b.maxLife;
    b.p.position.x+=b.vx;b.p.position.y+=b.vy;b.p.position.z+=b.vz;
    b.p.material.opacity=ph<.2?ph/.2*.9:Math.max(0,.9*(1-ph)/.8);
    if(b.life>=b.maxLife){scene.remove(b.p);burstParticles.splice(i,1);}
  }

  // Lens flare billboard (always face camera)
  flareGroup.quaternion.copy(camera.quaternion);
  flareMat.uniforms.time.value=time;hexMat.uniforms.time.value=time;

  // Project core to UV for god rays
  coreScreenPos.copy(coreWorldPos).project(camera);
  godRaysPass.uniforms.coreUV.value.set((coreScreenPos.x+1)*.5,(.5+coreScreenPos.y*.5));
  streakPass.uniforms.coreUV.value.y=(coreScreenPos.y+1)*.5;
  streakPass.uniforms.time.value=time;
  grainPass.uniforms.time.value=time*.9;

  // Cinematic floating camera — layered noise replaces locked sine orbit.
  // Feels like a weightless observatory drifting, not a math function executing.
  // Slow base frequency (.038) keeps motion imperceptible frame-to-frame but
  // clearly non-repeating over seconds — the Interstellar/Hubble hallmark.
  const cT=time*.038;
  const camOrbitR=4.5+jfbm(cT*.6)*.7-.35;           // 4.15–4.76 range
  const camOrbitA=time*.072+jfbm(cT*1.2)*.15;        // orbit + slow angular wander
  const camDriftY=(jfbm(cT*.8+5.)-.5)*1.5;           // asymmetric vertical drift
  camera.position.x=Math.sin(camOrbitA)*camOrbitR*.38;
  camera.position.y=camDriftY;
  camera.position.z=Math.cos(camOrbitA)*camOrbitR*.9;
  // Micro-jitter: offsetting the lookAt target ~0.01 units gives handheld
  // imperfection without visible shakiness — camera "breathes" rather than locks
  const lx=(jfbm(time*2.9+1.7)-.5)*.012;
  const ly=(jfbm(time*2.3+4.1)-.5)*.008;
  camera.lookAt(lx,ly,0);

  composer.render();
})();
</script>
</body>
</html>

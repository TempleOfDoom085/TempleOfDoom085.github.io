<script src="/vendor/three/CopyShader.js"></script>

<script>
'use strict';
let W=innerWidth,H=innerHeight;
const canvas=document.getElementById('c');

// ══════════════════════════════════════════════════════
// QUALITY TIERS — picked from hardware, then adapted live
// tier 2 = desktop GPU · 1 = modest laptop · 0 = phone / iGPU
// ══════════════════════════════════════════════════════
const coarse=matchMedia('(pointer:coarse)').matches;
const reduceMotion=matchMedia('(prefers-reduced-motion: reduce)').matches;
const cores=navigator.hardwareConcurrency||4;
const mem=navigator.deviceMemory||4;
let tier=(coarse||mem<4)?0:(cores<=4?1:2);
const TIERS=[
  {dpr:0.85,vol:0.30,steps:22,shadow:0},   // 0 — low
  {dpr:1.15,vol:0.42,steps:32,shadow:1},   // 1 — medium
  {dpr:1.50,vol:0.55,steps:48,shadow:1}    // 2 — high
];
const STAR_COUNT=[12000,26000,45000][tier];

const renderer=new THREE.WebGLRenderer({canvas,antialias:false,alpha:false,powerPreference:'high-performance',stencil:false});
renderer.setPixelRatio(Math.min(devicePixelRatio,TIERS[tier].dpr));
renderer.setSize(W,H);
renderer.setClearColor(0x000000,1);
renderer.toneMapping=THREE.ACESFilmicToneMapping;renderer.toneMappingExposure=0.62;

const scene=new THREE.Scene();
const camera=new THREE.PerspectiveCamera(55,W/H,0.1,200);
camera.position.z=4.5;

// ══════════════════════════════════════════════════════
// STARFIELD — spiral arms + halo, one draw call
// ══════════════════════════════════════════════════════
const TOTAL=STAR_COUNT;
const gPos=new Float32Array(TOTAL*3),gCol=new Float32Array(TOTAL*3),gSz=new Float32Array(TOTAL),gOff=new Float32Array(TOTAL);
for(let i=0;i<TOTAL;i++){
  const layer=i/TOTAL;
  let x,y,z;
  if(layer<0.55){
    const arm=Math.floor(Math.random()*3),armAngle=(arm/3)*Math.PI*2;
    const r=0.5+Math.pow(Math.random(),0.7)*20;
    const spread=0.3+r*.09;
    const theta=armAngle+r*.3+(Math.random()-.5)*.7;
    x=Math.cos(theta)*r+(Math.random()-.5)*spread;
    y=(Math.random()-.5)*spread*.6;
    z=Math.sin(theta)*r+(Math.random()-.5)*spread;
  } else {
    const r=3+Math.random()*18;
    const th=Math.random()*Math.PI*2,ph=Math.acos(2*Math.random()-1);
    x=r*Math.sin(ph)*Math.cos(th);y=r*Math.sin(ph)*Math.sin(th);z=r*Math.cos(ph);
  }
  gPos[i*3]=x;gPos[i*3+1]=y;gPos[i*3+2]=z;
  const c=Math.random();
  // Real deep-field palette: mostly white/cream, subtle tints only
  if(c<.08){gCol[i*3]=.82;gCol[i*3+1]=.90;gCol[i*3+2]=1.;}        // pale blue-white (O/B type)
  else if(c<.20){gCol[i*3]=.95;gCol[i*3+1]=.97;gCol[i*3+2]=1.;}   // cool blue-white (A type)
  else if(c<.38){gCol[i*3]=1.;gCol[i*3+1]=.98;gCol[i*3+2]=.92;}   // warm white (F type)
  else if(c<.58){gCol[i*3]=1.;gCol[i*3+1]=.96;gCol[i*3+2]=.86;}   // pale yellow (G type)
  else if(c<.74){gCol[i*3]=1.;gCol[i*3+1]=.93;gCol[i*3+2]=.78;}   // pale amber (K type)
  else if(c<.88){gCol[i*3]=.96;gCol[i*3+1]=.95;gCol[i*3+2]=.94;}  // neutral white
  else{gCol[i*3]=.88;gCol[i*3+1]=.92;gCol[i*3+2]=1.;}              // faint blue (distant hot)
  gSz[i]=.25+Math.random()*1.2;gOff[i]=Math.random()*Math.PI*2;
}
const galGeo=new THREE.BufferGeometry();
galGeo.setAttribute('position',new THREE.BufferAttribute(gPos,3));
galGeo.setAttribute('aCol',new THREE.BufferAttribute(gCol,3));
galGeo.setAttribute('aSize',new THREE.BufferAttribute(gSz,1));
galGeo.setAttribute('aOff',new THREE.BufferAttribute(gOff,1));
const galMat=new THREE.ShaderMaterial({
  uniforms:{time:{value:0},pxs:{value:renderer.getPixelRatio()/1.5}},
  vertexShader:`attribute vec3 aCol;attribute float aSize,aOff;uniform float time,pxs;varying vec3 vC;varying float vA;
    void main(){vC=aCol;float tw=.06+.19*abs(sin(time*1.6+aOff));vA=tw;vec4 mv=modelViewMatrix*vec4(position,1.);
    gl_PointSize=min(aSize*pxs*(150./-mv.z),22.);gl_Position=projectionMatrix*mv;}`,
  fragmentShader:`varying vec3 vC;varying float vA;
    void main(){float d=length(gl_PointCoord-.5)*2.;if(d>1.)discard;
    float a=pow(1.-d,2.)*vA;gl_FragColor=vec4(vC,a);}`,
  transparent:true,depthWrite:false,blending:THREE.AdditiveBlending
});
const galaxy=new THREE.Points(galGeo,galMat);scene.add(galaxy);

// ══════════════════════════════════════════════════════
// FOREGROUND SPARKLE MOTES — diffraction spikes, parallax
// ══════════════════════════════════════════════════════
const MOTES=coarse?140:300;
const mPos=new Float32Array(MOTES*3),mCol=new Float32Array(MOTES*3),mSz=new Float32Array(MOTES),mOff2=new Float32Array(MOTES);
for(let i=0;i<MOTES;i++){
  mPos[i*3]=(Math.random()-.5)*6;mPos[i*3+1]=(Math.random()-.5)*4;mPos[i*3+2]=1.5+Math.random()*2.5;
  const h=Math.random()<.5?.08:.12;const c=new THREE.Color().setHSL(h,1.,.75);
  mCol[i*3]=c.r;mCol[i*3+1]=c.g;mCol[i*3+2]=c.b;
  mSz[i]=1.5+Math.random()*3.5;mOff2[i]=Math.random()*Math.PI*2;
}
const mGeo=new THREE.BufferGeometry();
mGeo.setAttribute('position',new THREE.BufferAttribute(mPos,3));
mGeo.setAttribute('aCol',new THREE.BufferAttribute(mCol,3));
mGeo.setAttribute('aSize',new THREE.BufferAttribute(mSz,1));
mGeo.setAttribute('aOff',new THREE.BufferAttribute(mOff2,1));
const moteMat=new THREE.ShaderMaterial({
  uniforms:{time:{value:0},pxs:{value:renderer.getPixelRatio()/1.5}},
  vertexShader:`attribute vec3 aCol;attribute float aSize,aOff;uniform float time,pxs;varying vec3 vC;varying float vA;
    void main(){vC=aCol;float tw=.2+.8*pow(abs(sin(time*2.2+aOff)),3.);vA=tw;vec4 mv=modelViewMatrix*vec4(position,1.);
    gl_PointSize=min(aSize*tw*pxs*(300./-mv.z),96.);gl_Position=projectionMatrix*mv;}`,
  fragmentShader:`varying vec3 vC;varying float vA;
    void main(){vec2 c=gl_PointCoord-.5;float d=length(c)*2.;if(d>1.)discard;
    float spike=max(exp(-abs(c.x)*80.)*exp(-abs(c.y)*8.),exp(-abs(c.y)*80.)*exp(-abs(c.x)*8.));
    float core=exp(-d*d*30.);
    float a=(core+spike*.6)*vA;gl_FragColor=vec4(vC,a);}`,
  transparent:true,depthWrite:false,blending:THREE.AdditiveBlending
});
scene.add(new THREE.Points(mGeo,moteMat));

// ══════════════════════════════════════════════════════
// LIGHTING + CORE HALO
// ══════════════════════════════════════════════════════
scene.add(new THREE.AmbientLight(0x06020f,1.4));
const coreLight=new THREE.PointLight(0x7722ff,2.2,20);scene.add(coreLight);

const glowMat=new THREE.ShaderMaterial({
  uniforms:{time:{value:0}},
  vertexShader:`varying vec2 vUv;void main(){vUv=uv;gl_Position=projectionMatrix*modelViewMatrix*vec4(position,1.);}`,
  fragmentShader:`uniform float time;varying vec2 vUv;
    void main(){
      float d=length(vUv-.5)*2.;
      if(d>=1.)discard;
      float breathe=.78+sin(time*1.6)*.14+sin(time*3.4)*.06;
      float halo=pow(1.-d,3.0);      // wide corona
      float inner=pow(1.-d,9.0);     // tight core
      vec3 col=mix(vec3(.30,.05,.72),vec3(.80,.44,1.),inner);
      gl_FragColor=vec4(col*breathe*(halo*.26+inner*.80),1.);
    }`,
  transparent:true,depthWrite:false,blending:THREE.AdditiveBlending,side:THREE.DoubleSide});

// ══════════════════════════════════════════════════════
// CORONA SPIKES — 24 spikes, 1 draw call, animated on GPU
// ══════════════════════════════════════════════════════
const SPIKES=24;
const spPos=new Float32Array(SPIKES*2*3),spDir=new Float32Array(SPIKES*2*3),
      spBase=new Float32Array(SPIKES*2),spPhase=new Float32Array(SPIKES*2),
      spTip=new Float32Array(SPIKES*2),spCol=new Float32Array(SPIKES*2*3);
for(let i=0;i<SPIKES;i++){
  const th=(i/SPIKES)*Math.PI*2,ph=(Math.random()-.5)*Math.PI;
  const dx=Math.cos(th)*Math.cos(ph),dy=Math.sin(ph),dz=Math.sin(th)*Math.cos(ph);
  const baseLen=.16+Math.random()*.30,phase=Math.random()*Math.PI*2;
  const c=new THREE.Color().setHSL(.07+Math.random()*.08,1.,.72);
  for(let v=0;v<2;v++){
    const k=i*2+v;
    spDir[k*3]=dx;spDir[k*3+1]=dy;spDir[k*3+2]=dz;
    spBase[k]=baseLen;spPhase[k]=phase;spTip[k]=v;
    spCol[k*3]=c.r;spCol[k*3+1]=c.g;spCol[k*3+2]=c.b;
  }
}
const spGeo=new THREE.BufferGeometry();
spGeo.setAttribute('position',new THREE.BufferAttribute(spPos,3)); // unused, shader builds it
spGeo.setAttribute('aDir',new THREE.BufferAttribute(spDir,3));
spGeo.setAttribute('aBase',new THREE.BufferAttribute(spBase,1));
spGeo.setAttribute('aPhase',new THREE.BufferAttribute(spPhase,1));
spGeo.setAttribute('aTip',new THREE.BufferAttribute(spTip,1));
spGeo.setAttribute('aCol',new THREE.BufferAttribute(spCol,3));
spGeo.boundingSphere=new THREE.Sphere(new THREE.Vector3(),2);
const spikeMat=new THREE.ShaderMaterial({
  uniforms:{time:{value:0}},
  vertexShader:`attribute vec3 aDir,aCol;attribute float aBase,aPhase,aTip;uniform float time;
    varying vec3 vC;varying float vA;
    void main(){
      float p=.25+sin(time*2.2+aPhase)*.45+sin(time*5.5+aPhase*1.9)*.18;
      vA=max(0.,p*.26);vC=aCol;
      float len=aBase*(.5+p*.9);
      vec3 pos=aDir*(.38+len*aTip);
      gl_Position=projectionMatrix*modelViewMatrix*vec4(pos,1.);
    }`,
  fragmentShader:`varying vec3 vC;varying float vA;void main(){gl_FragColor=vec4(vC,vA);}`,
  transparent:true,depthWrite:false,blending:THREE.AdditiveBlending});
scene.add(new THREE.LineSegments(spGeo,spikeMat));

// ══════════════════════════════════════════════════════
// DEBRIS FIELDS — irregular point rings
// ══════════════════════════════════════════════════════
const rings=[];
[[1.25,0x6622dd,.11,.6,0,0],[1.65,0x4408bb,.09,0,.8,.4],[2.05,0xbb6611,.07,-.5,.3,.7]].forEach(([r,col,op,rx,ry,rz])=>{
  const N=240;const rPos=new Float32Array(N*3);
  for(let i=0;i<N;i++){
    const a=(i/N)*Math.PI*2+(Math.random()-.5)*.18;
    const jR=r+(Math.random()-.5)*.22;const jY=(Math.random()-.5)*.15;
    rPos[i*3]=Math.cos(a)*jR;rPos[i*3+1]=jY;rPos[i*3+2]=Math.sin(a)*jR;
  }
  const geo=new THREE.BufferGeometry();geo.setAttribute('position',new THREE.BufferAttribute(rPos,3));
  const debris=new THREE.Points(geo,new THREE.PointsMaterial({color:col,size:.014,transparent:true,opacity:op,depthWrite:false,blending:THREE.AdditiveBlending}));
  debris.rotation.set(rx,ry,rz);scene.add(debris);rings.push(debris);
});

// ══════════════════════════════════════════════════════
// ORBITERS — 42 bodies, 1 draw call, orbits solved on GPU
// ══════════════════════════════════════════════════════
const ORB=42;
const oPos=new Float32Array(ORB*3),oR=new Float32Array(ORB),oSp=new Float32Array(ORB),
      oTilt=new Float32Array(ORB),oPh=new Float32Array(ORB),oCol=new Float32Array(ORB*3),oSz=new Float32Array(ORB);
for(let i=0;i<ORB;i++){
  oR[i]=1.0+Math.random()*1.3;oSp[i]=.12+Math.random()*.38;
  oTilt[i]=(Math.random()-.5)*2.;oPh[i]=Math.random()*Math.PI*2;
  // Violet (~70%) or amber (~30%) — strict 2-hue palette
  const hue=Math.random()<.7?.72+Math.random()*.06:.07+Math.random()*.04;
  const c=new THREE.Color().setHSL(hue,1.,.25+Math.random()*.45);
  oCol[i*3]=c.r;oCol[i*3+1]=c.g;oCol[i*3+2]=c.b;
  oSz[i]=2.2+Math.random()*3.8;
}
const orbGeo=new THREE.BufferGeometry();
orbGeo.setAttribute('position',new THREE.BufferAttribute(oPos,3));
orbGeo.setAttribute('aR',new THREE.BufferAttribute(oR,1));
orbGeo.setAttribute('aSp',new THREE.BufferAttribute(oSp,1));
orbGeo.setAttribute('aTilt',new THREE.BufferAttribute(oTilt,1));
orbGeo.setAttribute('aPh',new THREE.BufferAttribute(oPh,1));
orbGeo.setAttribute('aCol',new THREE.BufferAttribute(oCol,3));
orbGeo.setAttribute('aSize',new THREE.BufferAttribute(oSz,1));
orbGeo.boundingSphere=new THREE.Sphere(new THREE.Vector3(),4);
const orbMat=new THREE.ShaderMaterial({
  uniforms:{time:{value:0},pxs:{value:renderer.getPixelRatio()/1.5}},
  vertexShader:`attribute vec3 aCol;attribute float aR,aSp,aTilt,aPh,aSize;uniform float time,pxs;varying vec3 vC;
    void main(){
      vC=aCol;
      float a=time*aSp+aPh;
      float er=aR*(1.+.14*sin(a*.5+aPh));
      vec3 p=vec3(cos(a)*er, sin(aTilt)*sin(a)*er*.52, sin(a)*er*cos(aTilt));
      vec4 mv=modelViewMatrix*vec4(p,1.);
      gl_PointSize=min(aSize*pxs*(16./-mv.z),48.);
      gl_Position=projectionMatrix*mv;
    }`,
  fragmentShader:`varying vec3 vC;void main(){
    float d=length(gl_PointCoord-.5)*2.;if(d>1.)discard;
    gl_FragColor=vec4(vC,pow(1.-d,1.6)*.8);}`,
  transparent:true,depthWrite:false,blending:THREE.AdditiveBlending});
scene.add(new THREE.Points(orbGeo,orbMat));

// ══════════════════════════════════════════════════════
// ENERGY ARC LIGHTNING
// ══════════════════════════════════════════════════════
const arcs=[];
function makeArc(){
  const srcAngle=Math.random()*Math.PI*2;
  const r=1.2+Math.random()*.9;
  const src=new THREE.Vector3(Math.cos(srcAngle)*r,(Math.random()-.5)*.8,Math.sin(srcAngle)*r);
  const tgt=new THREE.Vector3((Math.random()-.5)*.5,(Math.random()-.5)*.5,(Math.random()-.5)*.5);
  const mid=src.clone().lerp(tgt,.5);
  mid.x+=(Math.random()-.5)*.6;mid.y+=(Math.random()-.5)*.6;mid.z+=(Math.random()-.5)*.6;
  const curve=new THREE.CatmullRomCurve3([src,mid,tgt]);
  const pts=curve.getPoints(30);
  const mat=new THREE.LineBasicMaterial({
    color:new THREE.Color().setHSL(Math.random()<.65?.74:.08,1.,.72),
    transparent:true,opacity:.0,depthWrite:false});
  const line=new THREE.Line(new THREE.BufferGeometry().setFromPoints(pts),mat);
  scene.add(line);
  arcs.push({line,life:0,maxLife:55+Math.random()*40});
}
makeArc();makeArc();

// ══════════════════════════════════════════════════════
// SOLAR WIND PARTICLE EMITTER
// ══════════════════════════════════════════════════════
const WIND=coarse?700:2000;
const wVel=new Float32Array(WIND*3),wCol=new Float32Array(WIND*3),wAge=new Float32Array(WIND),wLife=new Float32Array(WIND);
const wPos=new Float32Array(WIND*3);
function seedWind(i,resetAge){
  const th=Math.random()*Math.PI*2,ph=Math.acos(2*Math.random()-1);
  const sp=.012+Math.random()*.025;
  wVel[i*3]=Math.sin(ph)*Math.cos(th)*sp;wVel[i*3+1]=Math.sin(ph)*Math.sin(th)*sp;wVel[i*3+2]=Math.cos(ph)*sp;
  wPos[i*3]=wVel[i*3]*.4;wPos[i*3+1]=wVel[i*3+1]*.4;wPos[i*3+2]=wVel[i*3+2]*.4;
  wLife[i]=120+Math.random()*60;
  if(resetAge)wAge[i]=0;
}
for(let i=0;i<WIND;i++){
  seedWind(i,false);
  wAge[i]=Math.random()*150;
  const hue=Math.random()<.55?.73:.07;const c=new THREE.Color().setHSL(hue,1.,.60);
  wCol[i*3]=c.r;wCol[i*3+1]=c.g;wCol[i*3+2]=c.b;
}
const windGeo=new THREE.BufferGeometry();
windGeo.setAttribute('position',new THREE.BufferAttribute(wPos,3));
windGeo.setAttribute('color',new THREE.BufferAttribute(wCol,3));
windGeo.boundingSphere=new THREE.Sphere(new THREE.Vector3(),12);
const windAttr=windGeo.attributes.position;
scene.add(new THREE.Points(windGeo,new THREE.PointsMaterial({vertexColors:true,size:.020,transparent:true,opacity:.22,depthWrite:false,blending:THREE.AdditiveBlending,sizeAttenuation:true})));

// ══════════════════════════════════════════════════════
// SHOCKWAVE RINGS
// ══════════════════════════════════════════════════════
const shockGeo=new THREE.RingGeometry(.01,.045,48);
const shockwaves=[];
function spawnShock(){
  const mat=new THREE.MeshBasicMaterial({color:0xcc5500,transparent:true,opacity:.40,depthWrite:false,side:THREE.DoubleSide,blending:THREE.AdditiveBlending});
  const wave=new THREE.Mesh(shockGeo,mat);
  wave.rotation.set(Math.random()*Math.PI,Math.random()*Math.PI,0);
  scene.add(wave);shockwaves.push({wave,t:0});
}

// ══════════════════════════════════════════════════════
// CORE ERUPTION BURST — single GPU buffer, 1 draw call
// ══════════════════════════════════════════════════════
const BURST_N=400;
const burstPos=new Float32Array(BURST_N*3),burstCol=new Float32Array(BURST_N*3),burstVel=new Float32Array(BURST_N*3);
const burstGeo=new THREE.BufferGeometry();
burstGeo.setAttribute('position',new THREE.BufferAttribute(burstPos,3));
burstGeo.setAttribute('color',new THREE.BufferAttribute(burstCol,3));
burstGeo.boundingSphere=new THREE.Sphere(new THREE.Vector3(),14);
const burstMat=new THREE.PointsMaterial({vertexColors:true,size:.05,transparent:true,opacity:0,depthWrite:false,blending:THREE.AdditiveBlending});
scene.add(new THREE.Points(burstGeo,burstMat));
let burstLife=-1,burstMaxLife=0;
function spawnEruption(){
  for(let i=0;i<BURST_N;i++){
    const th=Math.random()*Math.PI*2,ph=Math.acos(2*Math.random()-1);
    const sp=.05+Math.random()*.12;
    burstVel[i*3]=Math.sin(ph)*Math.cos(th)*sp;burstVel[i*3+1]=Math.sin(ph)*Math.sin(th)*sp;burstVel[i*3+2]=Math.cos(ph)*sp;
    burstPos[i*3]=burstVel[i*3]*.4;burstPos[i*3+1]=burstVel[i*3+1]*.4;burstPos[i*3+2]=burstVel[i*3+2]*.4;
    const c=new THREE.Color().setHSL(Math.random()<.5?.07:.1,1.,.85);
    burstCol[i*3]=c.r;burstCol[i*3+1]=c.g;burstCol[i*3+2]=c.b;
  }
  burstGeo.attributes.position.needsUpdate=true;burstGeo.attributes.color.needsUpdate=true;
  burstLife=0;burstMaxLife=60+Math.floor(Math.random()*20);burstMat.opacity=.9;
}

// ══════════════════════════════════════════════════════
// FLUID INK SIM — half-res ping-pong, idles when untouched
// ══════════════════════════════════════════════════════
function makeRT(w,h){return new THREE.WebGLRenderTarget(Math.max(2,w|0),Math.max(2,h|0),
  {minFilter:THREE.LinearFilter,magFilter:THREE.LinearFilter,format:THREE.RGBAFormat,depthBuffer:false,stencilBuffer:false});}
function clearRT(rt){const p=renderer.getRenderTarget();renderer.setRenderTarget(rt);renderer.clear(true,true,true);renderer.setRenderTarget(p);}
const FLUID_SCALE=0.5;
let fw=W*FLUID_SCALE,fh=H*FLUID_SCALE;
let rt1=makeRT(fw,fh),rt2=makeRT(fw,fh);clearRT(rt1);clearRT(rt2);
let mxActive=false,mx=.5,my=.5,mxPrev=.5,myPrev=.5;
const fluidMat=new THREE.ShaderMaterial({
  uniforms:{prev:{value:rt1.texture},mouse:{value:new THREE.Vector2(.5,.5)},prevMouse:{value:new THREE.Vector2(.5,.5)},res:{value:new THREE.Vector2(fw,fh)},splat:{value:0.}},
  vertexShader:'void main(){gl_Position=vec4(position,1.);}',
  fragmentShader:`uniform sampler2D prev;uniform vec2 mouse,prevMouse,res;uniform float splat;
    void main(){vec2 uv=gl_FragCoord.xy/res;vec3 col=texture2D(prev,uv).rgb;
    if(splat>.5){vec2 vel=mouse-prevMouse;float sp=length(vel)*16.;float d=distance(uv,mouse);
    float splash=exp(-d*11.)*min(sp,.9)*1.15;vec3 ink=vec3(.20+mouse.x*.30,.03+mouse.y*.09,.34+(1.-mouse.y)*.38);
    col+=ink*splash;col=mix(col,texture2D(prev,uv-vel*.03).rgb,.18);}
    col*=.975;col=min(col,vec3(.7));gl_FragColor=vec4(col,1.);}`});
const fluidScene=new THREE.Scene(),fluidCam=new THREE.OrthographicCamera(-1,1,1,-1,0,1);
const fluidQuad=new THREE.Mesh(new THREE.PlaneGeometry(2,2),fluidMat);fluidQuad.frustumCulled=false;fluidScene.add(fluidQuad);
const bgMat=new THREE.ShaderMaterial({
  uniforms:{tex:{value:rt1.texture}},
  vertexShader:'varying vec2 v;void main(){v=uv;gl_Position=projectionMatrix*modelViewMatrix*vec4(position,1.);}',
  fragmentShader:`uniform sampler2D tex;varying vec2 v;
    void main(){vec3 c=texture2D(tex,v).rgb;c*=1.5;c=c/(1.+c);float lum=dot(c,vec3(.299,.587,.114));c=mix(vec3(lum),c,1.25);gl_FragColor=vec4(c,1.);}`,
  depthWrite:false});
const bgPlane=new THREE.Mesh(new THREE.PlaneGeometry(24,24),bgMat);bgPlane.position.z=-5.5;scene.add(bgPlane);

// ══════════════════════════════════════════════════════
// VOLUMETRIC NEBULA — rendered OFF-SCREEN at a fraction of
// screen res, then upsampled. This is the single most
// expensive thing on the page, so it gets its own budget:
//   · analytic ray/sphere test skips every pixel that
//     cannot possibly contain cloud (most of the screen)
//   · marches only the intersected segment, not a fixed 9 units
//   · multiply-fract hash instead of sin() hashing
//   · 4-octave density, 2-octave shadow taps
//   · per-pixel dithered ray start kills banding at low step counts
// ══════════════════════════════════════════════════════
const volScene=new THREE.Scene(),volCam=new THREE.OrthographicCamera(-1,1,1,-1,0,1);
const volMat=new THREE.ShaderMaterial({
  uniforms:{
    camPos:{value:new THREE.Vector3()},invProjView:{value:new THREE.Matrix4()},
    time:{value:0},maxSteps:{value:TIERS[tier].steps},shadowOn:{value:TIERS[tier].shadow}
  },
  vertexShader:'varying vec2 vUv;void main(){vUv=uv;gl_Position=vec4(position.xy,0.,1.);}',
  fragmentShader:`
    precision highp float;
    uniform vec3 camPos;uniform mat4 invProjView;uniform float time,maxSteps,shadowOn;
    varying vec2 vUv;

    // iq-style multiply-fract hash — no transcendentals in the inner loop
    float h3(vec3 p){
      p=fract(p*0.3183099+vec3(.11,.17,.13));
      p*=17.0;
      return fract(p.x*p.y*p.z*(p.x+p.y+p.z));
    }
    float n3(vec3 p){
      vec3 i=floor(p),f=fract(p);f=f*f*(3.-2.*f);
      return mix(mix(mix(h3(i),h3(i+vec3(1,0,0)),f.x),
                     mix(h3(i+vec3(0,1,0)),h3(i+vec3(1,1,0)),f.x),f.y),
                 mix(mix(h3(i+vec3(0,0,1)),h3(i+vec3(1,0,1)),f.x),
                     mix(h3(i+vec3(0,1,1)),h3(i+vec3(1,1,1)),f.x),f.y),f.z);
    }
    float fbm4(vec3 p){
      float v=0.,a=.5;
      for(int i=0;i<4;i++){v+=a*n3(p);p=p*2.03+vec3(1.7,9.2,4.3);a*=.5;}
      return v;
    }
    float fbm2(vec3 p){return n3(p)*.62+n3(p*2.07+vec3(1.7,9.2,4.3))*.31;}

    const float R=3.0;           // cloud bounding radius
    float envelope(vec3 p){return 1.-smoothstep(.30,2.92,length(p));}

    float cloud(vec3 p){
      float t=time*.018;
      vec3 q=vec3(fbm2(p+t),fbm2(p+vec3(5.2,1.3,2.8)-t*.8),fbm2(p+vec3(2.9,7.4,3.1)+t*.6));
      float d=fbm4(p*1.1+q*1.6-t);
      return d*envelope(p+q*.24);
    }
    float cloudCheap(vec3 p){return fbm2(p*1.1)*envelope(p);}

    void main(){
      vec4 wN=invProjView*vec4(vUv*2.-1.,-1.,1.);
      vec4 wF=invProjView*vec4(vUv*2.-1., 1.,1.);
      wN.xyz/=wN.w;wF.xyz/=wF.w;
      vec3 ro=camPos,rd=normalize(wF.xyz-wN.xyz);

      // Analytic ray/sphere — bail out instantly on empty sky
      float b=dot(ro,rd),cc=dot(ro,ro)-R*R;
      float disc=b*b-cc;
      if(disc<=0.){gl_FragColor=vec4(0.);return;}
      float sq=sqrt(disc);
      float t0=max(-b-sq,.05),t1=-b+sq;
      if(t1<=t0){gl_FragColor=vec4(0.);return;}

      float dt=(t1-t0)/maxSteps;
      // Dither the entry point so 22 steps look like 60
      float jitter=h3(vec3(gl_FragCoord.xy,1.7));
      float t=t0+dt*jitter;

      vec3 col=vec3(0.);float alpha=0.;
      for(int i=0;i<48;i++){
        if(float(i)>=maxSteps||alpha>.97)break;
        vec3 p=ro+rd*t;
        float d=cloud(p);
        float dens=pow(max(0.,(d-.20)/.80),1.85)*.42*(dt/.22);
        if(dens>.0015){
          vec3 ldir=normalize(-p);
          // 2 cheap shadow taps toward the core — pillars occlude what's behind them
          float lt=1.;
          if(shadowOn>.5){
            float ss=length(p)*.42;
            float shadow=cloudCheap(p+ldir*ss)+cloudCheap(p+ldir*ss*2.2);
            lt=exp(-shadow*2.1);
          }
          // Henyey-Greenstein forward scattering — the thing that reads as "volumetric"
          float ct=dot(rd,ldir),g=.55;
          float hg=(1.-g*g)/pow(1.+g*g-2.*g*ct,1.5)*.0796;

          float core=1.-smoothstep(0.,.9,length(p));
          vec3 c=mix(vec3(.004,.001,.016),vec3(.26,.05,.62),smoothstep(.22,.52,d));
          c=mix(c,vec3(.66,.18,1.38),smoothstep(.48,.76,d));
          c=mix(c,vec3(1.12,.66,.46),core*core);      // amber hot core
          c*=mix(lt*(.42+hg*2.1),1.,core*.88);

          float tr=1.-alpha;col+=c*dens*tr;alpha+=dens*tr;
        }
        t+=dt;
      }
      gl_FragColor=vec4(col,alpha);
    }`,
  depthTest:false,depthWrite:false});
const volQuad=new THREE.Mesh(new THREE.PlaneGeometry(2,2),volMat);volQuad.frustumCulled=false;volScene.add(volQuad);
let volRT=makeRT(W*TIERS[tier].vol,H*TIERS[tier].vol);

// ══════════════════════════════════════════════════════
// POST: render → cloud composite → bloom → grade
// ══════════════════════════════════════════════════════
const composer=new THREE.EffectComposer(renderer);
composer.setPixelRatio(renderer.getPixelRatio());
composer.addPass(new THREE.RenderPass(scene,camera));

// Upsample + composite the cloud. Holding back a little of the
// occlusion lets starlight keep glinting through the dust.
const volComposite=new THREE.ShaderPass({
  uniforms:{tDiffuse:{value:null},tVol:{value:null}},
  vertexShader:'varying vec2 vUv;void main(){vUv=uv;gl_Position=projectionMatrix*modelViewMatrix*vec4(position,1.);}',
  fragmentShader:`uniform sampler2D tDiffuse,tVol;varying vec2 vUv;
    void main(){
      vec4 v=texture2D(tVol,vUv);
      vec3 bg=texture2D(tDiffuse,vUv).rgb;
      gl_FragColor=vec4(bg*(1.-v.a*.82)+v.rgb,1.);
    }`
});
volComposite.uniforms.tVol.value=volRT.texture;
composer.addPass(volComposite);

const bloom=new THREE.UnrealBloomPass(new THREE.Vector2(W,H),0.85,0.72,0.55);
composer.addPass(bloom);

// FINAL: god rays + chroma + anamorphic streak + grade + grain + vignette,
// all in one pass so there is no extra full-screen read/write between them.
const finalPass=new THREE.ShaderPass({
  uniforms:{tDiffuse:{value:null},coreUV:{value:new THREE.Vector2(.5,.5)},time:{value:0},
            rayExposure:{value:.30}},
  vertexShader:'varying vec2 vUv;void main(){vUv=uv;gl_Position=projectionMatrix*modelViewMatrix*vec4(position,1.);}',
  fragmentShader:`
    uniform sampler2D tDiffuse;uniform vec2 coreUV;uniform float time,rayExposure;
    varying vec2 vUv;
    float rnd(vec2 p){return fract(sin(dot(p+time,vec2(127.1,311.7)))*43758.5453);}
    void main(){
      // Chromatic aberration
      vec2 d=vUv-.5;float dist=length(d);vec2 off=normalize(d+1e-6)*.0015*dist*dist*3.;
      vec3 col=vec3(texture2D(tDiffuse,vUv+off).r,
                    texture2D(tDiffuse,vUv).g,
                    texture2D(tDiffuse,vUv-off).b);

      // God rays — 20 taps instead of 48; the decay curve is retuned
      // so the shaft length and falloff match the old 48-tap look.
      vec2 delta=(vUv-coreUV)/20.;vec2 uv=vUv;float illum=1.;vec3 rays=vec3(0.);
      for(int i=0;i<20;i++){
        uv-=delta;
        vec3 s=texture2D(tDiffuse,clamp(uv,0.,1.)).rgb;
        float br=max(s.r,max(s.g,s.b));
        rays+=s*illum*.024*smoothstep(.15,.6,br);
        illum*=.928;
      }
      col+=rays*rayExposure;

      // Anamorphic lens streak
      float dy=abs(vUv.y-coreUV.y);
      float streak=exp(-dy*dy*520.)*.04;
      float dx=abs(vUv.x-coreUV.x);
      col+=vec3(.45,.18,.95)*streak*exp(-dx*dx*2.8)*(.88+sin(time*11.3)*.12);

      // Grade: gentle S-curve + split tone (cool shadows, warm highs)
      col=col*col*(3.-2.*col)*.34+col*.66;
      float lum=dot(col,vec3(.299,.587,.114));
      col=mix(col,col*vec3(.94,.97,1.06),1.-smoothstep(0.,.35,lum));
      col=mix(col,col*vec3(1.05,1.0,.97),smoothstep(.55,1.,lum));

      // Vignette, then grain + ordered dither so the deep blacks
      // gradate smoothly instead of banding on an 8-bit buffer.
      col*=smoothstep(1.05,.3,length(vUv-.5)*1.55);
      col+=rnd(vUv)*.025-.0125;
      col+=(fract(dot(gl_FragCoord.xy,vec2(.7548776,.5698403)))-.5)/255.;
      gl_FragColor=vec4(clamp(col,0.,1.),1.);}`,
  renderToScreen:true
});
composer.addPass(finalPass);

// ══════════════════════════════════════════════════════
// LENS FLARE ELEMENTS (billboarded in-scene)
// ══════════════════════════════════════════════════════
const flareGroup=new THREE.Group();scene.add(flareGroup);
const flareMat=new THREE.ShaderMaterial({
  uniforms:{time:{value:0}},
  vertexShader:`varying vec2 vUv;void main(){vUv=uv;gl_Position=projectionMatrix*modelViewMatrix*vec4(position,1.);}`,
  fragmentShader:`uniform float time;varying vec2 vUv;
    void main(){vec2 c=vUv-.5;float d=length(c);float a=pow(max(0.,1.-d*2.),4.5)*.24;
    if(a<.001)discard;float fl=.82+sin(time*4.8)*.12;
    vec3 col=mix(vec3(.38,.06,.82),vec3(.72,.35,1.),pow(max(0.,1.-d*2.),8.));
    gl_FragColor=vec4(col*fl,a*fl);}`,
  transparent:true,depthWrite:false,blending:THREE.AdditiveBlending,side:THREE.DoubleSide});
flareGroup.add(new THREE.Mesh(new THREE.PlaneGeometry(.7,.7),flareMat));
const hexMat=new THREE.ShaderMaterial({
  uniforms:{time:{value:0}},
  vertexShader:`varying vec2 vUv;void main(){vUv=uv;gl_Position=projectionMatrix*modelViewMatrix*vec4(position,1.);}`,
  fragmentShader:`uniform float time;varying vec2 vUv;
    void main(){vec2 c=vUv-.5;float d=length(c);
    float ang=atan(c.y,c.x);float hex=cos(floor(ang/1.047)*1.047-ang)*length(c)/.5;
    float ring=exp(-pow(hex-.42,2.)*90.)*.3+exp(-pow(d-.28,2.)*120.)*.2;
    float fl=.7+sin(time*3.2)*.3;
    gl_FragColor=vec4(vec3(.52,.14,.92)*ring*fl,ring*fl*.4);}`,
  transparent:true,depthWrite:false,blending:THREE.AdditiveBlending,side:THREE.DoubleSide});
flareGroup.add(new THREE.Mesh(new THREE.PlaneGeometry(1.4,1.4),hexMat));
flareGroup.add(new THREE.Mesh(new THREE.PlaneGeometry(5.2,5.2),glowMat));

// ══════════════════════════════════════════════════════
// INPUT + RESIZE
// ══════════════════════════════════════════════════════
function pointer(x,y){mxActive=true;mxPrev=mx;myPrev=my;mx=x/W;my=1-y/H;}
addEventListener('mousemove',e=>pointer(e.clientX,e.clientY),{passive:true});
addEventListener('touchmove',e=>{const t=e.touches[0];if(t)pointer(t.clientX,t.clientY);},{passive:true});

let resizeTimer=0;
addEventListener('resize',()=>{
  clearTimeout(resizeTimer);
  resizeTimer=setTimeout(()=>{
    W=innerWidth;H=innerHeight;
    renderer.setSize(W,H);composer.setSize(W,H);
    camera.aspect=W/H;camera.updateProjectionMatrix();
    fw=W*FLUID_SCALE;fh=H*FLUID_SCALE;
    rt1.setSize(fw,fh);rt2.setSize(fw,fh);clearRT(rt1);clearRT(rt2);
    fluidMat.uniforms.res.value.set(fw,fh);
    volRT.setSize(Math.max(2,W*TIERS[tier].vol|0),Math.max(2,H*TIERS[tier].vol|0));
    volComposite.uniforms.tVol.value=volRT.texture;
  },150);
},{passive:true});

// ══════════════════════════════════════════════════════
// ADAPTIVE QUALITY — measure, then spend what the GPU has
// ══════════════════════════════════════════════════════
const pxsUniforms=[galMat,moteMat,orbMat];
function applyTier(t){
  tier=t;const q=TIERS[t];
  const dpr=Math.min(devicePixelRatio,q.dpr);
  renderer.setPixelRatio(dpr);composer.setPixelRatio(dpr);
  pxsUniforms.forEach(m=>m.uniforms.pxs.value=dpr/1.5);
  volMat.uniforms.maxSteps.value=q.steps;
  volMat.uniforms.shadowOn.value=q.shadow;
  volRT.setSize(Math.max(2,W*q.vol|0),Math.max(2,H*q.vol|0));
  volComposite.uniforms.tVol.value=volRT.texture;
}
let frameMs=16.7,slowRun=0,fastRun=0,drops=0,vsyncMs=16.7,warmup=0;
const startTier=tier;

// HUD
const fpsEl=document.getElementById('fps'),starEl=document.getElementById('stars');
starEl.textContent='PARTICLES: '+(TOTAL>=1000?(TOTAL/1000).toFixed(0)+'K':TOTAL);
let hudT=-1e9;

// ══════════════════════════════════════════════════════
// ANIMATE
// ══════════════════════════════════════════════════════
const clock=new THREE.Clock();
let time=0;
const coreScreenPos=new THREE.Vector3(),coreWorldPos=new THREE.Vector3(0,0,0);
const _invPV=new THREE.Matrix4();
let nextArc=6000,nextShock=14000,nextBurst=5000,elapsed=0,fluidIdle=0;

// Value noise for camera drift — reads as weightless float, not a sine orbit
function jn(x){var i=Math.floor(x),f=x-i,u=f*f*(3-2*f),
  a=(Math.sin(i*127.1)*43758.5453)%1,b=(Math.sin((i+1)*127.1)*43758.5453)%1;
  a=a<0?a+1:a;b=b<0?b+1:b;return a*(1-u)+b*u;}
function jfbm(x){return jn(x)*.5+jn(x*2.1)*.25+jn(x*4.3)*.125;}

const motion=reduceMotion?.25:1;

function animate(){
  requestAnimationFrame(animate);

  // Don't burn the GPU (or the battery) on a tab nobody is looking at
  const dtRaw=clock.getDelta();
  if(document.hidden)return;
  const dt=Math.min(dtRaw,1/20);
  const fs=dt*60;                    // "frames at 60fps", for legacy per-frame tuning
  time+=dt*0.21;                     // was 0.0035/frame — now identical at any refresh rate
  elapsed+=dt*1000;

  // ── Fluid ink: only simulate while it still has energy to spend
  if(mxActive)fluidIdle=0;else fluidIdle+=fs;
  if(fluidIdle<4){
    fluidMat.uniforms.prev.value=rt1.texture;
    fluidMat.uniforms.mouse.value.set(mx,my);
    fluidMat.uniforms.prevMouse.value.set(mxPrev,myPrev);
    fluidMat.uniforms.splat.value=mxActive?1.:0.;
    renderer.setRenderTarget(rt2);renderer.render(fluidScene,fluidCam);
    renderer.setRenderTarget(null);
    const tmp=rt1;rt1=rt2;rt2=tmp;bgMat.uniforms.tex.value=rt1.texture;
  }
  mxActive=false;

  // ── GPU-animated systems: one uniform each, no buffer traffic
  galMat.uniforms.time.value=time;
  galaxy.rotation.y+=.00006*fs*motion;
  moteMat.uniforms.time.value=time;
  spikeMat.uniforms.time.value=time;
  orbMat.uniforms.time.value=time;
  flareMat.uniforms.time.value=time;hexMat.uniforms.time.value=time;
  glowMat.uniforms.time.value=time;
  coreLight.intensity=(0.72+jfbm(time*.11)*.28)*(0.78+jn(time*3.8)*.14+jn(time*9.2)*.05);

  rings[0].rotation.z+=.004*fs*motion;rings[1].rotation.x+=.003*fs*motion;rings[2].rotation.y+=.005*fs*motion;

  // ── Timed events, on animation time: they stay in step with the visuals
  //    and a backgrounded tab never builds up a backlog to fire all at once.
  if(elapsed>nextArc){nextArc=elapsed+6000;if(arcs.length<3&&Math.random()<.4)makeArc();}
  if(elapsed>nextShock){nextShock=elapsed+14000;if(Math.random()<.3)spawnShock();}
  if(elapsed>nextBurst){nextBurst=elapsed+38000;spawnEruption();}

  // ── Shockwaves
  for(let i=shockwaves.length-1;i>=0;i--){
    const sw=shockwaves[i];sw.t+=.024*fs;
    sw.wave.scale.setScalar(sw.t*4.5);
    sw.wave.material.opacity=Math.max(0,.75*(1-sw.t));
    if(sw.t>=1){scene.remove(sw.wave);sw.wave.material.dispose();shockwaves.splice(i,1);}
  }

  // ── Energy arcs (iterate backwards — splicing forwards skipped entries)
  for(let i=arcs.length-1;i>=0;i--){
    const a=arcs[i];a.life+=fs;const phase=a.life/a.maxLife;
    if(phase<.15)a.line.material.opacity=phase/.15*.45;
    else if(phase<.5)a.line.material.opacity=.45;
    else a.line.material.opacity=Math.max(0,.45*(1-phase)/.5);
    if(a.life>=a.maxLife){
      scene.remove(a.line);a.line.geometry.dispose();a.line.material.dispose();
      arcs.splice(i,1);makeArc();
    }
  }

  // ── Solar wind: straight typed-array math, no accessor calls, no per-particle RNG
  for(let i=0,j=0;i<WIND;i++,j+=3){
    wAge[i]+=fs;
    if(wAge[i]>wLife[i]){seedWind(i,true);}
    else{wPos[j]+=wVel[j]*fs;wPos[j+1]+=wVel[j+1]*fs;wPos[j+2]+=wVel[j+2]*fs;}
  }
  windAttr.needsUpdate=true;

  // ── Eruption burst
  if(burstLife>=0){
    burstLife+=fs;
    const ph=burstLife/burstMaxLife;
    for(let i=0,j=0;i<BURST_N;i++,j+=3){
      burstPos[j]+=burstVel[j]*fs;burstPos[j+1]+=burstVel[j+1]*fs;burstPos[j+2]+=burstVel[j+2]*fs;
    }
    burstGeo.attributes.position.needsUpdate=true;
    burstMat.opacity=ph<.2?ph/.2*.9:Math.max(0,.9*(1-ph)/.8);
    if(burstLife>=burstMaxLife){burstLife=-1;burstMat.opacity=0;}
  }

  flareGroup.quaternion.copy(camera.quaternion);

  // ── Cinematic floating camera: noise drift, never a locked orbit
  const cT=time*.022;
  const camOrbitR=4.2+jfbm(cT*.5)*.6-.25;
  const camOrbitA=time*.038*motion+jfbm(cT*.9)*.12;
  camera.position.x=Math.sin(camOrbitA)*camOrbitR*.40;
  camera.position.y=(jfbm(cT*.6+5.)-.5)*1.1*motion;
  camera.position.z=Math.cos(camOrbitA)*camOrbitR*.92;
  camera.lookAt((jfbm(time*1.8+1.7)-.5)*.018*motion,(jfbm(time*1.5+4.1)-.5)*.012*motion,0);
  camera.updateMatrixWorld();

  coreScreenPos.copy(coreWorldPos).project(camera);
  finalPass.uniforms.coreUV.value.set((coreScreenPos.x+1)*.5,(coreScreenPos.y+1)*.5);
  finalPass.uniforms.time.value=time;

  // ── Volumetric cloud, off-screen at tier resolution
  volMat.uniforms.time.value=time;
  volMat.uniforms.camPos.value.copy(camera.position);
  _invPV.copy(camera.projectionMatrix).multiply(camera.matrixWorldInverse).invert();
  volMat.uniforms.invProjView.value.copy(_invPV);
  renderer.setRenderTarget(volRT);
  renderer.render(volScene,volCam);
  renderer.setRenderTarget(null);

  composer.render();

  // ── Adaptive quality.
  // Measure the real rAF-to-rAF interval, not CPU time around the draw
  // calls: GPU work is asynchronous, so a timer that stops after
  // composer.render() reports a fast frame on a GPU that is drowning.
  // Thresholds are relative to the display's own refresh rate, because a
  // perfectly idle 60Hz machine still never beats 16.7ms.
  frameMs+=(Math.min(dtRaw,.25)*1000-frameMs)*.05;
  if(warmup<40){warmup++;}                       // ignore startup jank
  else if(dtRaw>.004)vsyncMs=Math.min(vsyncMs,Math.max(dtRaw*1000,6));
  const slowAt=Math.max(22,vsyncMs*1.7),fastAt=vsyncMs*1.12;
  if(warmup>=40){
    // Gate the counters on being ABLE to move, so a long slow spell at the
    // bottom tier can't bank hundreds of ticks and then skip the debounce
    // the next time we climb.
    if(frameMs>slowAt&&tier>0){if(++slowRun>45){applyTier(tier-1);drops++;slowRun=0;fastRun=0;}}
    else slowRun=0;
    if(frameMs<fastAt&&tier<startTier&&drops<3){if(++fastRun>300*(drops+1)){applyTier(tier+1);fastRun=0;}}
    else fastRun=0;
  }

  const now=performance.now();
  if(now-hudT>500){hudT=now;fpsEl.textContent=Math.round(1000/Math.max(frameMs,4.17))+' FPS · Q'+tier;}
}
animate();
</script>
</body>
</html>

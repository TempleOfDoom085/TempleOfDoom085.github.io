<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Knights Templar: 3D Edition</title>
<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;600;700&family=IM+Fell+English:ital@0;1&display=swap" rel="stylesheet">
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
html,body{width:100%;height:100%;overflow:hidden;background:#000;font-family:'IM Fell English',serif}
#c{position:fixed;inset:0;width:100%;height:100%;display:block;z-index:1}
#hud-top{position:fixed;top:0;left:0;right:0;z-index:10;display:flex;align-items:center;justify-content:space-between;
  padding:10px 20px;background:linear-gradient(180deg,rgba(0,0,0,.85) 0%,transparent 100%);pointer-events:none}
#room-title{font-family:'Cinzel',serif;font-size:1.1rem;color:#d4b458;letter-spacing:.15em;text-shadow:0 0 18px rgba(212,180,88,.6)}
#room-sub{font-size:.72rem;color:rgba(232,228,218,.5);letter-spacing:.08em;margin-top:2px;font-style:italic}
#hp-wrap{display:flex;align-items:center;gap:10px;pointer-events:none}
#hp-label{font-family:'Cinzel',serif;font-size:.7rem;color:#d4b458;letter-spacing:.1em}
#hp-bar-out{width:140px;height:14px;background:rgba(255,255,255,.07);border:1px solid rgba(255,255,255,.1);border-radius:2px;overflow:hidden}
#hp-bar-in{height:100%;background:linear-gradient(90deg,#4a8,#6c8);transition:width .4s,background .4s;border-radius:1px}
#hp-num{font-family:'Cinzel',serif;font-size:.8rem;color:#e8e4da;min-width:50px;text-align:right}
#inv-count{font-family:'Cinzel',serif;font-size:.8rem;color:#d4b458}
#nav-panel{position:fixed;bottom:200px;right:24px;z-index:10;display:grid;grid-template-columns:repeat(3,44px);grid-template-rows:repeat(3,44px);gap:4px}
.nav-btn{background:rgba(0,0,0,.7);border:1px solid rgba(212,180,88,.35);color:#d4b458;font-family:'Cinzel',serif;font-size:.7rem;
  letter-spacing:.08em;cursor:pointer;border-radius:3px;transition:all .2s;display:flex;align-items:center;justify-content:center}
.nav-btn:hover:not(:disabled){background:rgba(212,180,88,.15);border-color:rgba(212,180,88,.8)}
.nav-btn:disabled{opacity:.22;cursor:default}
.nav-btn.empty{pointer-events:none;background:transparent;border-color:transparent}
#log-panel{position:fixed;bottom:0;left:0;right:0;z-index:10;height:188px;
  background:linear-gradient(0deg,rgba(0,0,0,.92) 0%,rgba(0,0,0,.75) 100%);
  border-top:1px solid rgba(212,180,88,.18);padding:10px 20px 10px;display:flex;flex-direction:column;gap:6px}
#log-scroll{flex:1;overflow-y:auto;display:flex;flex-direction:column;gap:3px}
#log-scroll::-webkit-scrollbar{width:4px}
#log-scroll::-webkit-scrollbar-track{background:transparent}
#log-scroll::-webkit-scrollbar-thumb{background:rgba(212,180,88,.3);border-radius:2px}
.log-line{font-size:.78rem;line-height:1.45;color:#c8c4ba}
.log-line.combat{color:#e05050}.log-line.system{color:#5fc8d8}.log-line.item{color:#d4b458}
.log-line.divine{color:#c8a8f8}.log-line.heal{color:#5aaa6a}.log-line.lore{color:#a89880;font-style:italic}
#action-row{display:flex;gap:8px;flex-shrink:0;margin-top:6px}
.act-btn{flex:1;padding:6px 0;font-family:'Cinzel',serif;font-size:.72rem;letter-spacing:.08em;
  border:1px solid rgba(212,180,88,.3);background:rgba(0,0,0,.6);color:#d4b458;cursor:pointer;border-radius:2px;transition:all .2s}
.act-btn:hover:not(:disabled){background:rgba(212,180,88,.2);border-color:#d4b458}
.act-btn:disabled{opacity:.25;cursor:default}
.act-btn.danger{border-color:rgba(200,60,60,.4);color:#e05050}
.act-btn.danger:hover:not(:disabled){background:rgba(200,60,60,.2);border-color:#e05050}
.act-btn.safe{border-color:rgba(90,170,106,.4);color:#5aaa6a}
.act-btn.safe:hover:not(:disabled){background:rgba(90,170,106,.2);border-color:#5aaa6a}
#fade{position:fixed;inset:0;z-index:99;background:#000;opacity:0;pointer-events:none;transition:opacity .35s}
#fade.show{opacity:1;pointer-events:all}
#gameover{position:fixed;inset:0;z-index:200;background:rgba(0,0,0,.92);display:none;
  align-items:center;justify-content:center;flex-direction:column;gap:18px}
#gameover h2{font-family:'Cinzel',serif;font-size:2rem;color:#8B0000;letter-spacing:.2em}
#gameover p{color:#c8c4ba;font-size:.9rem;text-align:center;max-width:400px;line-height:1.6}
#gameover button{font-family:'Cinzel',serif;padding:10px 36px;border:1px solid #d4b458;background:transparent;color:#d4b458;cursor:pointer;font-size:.9rem;letter-spacing:.1em}
#winscreen{position:fixed;inset:0;z-index:200;background:rgba(0,0,0,.92);display:none;
  align-items:center;justify-content:center;flex-direction:column;gap:18px}
#winscreen h2{font-family:'Cinzel',serif;font-size:2rem;color:#d4b458;letter-spacing:.2em}
#winscreen p{color:#c8c4ba;font-size:.9rem;text-align:center;max-width:400px;line-height:1.6}
#winscreen button{font-family:'Cinzel',serif;padding:10px 36px;border:1px solid #d4b458;background:transparent;color:#d4b458;cursor:pointer;font-size:.9rem}
</style>
</head>
<body>
<canvas id="c"></canvas>
<div id="hud-top">
  <div><div id="room-title">TEMPLAR CHAPEL</div><div id="room-sub">Where your journey begins...</div></div>
  <div id="hp-wrap">
    <span id="inv-count">⚔ 0 relics</span>
    <span id="hp-label">HP</span>
    <div id="hp-bar-out"><div id="hp-bar-in" style="width:100%"></div></div>
    <span id="hp-num">100 / 100</span>
  </div>
</div>
<div id="nav-panel">
  <div class="nav-btn empty"></div>
  <button class="nav-btn" id="btn-n" onclick="move('north')">N</button>
  <div class="nav-btn empty"></div>
  <button class="nav-btn" id="btn-w" onclick="move('west')">W</button>
  <div class="nav-btn empty" style="font-size:.55rem;color:rgba(212,180,88,.3);align-items:center;justify-content:center;display:flex">✦</div>
  <button class="nav-btn" id="btn-e" onclick="move('east')">E</button>
  <div class="nav-btn empty"></div>
  <button class="nav-btn" id="btn-s" onclick="move('south')">S</button>
  <div class="nav-btn empty"></div>
</div>
<div id="log-panel">
  <div id="log-scroll"></div>
  <div id="action-row">
    <button class="act-btn danger" id="btn-attack" onclick="doAttack()" style="display:none">⚔ ATTACK</button>
    <button class="act-btn" id="btn-defend" onclick="doDefend()" style="display:none">🛡 DEFEND</button>
    <button class="act-btn safe" id="btn-flee" onclick="doFlee()" style="display:none">↩ FLEE</button>
    <button class="act-btn item" id="btn-pickup" onclick="doPickup()" style="display:none">✦ TAKE RELIC</button>
  </div>
</div>
<div id="fade"></div>
<div id="gameover"><h2>YOU HAVE FALLEN</h2><p id="death-msg">The darkness claims another soul.</p><button onclick="restartGame()">✝ Rise Again</button></div>
<div id="winscreen"><h2>VICTORY</h2><p>The Necromancer has been vanquished. The fortress is purged. Your name shall be remembered among the Templar saints.</p><button onclick="restartGame()">✦ Play Again</button></div>
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script src="https://unpkg.com/three@0.128.0/examples/js/shaders/LuminosityHighPassShader.js"></script>
<script src="https://unpkg.com/three@0.128.0/examples/js/shaders/CopyShader.js"></script>
<script src="https://unpkg.com/three@0.128.0/examples/js/postprocessing/EffectComposer.js"></script>
<script src="https://unpkg.com/three@0.128.0/examples/js/postprocessing/RenderPass.js"></script>
<script src="https://unpkg.com/three@0.128.0/examples/js/postprocessing/ShaderPass.js"></script>
<script src="https://unpkg.com/three@0.128.0/examples/js/postprocessing/UnrealBloomPass.js"></script>
<script>
'use strict';
const ROOMS={chapel:{name:'Templar Chapel',sub:'Where your journey begins...',type:'chapel',exits:{north:'cloister',east:'armory',south:'courtyard'},relic:'Templar Cross',enemy:null,heals:false},cloister:{name:'Cloister Walk',sub:'Stone arches line the corridor...',type:'cloister',exits:{south:'chapel',east:'scriptorium',north:'bellTower',west:'grandHall'},relic:null,enemy:'risen',heals:false},armory:{name:'Armory',sub:'Weapons of a fallen Order...',type:'armory',exits:{west:'chapel',north:'scriptorium',east:'barracks'},relic:'Templar Longsword',enemy:'peasant',heals:false},scriptorium:{name:'Scriptorium',sub:'Ancient texts scatter the floor...',type:'library',exits:{south:'armory',west:'cloister',east:'infirmary'},relic:'Illuminated Map',enemy:null,heals:false},barracks:{name:'Barracks',sub:'Bunks overturned, armor scattered...',type:'barracks',exits:{west:'armory',north:'infirmary',east:'dungeonDepths'},relic:'Chainmail Hauberk',enemy:'risen',heals:false},infirmary:{name:'Infirmary',sub:'The scent of herbs lingers...',type:'infirmary',exits:{west:'scriptorium',south:'barracks'},relic:'Holy Water',enemy:null,heals:true},bellTower:{name:'Bell Tower',sub:'High above the fortress...',type:'tower',exits:{south:'cloister',east:'watchtower'},relic:'Blessed Candles',enemy:'peasant',heals:false},courtyard:{name:'Courtyard',sub:'Open ground — danger everywhere...',type:'courtyard',exits:{north:'chapel',east:'cryptEntrance',south:'grandHall',west:'portraitGallery'},relic:null,enemy:'peasant',heals:false},cryptEntrance:{name:'Crypt Entrance',sub:'The air grows cold...',type:'crypt',exits:{west:'courtyard',south:'catacombs',east:'boneThrone'},relic:null,enemy:'risen',heals:false},catacombs:{name:'Forgotten Catacombs',sub:'Bones of the faithful line walls...',type:'catacombs',exits:{north:'cryptEntrance',east:'necromancerLair'},relic:null,enemy:'risen',heals:false},necromancerLair:{name:"Necromancer's Lair",sub:'The source of all darkness...',type:'lair',exits:{west:'catacombs'},relic:null,enemy:'necromancer',heals:false},grandHall:{name:'Grand Hall',sub:'A feast long abandoned...',type:'hall',exits:{east:'cloister',north:'courtyard',south:'treasury'},relic:null,enemy:null,heals:false},treasury:{name:'Treasury',sub:'Gold shelves and locked chests...',type:'treasury',exits:{north:'grandHall',east:'boneThrone'},relic:'Rosary of Iron',enemy:null,heals:false},boneThrone:{name:'Bone Throne Room',sub:'A throne built from human bones...',type:'throne',exits:{west:'cryptEntrance',south:'treasury'},relic:null,enemy:'risen',heals:false},portraitGallery:{name:'Portrait Gallery',sub:'Three paintings stare back...',type:'gallery',exits:{east:'courtyard'},relic:null,enemy:null,heals:false},watchtower:{name:'Watchtower',sub:'Arrow slits frame the dark horizon...',type:'tower',exits:{west:'bellTower',south:'cryptEntrance'},relic:'Blessed Bandage',enemy:'peasant',heals:false},dungeonDepths:{name:'Dungeon Depths',sub:'Iron doors and stagnant air...',type:'dungeon',exits:{west:'barracks',north:'boneThrone'},relic:null,enemy:'risen',heals:false}};
const ENEMY_STATS={risen:{name:'Risen Dead',hp:28,atk:[5,12],def:2,type:'skeleton'},peasant:{name:'Plague Zombie',hp:20,atk:[4,9],def:1,type:'zombie'},necromancer:{name:'Necromancer',hp:80,atk:[12,22],def:6,type:'necromancer'}};
let STATE={room:'chapel',hp:100,maxHp:100,atk:10,def:3,inventory:[],defeatedEnemies:{},pickedRelics:{},inCombat:false,currentEnemy:null,enemyHp:0,defending:false};
const renderer=new THREE.WebGLRenderer({canvas:document.getElementById('c'),antialias:true,powerPreference:'high-performance'});
renderer.setSize(innerWidth,innerHeight);renderer.setPixelRatio(Math.min(devicePixelRatio,2));
renderer.shadowMap.enabled=true;renderer.shadowMap.type=THREE.PCFSoftShadowMap;
renderer.toneMapping=THREE.ACESFilmicToneMapping;renderer.toneMappingExposure=0.9;
const scene=new THREE.Scene();scene.fog=new THREE.FogExp2(0x000000,0.18);
const camera=new THREE.PerspectiveCamera(72,innerWidth/innerHeight,0.1,80);
camera.position.set(0,1.75,4.2);camera.lookAt(0,1.4,0);
const composer=new THREE.EffectComposer(renderer);
composer.addPass(new THREE.RenderPass(scene,camera));
composer.addPass(new THREE.UnrealBloomPass(new THREE.Vector2(innerWidth,innerHeight),0.55,0.5,0.78));
const vigPass=new THREE.ShaderPass({uniforms:{tDiffuse:{value:null},time:{value:0}},vertexShader:'varying vec2 v;void main(){v=uv;gl_Position=projectionMatrix*modelViewMatrix*vec4(position,1.);}',fragmentShader:`uniform sampler2D tDiffuse;uniform float time;varying vec2 v;float rnd(vec2 p){return fract(sin(dot(p+time,vec2(127.1,311.7)))*43758.5453);}void main(){vec4 c=texture2D(tDiffuse,v);c.rgb+=rnd(v)*0.018-0.009;float vig=smoothstep(1.15,0.3,length(v-0.5)*1.65);c.rgb*=vig;gl_FragColor=vec4(clamp(c.rgb,0.,1.),1.);}`,renderToScreen:true});
composer.addPass(vigPass);
window.addEventListener('resize',()=>{renderer.setSize(innerWidth,innerHeight);composer.setSize(innerWidth,innerHeight);camera.aspect=innerWidth/innerHeight;camera.updateProjectionMatrix();});
const M={stone:()=>new THREE.MeshStandardMaterial({color:0x28231e,roughness:.97,metalness:.02}),stoneLight:()=>new THREE.MeshStandardMaterial({color:0x3a342e,roughness:.92,metalness:.02}),stoneDark:()=>new THREE.MeshStandardMaterial({color:0x141210,roughness:1,metalness:0}),floor:()=>new THREE.MeshStandardMaterial({color:0x1c1815,roughness:.99,metalness:0}),gold:()=>new THREE.MeshStandardMaterial({color:0xd4a020,roughness:.28,metalness:.88,emissive:0x3a2800,emissiveIntensity:.4}),bone:()=>new THREE.MeshStandardMaterial({color:0xcdc0a0,roughness:.82,metalness:0,emissive:0x100f08,emissiveIntensity:.15}),greenGlow:()=>new THREE.MeshStandardMaterial({color:0x00ff66,emissive:0x00cc44,emissiveIntensity:2.5,roughness:.4,metalness:0,transparent:true,opacity:.85}),runeGlow:()=>new THREE.MeshStandardMaterial({color:0x22dd66,emissive:0x00aa33,emissiveIntensity:3,roughness:.3,metalness:0,transparent:true,opacity:.7}),torchFlame:()=>new THREE.MeshStandardMaterial({color:0xff8822,emissive:0xff5500,emissiveIntensity:3,roughness:.5,metalness:0,transparent:true,opacity:.9}),wood:()=>new THREE.MeshStandardMaterial({color:0x3a2510,roughness:.95,metalness:0}),cloth:()=>new THREE.MeshStandardMaterial({color:0x4a3020,roughness:.98,metalness:0}),darkCloth:()=>new THREE.MeshStandardMaterial({color:0x120d1a,roughness:.98,metalness:0}),red:()=>new THREE.MeshStandardMaterial({color:0x8B0000,roughness:.8,metalness:.1,emissive:0x3a0000,emissiveIntensity:.3}),silver:()=>new THREE.MeshStandardMaterial({color:0x9090a0,roughness:.35,metalness:.82}),iceWhite:()=>new THREE.MeshStandardMaterial({color:0xc0d8ff,emissive:0x6090ff,emissiveIntensity:1.8,roughness:.3,metalness:0})};
const roomGroup=new THREE.Group();scene.add(roomGroup);
const enemyGroup=new THREE.Group();scene.add(enemyGroup);
let torchLights=[];
function clearRoom(){while(roomGroup.children.length)roomGroup.remove(roomGroup.children[0]);while(enemyGroup.children.length)enemyGroup.remove(enemyGroup.children[0]);torchLights.forEach(l=>scene.remove(l));torchLights=[];scene.children.filter(c=>c.isLight).forEach(l=>scene.remove(l));}
function addTorch(x,y,z,color=0xff8822,intensity=1.6,dist=8){const holder=new THREE.Mesh(new THREE.CylinderGeometry(.04,.05,.3,8),M.silver());holder.position.set(x,y-.15,z);roomGroup.add(holder);const flame=new THREE.Mesh(new THREE.ConeGeometry(.06,.14,8),M.torchFlame());flame.position.set(x,y+.06,z);roomGroup.add(flame);const light=new THREE.PointLight(color,intensity,dist);light.position.set(x,y+.1,z);light.castShadow=true;light.shadow.mapSize.width=256;light.shadow.mapSize.height=256;scene.add(light);torchLights.push(light);}
function buildBaseRoom(W=10,D=10,ceilH=4.2,wallMat=null,floorMat=null,ceilMat=null){const wm=wallMat||M.stone();const fm=floorMat||M.floor();const cm=ceilMat||M.stoneDark();const fl=new THREE.Mesh(new THREE.PlaneGeometry(W,D),fm);fl.rotation.x=-Math.PI/2;fl.receiveShadow=true;roomGroup.add(fl);const ce=new THREE.Mesh(new THREE.PlaneGeometry(W,D),cm);ce.rotation.x=Math.PI/2;ce.position.y=ceilH;roomGroup.add(ce);[[0,ceilH/2,-D/2,0,0,0],[0,ceilH/2,D/2,Math.PI,0,0],[-W/2,ceilH/2,0,0,Math.PI/2,0],[W/2,ceilH/2,0,0,-Math.PI/2,0]].forEach(([x,y,z,rx,ry,rz])=>{const wl=new THREE.Mesh(new THREE.PlaneGeometry(W,ceilH),wm.clone());wl.position.set(x,y,z);wl.rotation.set(rx,ry,rz);wl.receiveShadow=true;roomGroup.add(wl);});}
function buildChapel(){buildBaseRoom(10,10,4.8);scene.add(new THREE.AmbientLight(0x150d07,1.2));addTorch(-3.8,2.5,-4.5);addTorch(3.8,2.5,-4.5);const alt=new THREE.Mesh(new THREE.BoxGeometry(2.2,.8,.6),M.stoneLight());alt.position.set(0,.4,-4);alt.castShadow=true;roomGroup.add(alt);const cv=new THREE.Mesh(new THREE.BoxGeometry(.14,1.4,.08),M.silver());cv.position.set(0,3,-4.88);roomGroup.add(cv);const ch=new THREE.Mesh(new THREE.BoxGeometry(.8,.14,.08),M.silver());ch.position.set(0,3.3,-4.88);roomGroup.add(ch);for(let i=-1;i<=1;i++){const cn=new THREE.Mesh(new THREE.CylinderGeometry(.04,.05,.25,8),M.bone());cn.position.set(i*.5,.82,-4);roomGroup.add(cn);const fl=new THREE.Mesh(new THREE.SphereGeometry(.05,8,8),M.torchFlame());fl.position.set(i*.5,.97,-4);roomGroup.add(fl);const cl=new THREE.PointLight(0xff8844,.6,3);cl.position.set(i*.5,1.1,-4);scene.add(cl);torchLights.push(cl);}for(let s of[-1,1])for(let r=0;r<2;r++){const pw=new THREE.Mesh(new THREE.BoxGeometry(1.8,.18,.5),M.wood());pw.position.set(s*2,.25,-1+r*2);pw.castShadow=true;roomGroup.add(pw);}}
function buildCloister(){buildBaseRoom(10,12,4.5);scene.add(new THREE.AmbientLight(0x070a0f,.8));addTorch(-4.8,2.8,0,0x8899ff,1.0,6);addTorch(4.8,2.8,0,0x8899ff,1.0,6);for(let z=-4;z<=4;z+=4)for(let x of[-4,4]){const col=new THREE.Mesh(new THREE.CylinderGeometry(.22,.26,4.2,12),M.stoneLight());col.position.set(x,2.1,z);col.castShadow=true;roomGroup.add(col);}const winMat=new THREE.MeshStandardMaterial({color:0x2030aa,emissive:0x0010aa,emissiveIntensity:0.5,transparent:true,opacity:.35,side:THREE.DoubleSide});for(let z=-3;z<=3;z+=3){const w=new THREE.Mesh(new THREE.PlaneGeometry(1.2,1.8),winMat);w.position.set(-4.9,2.8,z);w.rotation.y=Math.PI/2;roomGroup.add(w);}}
function buildArmory(){buildBaseRoom(10,10,4.2);scene.add(new THREE.AmbientLight(0x100a06,1.0));addTorch(-4.5,2.5,0);addTorch(4.5,2.5,0);for(let side of[-1,1]){const rack=new THREE.Mesh(new THREE.BoxGeometry(.1,.08,3.5),M.wood());rack.position.set(side*4.3,2,0);roomGroup.add(rack);for(let i=0;i<4;i++){const sw=new THREE.Mesh(new THREE.BoxGeometry(.08,1.4,.04),M.silver());sw.position.set(side*4.5,1.5,-1.5+i);roomGroup.add(sw);}}const sh=new THREE.Mesh(new THREE.CylinderGeometry(.55,.55,.04,6),M.silver());sh.rotation.x=Math.PI/2;sh.position.set(0,2.2,-4.88);roomGroup.add(sh);}
function buildLibrary(){buildBaseRoom(10,10,4.2);scene.add(new THREE.AmbientLight(0x0f0c06,1.1));addTorch(0,3,-4.5,0xffcc66,1.2,7);for(let side of[-1,1]){const shelf=new THREE.Mesh(new THREE.BoxGeometry(.15,3,4),M.wood());shelf.position.set(side*4.92,1.5,0);roomGroup.add(shelf);for(let row=0;row<3;row++)for(let col=0;col<5;col++){const bk=new THREE.Mesh(new THREE.BoxGeometry(.04,.4+Math.random()*.3,.35),new THREE.MeshStandardMaterial({color:new THREE.Color().setHSL(Math.random(),.4,.2),roughness:.9,metalness:0}));bk.position.set(side*4.82,.5+row*.8,-1.5+col*.6);roomGroup.add(bk);}}const desk=new THREE.Mesh(new THREE.BoxGeometry(2,.04,1),M.wood());desk.position.set(0,.75,-2);roomGroup.add(desk);const cl=new THREE.PointLight(0xffcc44,1.2,4);cl.position.set(.3,1,-2);scene.add(cl);torchLights.push(cl);}
function buildBarracks(){buildBaseRoom(10,10,4.0);scene.add(new THREE.AmbientLight(0x080608,0.9));addTorch(0,2.5,-4.5,0xff7722,1.2,7);for(let side of[-1,1])for(let r=0;r<2;r++){const bunk=new THREE.Mesh(new THREE.BoxGeometry(1.8,.1,2.2),M.wood());bunk.position.set(side*3.2,.6,-1.5+r*3);bunk.castShadow=true;roomGroup.add(bunk);const top=new THREE.Mesh(new THREE.BoxGeometry(1.8,.1,2.2),M.wood());top.position.set(side*3.2,1.7,-1.5+r*3);roomGroup.add(top);}}
function buildInfirmary(){buildBaseRoom(10,10,4.0);scene.add(new THREE.AmbientLight(0x0a0f0a,1.0));addTorch(-4,2.2,0,0xffddaa,0.9,6);addTorch(4,2.2,0,0xffddaa,0.9,6);for(let i=0;i<3;i++){const bd=new THREE.Mesh(new THREE.BoxGeometry(1.8,.15,2.5),M.stoneLight());bd.position.set(-3+i*3,.45,0);bd.castShadow=true;roomGroup.add(bd);}const glow=new THREE.PointLight(0xff6622,1.4,5);glow.position.set(2,1,2);scene.add(glow);torchLights.push(glow);}
function buildTower(){buildBaseRoom(8,8,9,M.stoneLight(),M.floor(),M.stoneDark());scene.add(new THREE.AmbientLight(0x05080f,.7));addTorch(-3,3,0,0x8899cc,.9,7);addTorch(3,3,0,0x8899cc,.9,7);const bell=new THREE.Mesh(new THREE.CylinderGeometry(.55,.75,.7,12,1,true),M.silver());bell.position.set(0,7.8,0);roomGroup.add(bell);const rope=new THREE.Mesh(new THREE.CylinderGeometry(.02,.02,5,6),M.wood());rope.position.set(0,5,0);roomGroup.add(rope);}
function buildCourtyard(){buildBaseRoom(14,14,0.01,M.floor(),new THREE.MeshStandardMaterial({color:0x1a1612,roughness:1}),M.stoneDark());scene.background=new THREE.Color(0x040208);scene.fog=new THREE.FogExp2(0x040208,.12);scene.add(new THREE.AmbientLight(0x08060f,.6));addTorch(-5,2.2,-6,0xff6600,1.5,9);addTorch(5,2.2,-6,0xff6600,1.5,9);addTorch(-5,2.2,6,0xff6600,1.5,9);addTorch(5,2.2,6,0xff6600,1.5,9);for(let pos of[[-3,.2,2],[3,.2,2],[-1,.2,-3]]){const bar=new THREE.Mesh(new THREE.CylinderGeometry(.28,.32,.55,10),M.wood());bar.position.set(...pos);roomGroup.add(bar);const fire=new THREE.PointLight(0xff7722,2,5);fire.position.set(pos[0],pos[1]+1,pos[2]);scene.add(fire);torchLights.push(fire);}}
function buildCrypt(){buildBaseRoom(8,10,3.5,M.stoneDark(),M.stoneDark(),M.stoneDark());scene.background=new THREE.Color(0x000000);scene.fog=new THREE.FogExp2(0x000000,.25);scene.add(new THREE.AmbientLight(0x000500,.4));addTorch(0,2.5,-4.5,0x00aa44,.7,5);const rune=new THREE.Mesh(new THREE.TorusGeometry(.7,.04,8,16),M.greenGlow());rune.position.set(0,2.8,-4.88);rune.rotation.x=Math.PI/2;roomGroup.add(rune);const sk=new THREE.Mesh(new THREE.SphereGeometry(.18,10,10),M.bone());sk.position.set(1.5,.18,1);roomGroup.add(sk);}
function buildCatacombs(){buildBaseRoom(6,12,3.2,M.stoneDark(),M.stoneDark(),M.stoneDark());scene.background=new THREE.Color(0x000000);scene.fog=new THREE.FogExp2(0x000000,.3);scene.add(new THREE.AmbientLight(0x030305,.3));addTorch(0,2,-4.5,0x3355ff,.5,5);for(let row=0;row<2;row++)for(let col=0;col<3;col++)for(let side of[-1,1]){const sk=new THREE.Mesh(new THREE.SphereGeometry(.1,8,8),M.bone());sk.position.set(side*2.7,.5+row*.8,-3+col*2.2);roomGroup.add(sk);const ey=new THREE.Mesh(new THREE.SphereGeometry(.02,6,6),M.greenGlow());ey.position.set(side*2.65,.52+row*.8,-3.06+col*2.2+.04);roomGroup.add(ey);}}
function buildLair(){buildBaseRoom(12,12,5.5,M.stoneDark(),M.stoneDark(),M.stoneDark());scene.background=new THREE.Color(0x000000);scene.fog=new THREE.FogExp2(0x020008,.15);scene.add(new THREE.AmbientLight(0x020008,.5));const ambGreen=new THREE.PointLight(0x00aa33,1.2,15);ambGreen.position.set(0,2,0);scene.add(ambGreen);for(let r=0;r<3;r++){const ring=new THREE.Mesh(new THREE.TorusGeometry(1.5+r*.8,.05,8,48),M.runeGlow());ring.rotation.x=-Math.PI/2;ring.position.y=.02;roomGroup.add(ring);}for(let a=0;a<4;a++){const ang=a*(Math.PI/2)+Math.PI/4;const pil=new THREE.Mesh(new THREE.CylinderGeometry(.28,.35,5.5,10),M.stoneDark());pil.position.set(Math.sin(ang)*5,2.75,Math.cos(ang)*5);roomGroup.add(pil);addTorch(Math.sin(ang)*4.5,3.5,Math.cos(ang)*4.5,0x00dd55,0.9,6);}}
function buildHall(){buildBaseRoom(12,16,5.5,M.stone(),M.floor(),M.stoneDark());scene.add(new THREE.AmbientLight(0x0c0808,.9));addTorch(-5,3.5,-6);addTorch(5,3.5,-6);addTorch(-5,3.5,2);addTorch(5,3.5,2);const tbl=new THREE.Mesh(new THREE.BoxGeometry(3,.08,8),M.wood());tbl.position.set(0,.8,0);tbl.castShadow=true;roomGroup.add(tbl);for(let side of[-1,1]){const tap=new THREE.Mesh(new THREE.PlaneGeometry(2.5,3.5),M.cloth());tap.position.set(side*5.9,2.8,0);tap.rotation.y=side*Math.PI/2;roomGroup.add(tap);}const fpLight=new THREE.PointLight(0xff7722,2.5,8);fpLight.position.set(0,1,-7);scene.add(fpLight);torchLights.push(fpLight);}
function buildTreasury(){buildBaseRoom(8,10,4.0);scene.add(new THREE.AmbientLight(0x100e06,1.1));addTorch(-3.5,2.5,-4.5,0xffcc44,1.3,7);addTorch(3.5,2.5,-4.5,0xffcc44,1.3,7);for(let i=0;i<3;i++){const chest=new THREE.Mesh(new THREE.BoxGeometry(.8,.55,.55),M.wood());chest.position.set(-2+i*2,.28,1);chest.castShadow=true;roomGroup.add(chest);const trim=new THREE.Mesh(new THREE.BoxGeometry(.84,.04,.58),M.gold());trim.position.set(-2+i*2,.47,1);roomGroup.add(trim);}for(let i=0;i<8;i++){const coin=new THREE.Mesh(new THREE.CylinderGeometry(.08,.08,.02,10),M.gold());coin.position.set(-2+Math.random()*4,.06,-2+Math.random()*2);roomGroup.add(coin);}const ped=new THREE.Mesh(new THREE.CylinderGeometry(.3,.38,.7,8),M.stoneLight());ped.position.set(0,.35,-3.5);roomGroup.add(ped);const seal=new THREE.Mesh(new THREE.CylinderGeometry(.28,.28,.06,8),M.gold());seal.position.set(0,.73,-3.5);roomGroup.add(seal);const sl=new THREE.PointLight(0xffcc44,1.8,4);sl.position.set(0,1.5,-3.5);scene.add(sl);torchLights.push(sl);}
function buildThrone(){buildBaseRoom(10,12,4.8,M.stoneDark(),M.stoneDark(),M.stoneDark());scene.add(new THREE.AmbientLight(0x050308,.5));addTorch(-4,2.8,-5,0x6622aa,.8,6);addTorch(4,2.8,-5,0x6622aa,.8,6);const base=new THREE.Mesh(new THREE.BoxGeometry(2.2,.5,1.5),M.bone());base.position.set(0,.25,-4.5);roomGroup.add(base);const back=new THREE.Mesh(new THREE.BoxGeometry(2.2,2.5,.15),M.bone());back.position.set(0,1.75,-5.15);roomGroup.add(back);for(let i=-1;i<=1;i++){const sk=new THREE.Mesh(new THREE.SphereGeometry(.14,10,10),M.bone());sk.position.set(i*.7,2.85,-5.12);roomGroup.add(sk);}const crown=new THREE.Mesh(new THREE.TorusGeometry(.25,.04,6,10),M.gold());crown.position.set(0,3.1,-5.12);crown.rotation.x=Math.PI/2;roomGroup.add(crown);}
function buildGallery(){buildBaseRoom(6,16,4.2);scene.add(new THREE.AmbientLight(0x0c0a08,.8));addTorch(0,2.5,-6,0xffcc88,1.2,8);for(let z of[-4,-1,2]){const frame=new THREE.Mesh(new THREE.BoxGeometry(1.6,2,.08),M.gold());frame.position.set(-2.92,2.2,z);roomGroup.add(frame);}}
function buildDungeon(){buildBaseRoom(6,10,3.0,M.stoneDark(),M.stoneDark(),M.stoneDark());scene.background=new THREE.Color(0x000000);scene.fog=new THREE.FogExp2(0x000000,.28);scene.add(new THREE.AmbientLight(0x030303,.3));addTorch(0,2,-4.5,0xff6600,.6,5);}
const roomBuilders={chapel:buildChapel,cloister:buildCloister,armory:buildArmory,library:buildLibrary,barracks:buildBarracks,infirmary:buildInfirmary,tower:buildTower,courtyard:buildCourtyard,crypt:buildCrypt,catacombs:buildCatacombs,lair:buildLair,hall:buildHall,treasury:buildTreasury,throne:buildThrone,gallery:buildGallery,dungeon:buildDungeon};
function buildSkeleton(){const g=new THREE.Group();const bm=M.bone();const skull=new THREE.Mesh(new THREE.SphereGeometry(.2,12,12),bm);skull.position.y=1.92;g.add(skull);const ey=new THREE.MeshStandardMaterial({color:0x00ff88,emissive:0x00cc44,emissiveIntensity:3});for(let s of[-1,1]){const e=new THREE.Mesh(new THREE.SphereGeometry(.04,8,8),ey);e.position.set(s*.07,1.95,.16);g.add(e);}const sp=new THREE.Mesh(new THREE.CylinderGeometry(.05,.07,.7,8),bm);sp.position.y=1.35;g.add(sp);const rb=new THREE.Mesh(new THREE.BoxGeometry(.38,.44,.12),bm);rb.position.y=1.52;g.add(rb);for(let s of[-1,1]){const ua=new THREE.Mesh(new THREE.CylinderGeometry(.04,.04,.45,8),bm);ua.position.set(s*.32,1.6,0);ua.rotation.z=s*0.4;g.add(ua);}for(let s of[-1,1]){const th=new THREE.Mesh(new THREE.CylinderGeometry(.055,.05,.5,8),bm);th.position.set(s*.12,.72,0);g.add(th);}return g;}
function buildZombie(){const g=new THREE.Group();const zm=new THREE.MeshStandardMaterial({color:0x6a7858,roughness:.9,metalness:0});const cm=new THREE.MeshStandardMaterial({color:0x3a2810,roughness:.98,metalness:0});const hd=new THREE.Mesh(new THREE.BoxGeometry(.32,.3,.28),zm);hd.position.y=1.88;g.add(hd);const ey=new THREE.MeshStandardMaterial({color:0xccbb88,emissive:0x887744,emissiveIntensity:1});for(let s of[-1,1]){const e=new THREE.Mesh(new THREE.SphereGeometry(.05,8,8),ey);e.position.set(s*.09,1.9,.15);g.add(e);}const to=new THREE.Mesh(new THREE.BoxGeometry(.52,.75,.28),cm);to.position.y=1.35;g.add(to);for(let s of[-1,1]){const l=new THREE.Mesh(new THREE.CylinderGeometry(.09,.08,.7,8),cm);l.position.set(s*.14,.45,0);g.add(l);}return g;}
function buildNecromancer(){const g=new THREE.Group();const rm=M.darkCloth();const bm=M.bone();const robe=new THREE.Mesh(new THREE.ConeGeometry(.55,2.1,10),rm);robe.position.y=1.05;g.add(robe);const hd=new THREE.Mesh(new THREE.SphereGeometry(.24,12,12),bm);hd.position.y=2.45;g.add(hd);const ey=M.iceWhite();for(let s of[-1,1]){const e=new THREE.Mesh(new THREE.SphereGeometry(.06,8,8),ey);e.position.set(s*.09,2.5,.2);g.add(e);}const hood=new THREE.Mesh(new THREE.ConeGeometry(.3,.55,10),rm);hood.position.y=2.85;g.add(hood);const staff=new THREE.Mesh(new THREE.CylinderGeometry(.03,.03,2.2,8),M.wood());staff.position.set(.55,1.1,0);g.add(staff);const orb=new THREE.Mesh(new THREE.SphereGeometry(.12,10,10),M.greenGlow());orb.position.set(.55,2.3,0);g.add(orb);for(let i=0;i<5;i++){const orbi=new THREE.Mesh(new THREE.SphereGeometry(.05,6,6),M.runeGlow());const a=i*(Math.PI*2/5);orbi.position.set(Math.sin(a)*.7,2.4,Math.cos(a)*.7);g.add(orbi);}return g;}
function spawnEnemy(type){while(enemyGroup.children.length)enemyGroup.remove(enemyGroup.children[0]);let model;if(type==='skeleton')model=buildSkeleton();else if(type==='zombie')model=buildZombie();else model=buildNecromancer();model.position.set(0,0,-1.5);model.rotation.y=Math.PI;enemyGroup.add(model);}
function buildRoom(roomKey){clearRoom();scene.background=new THREE.Color(0x000000);scene.fog=new THREE.FogExp2(0x000000,.18);const room=ROOMS[roomKey];const builder=roomBuilders[room.type];if(builder)builder();else buildChapel();camera.position.set(0,1.75,4.2);camera.lookAt(0,1.4,0);}
function gotoRoom(key){const fadeEl=document.getElementById('fade');fadeEl.classList.add('show');setTimeout(()=>{STATE.room=key;const room=ROOMS[key];STATE.defending=false;buildRoom(key);document.getElementById('room-title').textContent=room.name.toUpperCase();document.getElementById('room-sub').textContent=room.sub;updateNavButtons(room);checkRoomEvents(room);fadeEl.classList.remove('show');},350);}
function updateNavButtons(room){['n','s','e','w'].forEach(dir=>{const dirName={n:'north',s:'south',e:'east',w:'west'}[dir];document.getElementById('btn-'+dir).disabled=!room.exits[dirName];});}
function move(dir){const room=ROOMS[STATE.room];const dest=room.exits[dir];if(!dest||STATE.inCombat)return;gotoRoom(dest);}
function checkRoomEvents(room){hideCombatButtons();hidePickupButton();if(room.heals&&STATE.hp<STATE.maxHp){const amt=Math.min(30,STATE.maxHp-STATE.hp);STATE.hp+=amt;updateHP();addLog('The herbs restore '+amt+' HP.','heal');}if(room.relic&&!STATE.pickedRelics[STATE.room])showPickupButton(room.relic);if(room.enemy&&!STATE.defeatedEnemies[STATE.room])startCombat(room.enemy);addLog(room.sub,'lore');}
function startCombat(enemyKey){const stats=ENEMY_STATS[enemyKey];STATE.inCombat=true;STATE.currentEnemy={...stats,key:enemyKey};STATE.enemyHp=stats.hp;STATE.defending=false;spawnEnemy(stats.type);showCombatButtons();addLog('A '+stats.name+' emerges from the shadows!','combat');addLog('HP: '+stats.hp+' | ATK: '+stats.atk[0]+'-'+stats.atk[1],'system');}
function doAttack(){if(!STATE.inCombat)return;STATE.defending=false;const e=STATE.currentEnemy;let dmg=STATE.atk+Math.floor(Math.random()*8)-2;if(STATE.inventory.includes('Templar Longsword'))dmg+=6;dmg=Math.max(1,dmg);STATE.enemyHp-=dmg;addLog('You strike the '+e.name+' for '+dmg+' damage!','combat');shakeEnemy();if(STATE.enemyHp<=0){endCombat(true);return;}enemyTurn();}
function doDefend(){if(!STATE.inCombat)return;STATE.defending=true;addLog('You brace — damage halved this turn.','system');enemyTurn();}
function doFlee(){if(!STATE.inCombat)return;if(Math.random()<0.55){STATE.inCombat=false;hideCombatButtons();while(enemyGroup.children.length)enemyGroup.remove(enemyGroup.children[0]);const exits=Object.values(ROOMS[STATE.room].exits);if(exits.length>0)gotoRoom(exits[Math.floor(Math.random()*exits.length)]);addLog('You flee!','system');}else{addLog('Failed to escape!','combat');enemyTurn();}}
function enemyTurn(){const e=STATE.currentEnemy;let dmg=e.atk[0]+Math.floor(Math.random()*(e.atk[1]-e.atk[0]+1));let def=STATE.def+(STATE.inventory.includes('Chainmail Hauberk')?5:0);dmg=Math.max(1,dmg-Math.floor(def*.35));if(STATE.defending)dmg=Math.floor(dmg*.3);STATE.hp-=dmg;STATE.defending=false;if(dmg>0)addLog('The '+e.name+' strikes you for '+dmg+' damage!','combat');updateHP();if(STATE.hp<=0){if(STATE.inventory.includes('Holy Water')){STATE.hp=15;updateHP();addLog('Holy Water saves you! (15 HP)','divine');}else{playerDeath();}}}
function endCombat(won){STATE.inCombat=false;STATE.defeatedEnemies[STATE.room]=true;while(enemyGroup.children.length)enemyGroup.remove(enemyGroup.children[0]);hideCombatButtons();if(won){addLog('The '+STATE.currentEnemy.name+' falls!','item');if(STATE.currentEnemy.key==='necromancer')setTimeout(()=>{document.getElementById('winscreen').style.display='flex';},800);const room=ROOMS[STATE.room];if(room.relic&&!STATE.pickedRelics[STATE.room])showPickupButton(room.relic);}}
function doPickup(){const room=ROOMS[STATE.room];const relic=room.relic;STATE.pickedRelics[STATE.room]=true;STATE.inventory.push(relic);addLog('You take the '+relic+'.','item');if(relic==='Chainmail Hauberk')STATE.def+=4;if(relic==='Templar Longsword')STATE.atk+=4;if(relic==='Holy Water')STATE.maxHp+=20;updateHUD();hidePickupButton();}
function updateHP(){const pct=Math.max(0,STATE.hp/STATE.maxHp)*100;document.getElementById('hp-bar-in').style.width=pct+'%';document.getElementById('hp-bar-in').style.background=pct>60?'linear-gradient(90deg,#4a8,#6c8)':pct>30?'linear-gradient(90deg,#c84,#ea6)':'linear-gradient(90deg,#c44,#e44)';document.getElementById('hp-num').textContent=Math.max(0,STATE.hp)+' / '+STATE.maxHp;}
function updateHUD(){updateHP();document.getElementById('inv-count').textContent='⚔ '+STATE.inventory.length+' relics';}
function showCombatButtons(){['btn-attack','btn-defend','btn-flee'].forEach(id=>document.getElementById(id).style.display='block');['btn-n','btn-s','btn-e','btn-w'].forEach(id=>document.getElementById(id).disabled=true);}
function hideCombatButtons(){['btn-attack','btn-defend','btn-flee'].forEach(id=>document.getElementById(id).style.display='none');updateNavButtons(ROOMS[STATE.room]);}
function showPickupButton(relic){const btn=document.getElementById('btn-pickup');btn.textContent='✦ TAKE '+relic.toUpperCase();btn.style.display='block';}
function hidePickupButton(){document.getElementById('btn-pickup').style.display='none';}
let logCount=0;
function addLog(msg,type=''){const el=document.getElementById('log-scroll');const line=document.createElement('div');line.className='log-line'+(type?' '+type:'');line.textContent=msg;el.appendChild(line);if(++logCount>60)el.removeChild(el.firstChild);el.scrollTop=el.scrollHeight;}
function playerDeath(){STATE.inCombat=false;hideCombatButtons();document.getElementById('death-msg').textContent='The '+(STATE.currentEnemy?.name||'darkness')+' has claimed you.';document.getElementById('gameover').style.display='flex';}
function restartGame(){Object.assign(STATE,{room:'chapel',hp:100,maxHp:100,atk:10,def:3,inventory:[],defeatedEnemies:{},pickedRelics:{},inCombat:false,currentEnemy:null,enemyHp:0,defending:false});document.getElementById('gameover').style.display='none';document.getElementById('winscreen').style.display='none';document.getElementById('log-scroll').innerHTML='';logCount=0;updateHUD();gotoRoom('chapel');addLog('You stand again at the chapel entrance.','divine');}
let shakeTime=0;
function shakeEnemy(){shakeTime=18;}
let tick=0;
(function animate(){requestAnimationFrame(animate);tick+=0.016;vigPass.uniforms.time.value=tick*.5;torchLights.forEach((l,i)=>{l.intensity*=0.92;l.intensity+=(.08)*(1.4+Math.sin(tick*4.5+i*1.7)*.5);});if(enemyGroup.children.length){const e=enemyGroup.children[0];e.position.y=Math.sin(tick*1.4)*.04;if(shakeTime>0){e.position.x=Math.sin(shakeTime*1.8)*.14*(shakeTime/18);shakeTime--;}else{e.position.x*=0.88;}if(STATE.currentEnemy?.key==='necromancer'){e.children.forEach((ch,i)=>{if(i>=e.children.length-5){const a=tick*1.2+i*(Math.PI*2/5);ch.position.x=Math.sin(a)*.7;ch.position.z=Math.cos(a)*.7;}});}}camera.position.y=1.75+Math.sin(tick*.5)*.012;composer.render();})();
buildRoom('chapel');updateNavButtons(ROOMS['chapel']);updateHUD();
addLog('Knights Templar: 3D Edition — The fortress has fallen to undeath.','system');
addLog('You are the last Templar. Defeat the Necromancer in his lair.','system');
addLog('Use the N/S/E/W buttons to explore. Gather relics. Survive.','lore');
</script>
</body>
</html>

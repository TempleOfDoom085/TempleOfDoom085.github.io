<script type="importmap">
{"imports":{"three":"https://cdn.jsdelivr.net/npm/three@0.158.0/build/three.module.js","three/addons/":"https://cdn.jsdelivr.net/npm/three@0.158.0/examples/jsm/"}}

<script type="module">
import * as THREE from 'three';
import { EffectComposer } from 'three/addons/postprocessing/EffectComposer.js';
import { RenderPass }     from 'three/addons/postprocessing/RenderPass.js';
import { UnrealBloomPass } from 'three/addons/postprocessing/UnrealBloomPass.js';
import { ShaderPass }     from 'three/addons/postprocessing/ShaderPass.js';

// ═══════════════════════════════════════════════════════
// CONFIG
// ═══════════════════════════════════════════════════════
const CFG = {
  mapSize: 240,
  segments: 120,
  heightScale: 22,
  waterLevel: 1.4,
  playerSpeed: 10,
  sprintMult: 1.8,
  jumpForce: 9,
  gravity: 24,
  playerHeight: 1.2,
  camDist: 9,
  camSmooth: 9,
  camMinPitch: -0.05,
  camMaxPitch: 0.95,
};

// ═══════════════════════════════════════════════════════
// NOISE / TERRAIN HEIGHT
// ═══════════════════════════════════════════════════════
function hash(x, z) {
  const s = Math.sin(x * 127.1 + z * 311.7) * 43758.5453;
  return s - Math.floor(s);
}
function noise2d(x, z) {
  const ix = Math.floor(x), iz = Math.floor(z);
  const fx = x - ix, fz = z - iz;
  const ux = fx*fx*(3-2*fx), uz = fz*fz*(3-2*fz);
  const a = hash(ix,iz), b = hash(ix+1,iz), c = hash(ix,iz+1), d = hash(ix+1,iz+1);
  return a + (b-a)*ux + (c-a)*uz + (a-b-c+d)*ux*uz;
}
function fbm(x, z, oct=6) {
  let v=0, a=0.5, f=1;
  for(let i=0;i<oct;i++){v+=a*noise2d(x*f,z*f);a*=0.5;f*=2.07;}
  return v;
}
function getHeight(wx, wz) {
  const s = 0.013;
  const n = fbm(wx*s, wz*s);
  // Island shape: fade to sea at edges
  const edge = Math.max(0, 1 - Math.sqrt(wx*wx+wz*wz)/115);
  return (n * 1.35 + edge * 0.3 - 0.42) * CFG.heightScale;
}
function getBiome(h) {
  const w = CFG.waterLevel;
  if (h < w+0.6) return 'SHORELINE';
  if (h < w+4)   return 'LOWLANDS';
  if (h < w+9)   return 'HIGHLANDS';
  if (h < w+14)  return 'FOREST';
  if (h < w+18)  return 'MOUNTAINS';
  return 'PEAKS';
}
function getBiomeColor(h) {
  const w = CFG.waterLevel;
  if (h < w+0.6) return new THREE.Color(0.90, 0.84, 0.56); // sand
  const t = Math.min((h-w)/(CFG.heightScale*0.9), 1);
  if (t < 0.18)  return new THREE.Color(0.32, 0.82, 0.20); // bright green
  if (t < 0.40)  return new THREE.Color(0.20, 0.68, 0.14); // mid green
  if (t < 0.58)  return new THREE.Color(0.13, 0.50, 0.09); // dark forest
  if (t < 0.74)  return new THREE.Color(0.48, 0.44, 0.36); // rock gray
  if (t < 0.87)  return new THREE.Color(0.60, 0.56, 0.50); // light rock
  return new THREE.Color(0.94, 0.94, 0.98);                // snow
}

// ═══════════════════════════════════════════════════════
// RENDERER + SCENE + CAMERA
// ═══════════════════════════════════════════════════════
const canvas = document.getElementById('c');
const renderer = new THREE.WebGLRenderer({canvas, antialias:true, powerPreference:'high-performance'});
renderer.setPixelRatio(Math.min(devicePixelRatio, 1.8));
renderer.setSize(innerWidth, innerHeight);
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 0.95;

const scene = new THREE.Scene();
scene.fog = new THREE.Fog(0xaed4f7, 80, 210);

const camera = new THREE.PerspectiveCamera(62, innerWidth/innerHeight, 0.1, 400);

const clock = new THREE.Clock();

// ═══════════════════════════════════════════════════════
// BUILD TERRAIN
// ═══════════════════════════════════════════════════════
function buildTerrain() {
  const geo = new THREE.PlaneGeometry(CFG.mapSize, CFG.mapSize, CFG.segments, CFG.segments);
  geo.rotateX(-Math.PI / 2);

  const pos = geo.attributes.position;
  const colors = new Float32Array(pos.count * 3);

  for (let i = 0; i < pos.count; i++) {
    const x = pos.getX(i), z = pos.getZ(i);
    const h = getHeight(x, z);
    pos.setY(i, h);
    const col = getBiomeColor(h);
    colors[i*3] = col.r; colors[i*3+1] = col.g; colors[i*3+2] = col.b;
  }
  geo.setAttribute('color', new THREE.BufferAttribute(colors, 3));
  geo.computeVertexNormals();

  const mat = new THREE.MeshLambertMaterial({vertexColors: true});
  const mesh = new THREE.Mesh(geo, mat);
  mesh.receiveShadow = true;
  scene.add(mesh);
}

// ═══════════════════════════════════════════════════════
// BUILD SKY
// ═══════════════════════════════════════════════════════
const skyUniforms = {
  sunDir:    {value: new THREE.Vector3(0.6, 0.6, 0.4).normalize()},
  dayFrac:   {value: 0.7},
};
function buildSky() {
  const mat = new THREE.ShaderMaterial({
    uniforms: skyUniforms,
    vertexShader: `
      varying vec3 vDir;
      void main(){vDir=position;gl_Position=projectionMatrix*modelViewMatrix*vec4(position,1.);}`,
    fragmentShader: `
      uniform vec3 sunDir;uniform float dayFrac;
      varying vec3 vDir;
      void main(){
        vec3 d=normalize(vDir);
        float up=clamp(d.y*0.5+0.5,0.,1.);
        // Day colours
        vec3 dZen=vec3(0.08,0.20,0.55);
        vec3 dHor=vec3(0.55,0.78,0.98);
        // Night colours
        vec3 nZen=vec3(0.01,0.02,0.09);
        vec3 nHor=vec3(0.04,0.06,0.16);
        // Sunset
        vec3 sunCol=vec3(0.96,0.42,0.08);
        float sunset=(1.-abs(sunDir.y))*max(0.,sunDir.y+0.18)*(1.-up)*0.9;
        vec3 daySky=mix(dHor,dZen,pow(up,.55));
        daySky=mix(daySky,sunCol,sunset);
        vec3 nightSky=mix(nHor,nZen,up);
        vec3 sky=mix(nightSky,daySky,dayFrac);
        // Sun disk
        float sd=dot(d,normalize(sunDir));
        sky+=vec3(1.,.92,.72)*smoothstep(.9990,1.,sd)*dayFrac;
        sky+=vec3(.9,.45,.1)*smoothstep(.992,.9990,sd)*.35*dayFrac;
        // Stars
        float sr=fract(sin(dot(floor(d.xz*80.),vec2(127.1,311.7)))*43758.5);
        sky+=step(.992,sr)*(1.-dayFrac)*.85;
        gl_FragColor=vec4(sky,1.);}`,
    side: THREE.BackSide,
    depthWrite: false,
  });
  scene.add(new THREE.Mesh(new THREE.SphereGeometry(350, 32, 16), mat));
}

// ═══════════════════════════════════════════════════════
// LIGHTING
// ═══════════════════════════════════════════════════════
let sun, ambient, hemi;
function buildLighting() {
  sun = new THREE.DirectionalLight(0xFFF5DD, 2.0);
  sun.position.set(60, 80, 30);
  sun.castShadow = true;
  sun.shadow.mapSize.setScalar(1024);
  sun.shadow.camera.near = 1;
  sun.shadow.camera.far = 250;
  sun.shadow.camera.left = sun.shadow.camera.bottom = -90;
  sun.shadow.camera.right = sun.shadow.camera.top = 90;
  scene.add(sun);

  ambient = new THREE.AmbientLight(0x8AAAC8, 0.55);
  scene.add(ambient);

  hemi = new THREE.HemisphereLight(0x88C8FF, 0x3A7A2A, 0.75);
  scene.add(hemi);
}

// ═══════════════════════════════════════════════════════
// PLAYER
// ═══════════════════════════════════════════════════════
const player = {
  mesh: null,
  vel: new THREE.Vector3(),
  onGround: false,
};
function buildPlayer() {
  const g = new THREE.Group();

  // Body
  g.add(Object.assign(new THREE.Mesh(
    new THREE.BoxGeometry(0.56, 0.68, 0.32),
    new THREE.MeshLambertMaterial({color:0x1A5FBF})
  ), {position: new THREE.Vector3(0, 0.34, 0)}));

  // Head
  g.add(Object.assign(new THREE.Mesh(
    new THREE.BoxGeometry(0.46, 0.44, 0.44),
    new THREE.MeshLambertMaterial({color:0xF0C090})
  ), {position: new THREE.Vector3(0, 1.0, 0)}));

  // Cape
  const cape = new THREE.Mesh(
    new THREE.ConeGeometry(0.28, 0.75, 4),
    new THREE.MeshLambertMaterial({color:0x8B0000})
  );
  cape.rotation.x = Math.PI;
  cape.position.set(0, 0.68, -0.1);
  g.add(cape);

  // Glowing eyes
  const eyeMat = new THREE.MeshStandardMaterial({color:0x00FFCC, emissive:0x00FFCC, emissiveIntensity:5});
  [-0.11, 0.11].forEach(ox => {
    const eye = new THREE.Mesh(new THREE.SphereGeometry(0.06,5,5), eyeMat);
    eye.position.set(ox, 1.0, 0.22);
    g.add(eye);
  });

  g.castShadow = true;
  player.mesh = g;
  player.vel.set(0,0,0);

  const sh = getHeight(0, 8);
  g.position.set(0, sh + CFG.playerHeight, 8);
  scene.add(g);
}

function updatePlayer(dt) {
  const p = player.mesh.position;
  const speed = (keys['shift'] ? CFG.playerSpeed * CFG.sprintMult : CFG.playerSpeed) * dt;

  // Camera-relative move direction
  const mx = (keys['d']?1:0)-(keys['a']?1:0);
  const mz = (keys['s']?1:0)-(keys['w']?1:0);

  if (mx !== 0 || mz !== 0) {
    const dir = new THREE.Vector3(mx, 0, mz).normalize();
    dir.applyEuler(new THREE.Euler(0, cam.yaw, 0));
    p.x += dir.x * speed;
    p.z += dir.z * speed;
    player.mesh.rotation.y = Math.atan2(dir.x, dir.z);
  }

  // Gravity + terrain collision
  player.vel.y -= CFG.gravity * dt;
  p.y += player.vel.y * dt;
  const floor = getHeight(p.x, p.z) + CFG.playerHeight;
  if (p.y <= floor) {
    p.y = floor;
    player.vel.y = 0;
    player.onGround = true;
  } else {
    player.onGround = false;
  }

  // World bounds
  const lim = CFG.mapSize * 0.47;
  p.x = Math.max(-lim, Math.min(lim, p.x));
  p.z = Math.max(-lim, Math.min(lim, p.z));
}

// ═══════════════════════════════════════════════════════
// CAMERA
// ═══════════════════════════════════════════════════════
const cam = {yaw:0, pitch:0.38, dist:CFG.camDist, target:new THREE.Vector3()};
let idleTimer = 0;
const _lastPos = new THREE.Vector3();

function updateCamera(dt) {
  const p = player.mesh.position;
  const moved = p.distanceTo(_lastPos) > 0.01;
  _lastPos.copy(p);
  if (moved) idleTimer = 0; else idleTimer += dt;
  if (idleTimer > 4) cam.yaw += dt * 0.055; // slow idle spin

  const cy = Math.cos(cam.pitch), sy = Math.sin(cam.pitch);
  const cx = Math.cos(cam.yaw),   sx = Math.sin(cam.yaw);
  cam.target.set(
    p.x + sx * cy * cam.dist,
    p.y + sy * cam.dist + 1.5,
    p.z + cx * cy * cam.dist
  );
  camera.position.lerp(cam.target, Math.min(1, dt * CFG.camSmooth));
  camera.lookAt(p.x, p.y + 1.5, p.z);
}

// ═══════════════════════════════════════════════════════
// DAY / NIGHT
// ═══════════════════════════════════════════════════════
let dayTime = 0.28; // 0–1, 0.25=dawn 0.5=noon 0.75=dusk
function updateDayNight(dt) {
  dayTime = (dayTime + dt / 140) % 1;
  const angle = (dayTime - 0.25) * Math.PI * 2;
  const sx = Math.cos(angle), sy = Math.sin(angle);
  sun.position.set(sx * 90, sy * 90, 25);

  const day = Math.max(0, Math.min(1, sy * 2.2));
  const dusk = (1 - Math.abs(sy)) * Math.max(0, sx) * 0.9;
  const dawn = (1 - Math.abs(sy)) * Math.max(0, -sx) * (sy > -0.25 ? 0.8 : 0);
  const warm = Math.max(dusk, dawn);

  sun.color.setRGB(1, 0.92 - warm * 0.25, 0.80 - warm * 0.5);
  sun.intensity = day * 2.0 + warm * 0.7 + 0.05;
  ambient.intensity = 0.2 + day * 0.55;
  hemi.intensity = 0.15 + day * 0.75;
  scene.fog.color.setRGB(0.55 + day*0.3, 0.68 + day*0.2 - warm*0.1, 0.82 + day*0.12);

  skyUniforms.sunDir.value.set(sx, sy, 0.25).normalize();
  skyUniforms.dayFrac.value = day;
}

// ═══════════════════════════════════════════════════════
// WATER
// ═══════════════════════════════════════════════════════
let waterMat;
function buildWater() {
  waterMat = new THREE.ShaderMaterial({
    uniforms: {time:{value:0}},
    vertexShader:`varying vec2 vUv;void main(){vUv=uv;gl_Position=projectionMatrix*modelViewMatrix*vec4(position,1.);}`,
    fragmentShader:`
      uniform float time;varying vec2 vUv;
      void main(){
        vec2 uv=vUv*10.;
        float wave=sin(uv.x*1.8+time*1.4)*.06+sin(uv.y*2.2+time*1.1)*.06
                  +sin((uv.x+uv.y)*1.2+time*0.9)*.04;
        vec3 deep=vec3(0.04,0.22,0.62);
        vec3 shallow=vec3(0.08,0.52,0.96);
        vec3 foam=vec3(0.55,0.82,1.0);
        float t=clamp(wave+0.5,0.,1.);
        vec3 col=mix(deep,shallow,t);
        col=mix(col,foam,max(0.,wave*3.));
        // Specular glint
        float spec=pow(max(0.,sin(uv.x*0.7+time)*sin(uv.y*0.6+time*1.2)),.5)*.22;
        gl_FragColor=vec4(col+spec,0.86);}`,
    transparent:true, depthWrite:false, side:THREE.DoubleSide,
  });
  const waterGeo = new THREE.PlaneGeometry(300, 300, 2, 2);
  waterGeo.rotateX(-Math.PI/2);
  const water = new THREE.Mesh(waterGeo, waterMat);
  water.position.y = CFG.waterLevel;
  scene.add(water);
}

// ═══════════════════════════════════════════════════════
// TREES
// ═══════════════════════════════════════════════════════
const TREE_GREENS = [0x2A8A16,0x38AB20,0x4CBB17,0x56C425,0x1C6B12,0x68D42A];
function buildTrees(count=280) {
  const half = 108;
  for (let i=0; i<count; i++) {
    const x = (Math.random()-.5)*half*2;
    const z = (Math.random()-.5)*half*2;
    const h = getHeight(x, z);
    if (h < CFG.waterLevel+0.8 || h > CFG.waterLevel+13) continue;

    const s = 0.55 + Math.random() * 0.95;
    const g = new THREE.Group();

    // Trunk
    g.add(Object.assign(
      new THREE.Mesh(
        new THREE.CylinderGeometry(0.11*s, 0.20*s, 1.6*s, 5),
        new THREE.MeshLambertMaterial({color:0x4A2C14})
      ), {position:new THREE.Vector3(0, 0.8*s, 0)}
    ));

    // 3 foliage cone layers — each slightly smaller and higher
    for (let j=0; j<3; j++) {
      const r = (1.15-j*0.27)*s, hh = (1.35-j*0.18)*s;
      const col = TREE_GREENS[Math.floor(Math.random()*TREE_GREENS.length)];
      const cone = new THREE.Mesh(
        new THREE.ConeGeometry(r, hh, 5+j),
        new THREE.MeshLambertMaterial({color:col})
      );
      cone.position.y = 1.6*s + j*0.68*s;
      g.add(cone);
    }

    g.position.set(x, h, z);
    g.rotation.y = Math.random()*Math.PI*2;
    g.castShadow = true;
    scene.add(g);
  }
}

// ═══════════════════════════════════════════════════════
// ROCKS
// ═══════════════════════════════════════════════════════
function buildRocks(count=130) {
  const half = 112;
  for (let i=0; i<count; i++) {
    const x = (Math.random()-.5)*half*2;
    const z = (Math.random()-.5)*half*2;
    const h = getHeight(x, z);
    if (h < CFG.waterLevel+0.5) continue;

    const s = 0.28 + Math.random()*1.1;
    const geo = new THREE.DodecahedronGeometry(s, 0);
    // Squish + stretch for variety
    const pos = geo.attributes.position;
    for (let k=0; k<pos.count; k++) {
      pos.setXYZ(k,
        pos.getX(k)*(0.72+Math.random()*0.56),
        pos.getY(k)*(0.50+Math.random()*0.62),
        pos.getZ(k)*(0.72+Math.random()*0.56)
      );
    }
    geo.computeVertexNormals();
    const l = 0.30 + Math.random()*0.22;
    const rock = new THREE.Mesh(geo,
      new THREE.MeshLambertMaterial({
        color:new THREE.Color().setHSL(0.06+Math.random()*0.06, 0.10+Math.random()*0.08, l)
      })
    );
    rock.position.set(x, h + s*0.22, z);
    rock.rotation.set(Math.random()*Math.PI, Math.random()*Math.PI, Math.random()*Math.PI);
    rock.castShadow = true;
    scene.add(rock);
  }
}

// ═══════════════════════════════════════════════════════
// RUINS
// ═══════════════════════════════════════════════════════
function buildRuins() {
  const stoneMat  = new THREE.MeshLambertMaterial({color:0x8A7E6C});
  const mossyMat  = new THREE.MeshLambertMaterial({color:0x4E6234});

  function addRuin(cx, cz) {
    const h = getHeight(cx, cz);
    if (h < CFG.waterLevel + 1.5) return;
    const g = new THREE.Group();
    g.position.set(cx, h, cz);

    // Columns (2–5 per cluster, some fallen)
    const nc = 2 + Math.floor(Math.random()*4);
    for (let i=0; i<nc; i++) {
      const ch = 1.4 + Math.random()*2.8;
      const mat = Math.random()<0.3 ? mossyMat : stoneMat;
      const col = new THREE.Mesh(new THREE.CylinderGeometry(0.22, 0.26, ch, 7), mat);
      const ox = (Math.random()-.5)*7, oz = (Math.random()-.5)*7;
      col.position.set(ox, ch/2, oz);
      // Some columns are fallen
      if (Math.random()<0.28) {
        col.rotation.z = Math.PI/2 + (Math.random()-.5)*0.3;
        col.position.y = 0.22;
      } else {
        col.rotation.z = (Math.random()-.5)*0.1;
      }
      g.add(col);
    }

    // Broken wall section (60% chance)
    if (Math.random()<0.6) {
      const ww = 3+Math.random()*3, wh = 1.2+Math.random()*1.5;
      const wall = new THREE.Mesh(new THREE.BoxGeometry(ww, wh, 0.45), stoneMat);
      wall.position.set((Math.random()-.5)*4, wh/2, (Math.random()-.5)*4);
      wall.rotation.y = Math.random()*Math.PI;
      g.add(wall);
    }

    // Standing arch (30% chance)
    if (Math.random()<0.30) {
      const pMat = Math.random()<0.4 ? mossyMat : stoneMat;
      const p1 = new THREE.Mesh(new THREE.BoxGeometry(0.4, 3.2, 0.4), pMat);
      const p2 = new THREE.Mesh(new THREE.BoxGeometry(0.4, 3.2, 0.4), pMat);
      const top = new THREE.Mesh(new THREE.BoxGeometry(3.0, 0.42, 0.4), pMat);
      p1.position.set(-1.3, 1.6, 0); p2.position.set(1.3, 1.6, 0);
      top.position.set(0, 3.2, 0);
      g.add(p1, p2, top);
    }

    g.castShadow = true;
    scene.add(g);
  }

  // 10 ruin clusters at curated spots
  [
    [22,28],[-32,14],[47,-18],[-22,-42],
    [56,10],[-48,22],[14,-52],[-36,36],
    [0,-32],[38,-34]
  ].forEach(([x,z]) => addRuin(x, z));
}

// ═══════════════════════════════════════════════════════
// GLOWING ARTIFACTS + INTERACTION
// ═══════════════════════════════════════════════════════
const artifacts = [];
let artifactsFound = 0;
const LORE = [
  'An ancient shard from before the first dawn.',
  'It hums with energy older than the hills.',
  'Legends say the world was built from these.',
  'Warm to the touch. Almost breathing.',
  'A script no scholar can decipher marks its face.',
  'Strange calm washes over you.',
  'Something stirs in the deep forest.',
  'The relic pulses with the rhythm of the earth.',
];
const ARTIFACT_COLORS = [
  {col:0xAA44FF, name:'VOID SHARD'},
  {col:0x00FFCC, name:'SEA CRYSTAL'},
  {col:0x88FF00, name:'LIFE GEM'},
  {col:0xFF8800, name:'EMBER STONE'},
  {col:0xFF44AA, name:'BLOOM PETAL'},
  {col:0x44AAFF, name:'SKY RELIC'},
];
const ARTIFACT_SPOTS = [[18,22],[-28,16],[44,-14],[-18,-38],[52,8],[-44,20]];

function buildArtifacts() {
  ARTIFACT_SPOTS.forEach(([ax, az], idx) => {
    const h = getHeight(ax, az);
    if (h < CFG.waterLevel + 1) return;

    const {col, name} = ARTIFACT_COLORS[idx % ARTIFACT_COLORS.length];
    const color = new THREE.Color(col);
    const g = new THREE.Group();

    // Stone pedestal
    g.add(Object.assign(
      new THREE.Mesh(new THREE.CylinderGeometry(0.14, 0.22, 1.1, 7),
        new THREE.MeshLambertMaterial({color:0x7A7260})),
      {position: new THREE.Vector3(0, 0.55, 0)}
    ));

    // Gem (octahedron)
    const gem = new THREE.Mesh(
      new THREE.OctahedronGeometry(0.38, 0),
      new THREE.MeshStandardMaterial({color, emissive:color, emissiveIntensity:2.8, metalness:0.7, roughness:0.1})
    );
    gem.position.y = 1.55;

    // Orbit ring
    const ring = new THREE.Mesh(
      new THREE.TorusGeometry(0.52, 0.035, 7, 18),
      new THREE.MeshStandardMaterial({color, emissive:color, emissiveIntensity:1.8})
    );
    ring.rotation.x = Math.PI/2;
    ring.position.y = 1.55;

    g.add(gem, ring);
    g.position.set(ax, h, az);

    // Point light glow
    const light = new THREE.PointLight(color, 3.5, 10);
    light.position.set(ax, h + 2, az);
    scene.add(light);
    scene.add(g);

    artifacts.push({group:g, gem, ring, light, color, name,
      lore:LORE[idx], collected:false,
      worldPos:new THREE.Vector3(ax, h+1.55, az), t:Math.random()*Math.PI*2});
  });
}

// Called from game loop
function updateArtifacts(dt) {
  artifacts.forEach(a => {
    if (a.collected) return;
    a.t += dt;
    a.gem.rotation.y = a.t * 1.3;
    a.gem.position.y = 1.55 + Math.sin(a.t * 1.8) * 0.12;
    a.ring.rotation.z = a.t * 0.6;
    a.light.intensity = 3.0 + Math.sin(a.t * 2.4) * 0.9;
  });
}

// Proximity check — called each frame
let nearArtifact = null;
function checkInteraction() {
  const p = player.mesh.position;
  nearArtifact = null;
  artifacts.forEach(a => {
    if (a.collected) return;
    if (p.distanceTo(a.worldPos) < 4.5) nearArtifact = a;
  });
  const promptEl = document.getElementById('prompt');
  if (promptEl) {
    promptEl.style.opacity = nearArtifact ? '1' : '0';
    if (nearArtifact) promptEl.textContent = `[ E ]  ${nearArtifact.name}`;
  }
}

function collectArtifact() {
  if (!nearArtifact || nearArtifact.collected) return;
  nearArtifact.collected = true;
  nearArtifact.gem.visible = false;
  nearArtifact.ring.visible = false;
  nearArtifact.light.intensity = 0;
  artifactsFound++;
  showLore(nearArtifact.lore);
  const el = document.getElementById('artifacts');
  if (el) el.textContent = `${artifactsFound} / ${artifacts.length}  RELICS`;
}

let loreTimer = 0;
function showLore(text) {
  const el = document.getElementById('lore');
  if (!el) return;
  el.textContent = text;
  el.style.opacity = '1';
  loreTimer = 5;
}
function updateLore(dt) {
  if (loreTimer <= 0) return;
  loreTimer -= dt;
  if (loreTimer <= 0) {
    const el = document.getElementById('lore');
    if (el) el.style.opacity = '0';
  }
}

// ═══════════════════════════════════════════════════════
// FIREFLIES
// ═══════════════════════════════════════════════════════
let fireflyGeo, fireflyVel, fireflyPhase;
function buildFireflies(count=70) {
  const pos = new Float32Array(count*3), col = new Float32Array(count*3);
  fireflyVel   = new Float32Array(count*3);
  fireflyPhase = new Float32Array(count);
  const half = 100;

  for (let i=0; i<count; i++) {
    const x = (Math.random()-.5)*half*2, z = (Math.random()-.5)*half*2;
    const h = getHeight(x, z);
    pos[i*3]=x; pos[i*3+1]=h+0.4+Math.random()*3; pos[i*3+2]=z;
    const hue = Math.random()<0.65 ? 0.16+Math.random()*0.04 : 0.50+Math.random()*0.12;
    const c = new THREE.Color().setHSL(hue, 1, 0.72);
    col[i*3]=c.r; col[i*3+1]=c.g; col[i*3+2]=c.b;
    fireflyVel[i*3]=(Math.random()-.5)*0.7;
    fireflyVel[i*3+1]=(Math.random()-.5)*0.25;
    fireflyVel[i*3+2]=(Math.random()-.5)*0.7;
    fireflyPhase[i] = Math.random()*Math.PI*2;
  }
  fireflyGeo = new THREE.BufferGeometry();
  fireflyGeo.setAttribute('position', new THREE.BufferAttribute(pos, 3));
  fireflyGeo.setAttribute('color',    new THREE.BufferAttribute(col, 3));
  const mat = new THREE.PointsMaterial({
    size:0.20, vertexColors:true, transparent:true, opacity:0.9,
    depthWrite:false, blending:THREE.AdditiveBlending, sizeAttenuation:true,
  });
  const pts = new THREE.Points(fireflyGeo, mat);
  scene.add(pts);
  return {pts, mat, count};
}

let fireflyObj;
function updateFireflies(dt, time, dayFrac) {
  if (!fireflyObj || !fireflyGeo) return;
  // Dim by day, bright at dusk/night
  fireflyObj.mat.opacity = Math.max(0, 1 - dayFrac * 0.92) * 0.9;
  const pos = fireflyGeo.attributes.position;
  const N = fireflyObj.count;
  for (let i=0; i<N; i++) {
    const px = pos.getX(i) + fireflyVel[i*3]*dt + Math.sin(time*.7+fireflyPhase[i])*.35*dt;
    const py = pos.getY(i) + fireflyVel[i*3+1]*dt + Math.sin(time*1.1+fireflyPhase[i]+1)*.15*dt;
    const pz = pos.getZ(i) + fireflyVel[i*3+2]*dt + Math.cos(time*.9+fireflyPhase[i])*.35*dt;
    // Floor clamp
    const floor = getHeight(px, pz) + 0.3;
    pos.setXYZ(i, px, Math.max(floor, py), pz);
    // Soft boundary bounce
    const lim = 112;
    if (Math.abs(px)>lim) fireflyVel[i*3]   *= -1;
    if (Math.abs(pz)>lim) fireflyVel[i*3+2] *= -1;
    if (py > floor + 6)   fireflyVel[i*3+1] *= -1;
  }
  pos.needsUpdate = true;
}

// ═══════════════════════════════════════════════════════
// INPUT
// ═══════════════════════════════════════════════════════
const keys = {};
let pointerLocked = false, isDragging = false, lastMX = 0, lastMY = 0;

function setupInput() {
  window.addEventListener('keydown', e => {
    keys[e.key.toLowerCase()] = true;
    if ((e.key === ' ') && player.onGround) {
      player.vel.y = CFG.jumpForce;
      player.onGround = false;
    }
    if (e.key === 'e' || e.key === 'E') collectArtifact();
    if (e.key === 'p' || e.key === 'P') toggleCinematic();
    if (e.key === 'n' || e.key === 'N') { n64Mode = !n64Mode; }
    if (e.key === 'm' || e.key === 'M') {
      mmVisible = !mmVisible;
      const w = document.getElementById('minimap-wrap');
      if (w) w.style.opacity = mmVisible ? '1' : '0';
    }
    e.key === ' ' && e.preventDefault();
  });
  window.addEventListener('keyup', e => { keys[e.key.toLowerCase()] = false; });

  canvas.addEventListener('click', () => {
    canvas.requestPointerLock();
    document.getElementById('overlay').style.opacity = '0';
    setTimeout(() => document.getElementById('overlay').style.display = 'none', 500);
  });
  document.addEventListener('pointerlockchange', () => {
    pointerLocked = !!document.pointerLockElement;
  });
  document.addEventListener('mousemove', e => {
    const dx = pointerLocked ? e.movementX : (isDragging ? e.clientX - lastMX : 0);
    const dy = pointerLocked ? e.movementY : (isDragging ? e.clientY - lastMY : 0);
    cam.yaw   -= dx * 0.0022;
    cam.pitch -= dy * 0.0022;
    cam.pitch  = Math.max(CFG.camMinPitch, Math.min(CFG.camMaxPitch, cam.pitch));
    lastMX = e.clientX; lastMY = e.clientY;
  });
  canvas.addEventListener('mousedown', e => { isDragging = true; lastMX = e.clientX; lastMY = e.clientY; });
  document.addEventListener('mouseup',  () => { isDragging = false; });
  canvas.addEventListener('wheel', e => {
    cam.dist = Math.max(3, Math.min(20, cam.dist + e.deltaY * 0.012));
  }, {passive:true});

  window.addEventListener('resize', () => {
    renderer.setSize(innerWidth, innerHeight);
    camera.aspect = innerWidth / innerHeight;
    camera.updateProjectionMatrix();
    if (composer) composer.setSize(innerWidth, innerHeight);
  });
}

// ═══════════════════════════════════════════════════════
// POST-PROCESSING (bloom + dreamy color grade)
// ═══════════════════════════════════════════════════════
let composer, n64RT, n64QuadScene, n64QuadCam;
let n64Mode = false;

function buildPostProcessing() {
  composer = new EffectComposer(renderer);
  composer.addPass(new RenderPass(scene, camera));

  // Bloom — makes artifacts + fireflies + sky glow
  const bloom = new UnrealBloomPass(new THREE.Vector2(innerWidth, innerHeight), 1.1, 0.55, 0.40);
  composer.addPass(bloom);

  // Dreamy color grade + vignette (final pass)
  const gradePass = new ShaderPass({
    uniforms: {tDiffuse:{value:null}},
    vertexShader:`varying vec2 vUv;void main(){vUv=uv;gl_Position=projectionMatrix*modelViewMatrix*vec4(position,1.);}`,
    fragmentShader:`
      uniform sampler2D tDiffuse;varying vec2 vUv;
      void main(){
        vec3 c=texture2D(tDiffuse,vUv).rgb;
        // Lift shadows, warm highlights slightly
        c=c/(c+vec3(0.12));  // soft rolloff
        c.r*=1.04;c.g*=1.01; // warm push
        float sat=dot(c,vec3(.299,.587,.114));c=mix(vec3(sat),c,1.15);// sat boost
        // Vignette
        float v=smoothstep(1.1,.28,length(vUv-.5)*1.62);
        gl_FragColor=vec4(clamp(c*v,0.,1.),1.);}`,
    renderToScreen:true,
  });
  composer.addPass(gradePass);

  // N64 low-res render target (320×240, nearest filter)
  n64RT = new THREE.WebGLRenderTarget(320, 240, {
    minFilter:THREE.NearestFilter, magFilter:THREE.NearestFilter,
  });
  n64QuadScene = new THREE.Scene();
  n64QuadCam   = new THREE.OrthographicCamera(-1,1,1,-1,0,1);
  n64QuadScene.add(new THREE.Mesh(
    new THREE.PlaneGeometry(2,2),
    new THREE.MeshBasicMaterial({map:n64RT.texture})
  ));
}

// ═══════════════════════════════════════════════════════
// CINEMATIC MODE
// ═══════════════════════════════════════════════════════
let cinematicMode = false, cinematicAngle = 0;
function toggleCinematic() {
  cinematicMode = !cinematicMode;
  const el = document.getElementById('cin-overlay');
  if (el) el.style.opacity = cinematicMode ? '1' : '0';
}
function updateCinematic(dt) {
  if (!cinematicMode) return;
  cinematicAngle += dt * 0.038;
  const r  = 72 + Math.sin(cinematicAngle*0.31)*18;
  const hy = 28 + Math.sin(cinematicAngle*0.19)*10;
  camera.position.set(Math.cos(cinematicAngle)*r, hy, Math.sin(cinematicAngle)*r);
  camera.lookAt(0, 6, 0);
}

// ═══════════════════════════════════════════════════════
// MINIMAP
// ═══════════════════════════════════════════════════════
let mmTerrainCanvas, mmLiveCtx, mmVisible = true;
const MM_RES = 128, MM_WORLD = 230; // world units covered

function buildMinimap() {
  // Pre-render terrain once into an offscreen canvas
  mmTerrainCanvas = document.createElement('canvas');
  mmTerrainCanvas.width = mmTerrainCanvas.height = MM_RES;
  const ctx = mmTerrainCanvas.getContext('2d');
  const img = ctx.createImageData(MM_RES, MM_RES);

  for (let py = 0; py < MM_RES; py++) {
    for (let px = 0; px < MM_RES; px++) {
      const wx = (px / MM_RES - 0.5) * MM_WORLD;
      const wz = (py / MM_RES - 0.5) * MM_WORLD;
      const h  = getHeight(wx, wz);
      let r, g, b;
      if (h < CFG.waterLevel) {
        // Water — bright blue
        r = 0.08; g = 0.38; b = 0.82;
      } else {
        const col = getBiomeColor(h);
        r = col.r; g = col.g; b = col.b;
      }
      const i = (py * MM_RES + px) * 4;
      img.data[i]   = r * 255 | 0;
      img.data[i+1] = g * 255 | 0;
      img.data[i+2] = b * 255 | 0;
      img.data[i+3] = 255;
    }
  }
  ctx.putImageData(img, 0, 0);

  // Live display canvas (already in HTML)
  const liveCanvas = document.getElementById('minimap');
  mmLiveCtx = liveCanvas.getContext('2d');
}

let mmFrameSkip = 0;
function updateMinimap() {
  if (!mmLiveCtx || !mmVisible) return;
  if (++mmFrameSkip < 3) return; // update every 3 frames
  mmFrameSkip = 0;

  const ctx = mmLiveCtx;
  const D = 160; // display size in px

  // Draw pre-rendered terrain base
  ctx.drawImage(mmTerrainCanvas, 0, 0, D, D);

  // Semi-transparent overlay for UI feel
  ctx.fillStyle = 'rgba(0,0,0,0.22)';
  ctx.fillRect(0, 0, D, D);

  function worldToMM(wx, wz) {
    return [(wx / MM_WORLD + 0.5) * D, (wz / MM_WORLD + 0.5) * D];
  }

  // Artifact dots
  artifacts.forEach(a => {
    const [x, y] = worldToMM(a.worldPos.x, a.worldPos.z);
    if (a.collected) {
      ctx.globalAlpha = 0.3;
      ctx.fillStyle = '#fff';
    } else {
      ctx.globalAlpha = 0.9;
      ctx.fillStyle = '#' + a.color.getHexString();
    }
    ctx.beginPath(); ctx.arc(x, y, 3.5, 0, Math.PI * 2); ctx.fill();
    ctx.globalAlpha = 1;
  });

  // Player dot + direction arrow
  const pp = player.mesh.position;
  const [px, pz] = worldToMM(pp.x, pp.z);
  const ang = -player.mesh.rotation.y; // negate: Three.js Y is CCW, canvas is CW

  ctx.fillStyle = '#ffffff';
  ctx.beginPath(); ctx.arc(px, pz, 4.5, 0, Math.PI * 2); ctx.fill();

  ctx.strokeStyle = '#aef7c8';
  ctx.lineWidth = 2;
  ctx.beginPath();
  ctx.moveTo(px, pz);
  ctx.lineTo(px + Math.sin(ang) * 9, pz - Math.cos(ang) * 9);
  ctx.stroke();

  // Border
  ctx.strokeStyle = 'rgba(174,247,200,0.18)';
  ctx.lineWidth = 1;
  ctx.strokeRect(0.5, 0.5, D - 1, D - 1);
}

// ═══════════════════════════════════════════════════════
// HUD
// ═══════════════════════════════════════════════════════
const biomeEl  = document.getElementById('biome');
const coordsEl = document.getElementById('coords');
let hudTick = 0;
function updateHUD(dt) {
  hudTick += dt;
  if (hudTick < 0.25) return;
  hudTick = 0;
  const p = player.mesh.position;
  const h = getHeight(p.x, p.z);
  biomeEl.textContent  = getBiome(h);
  coordsEl.textContent = `${Math.round(p.x)}, ${Math.round(p.y)}, ${Math.round(p.z)}`;
}

// ═══════════════════════════════════════════════════════
// GAME LOOP
// ═══════════════════════════════════════════════════════
function animate() {
  requestAnimationFrame(animate);
  const dt = Math.min(clock.getDelta(), 0.05);

  updateDayNight(dt);
  if (!cinematicMode) updatePlayer(dt);
  updateCinematic(dt);
  updateCamera(dt);
  updateHUD(dt);
  updateArtifacts(dt);
  if (!cinematicMode) checkInteraction();
  updateLore(dt);
  updateFireflies(dt, clock.elapsedTime, skyUniforms.dayFrac.value);
  updateMinimap();
  if (waterMat) waterMat.uniforms.time.value += dt;

  if (n64Mode) {
    renderer.setRenderTarget(n64RT);
    renderer.render(scene, camera);
    renderer.setRenderTarget(null);
    renderer.render(n64QuadScene, n64QuadCam);
  } else {
    composer.render();
  }
}

// ═══════════════════════════════════════════════════════
// INIT
// ═══════════════════════════════════════════════════════
function init() {
  buildTerrain();
  buildWater();
  buildSky();
  buildLighting();
  buildTrees();
  buildRocks();
  buildRuins();
  buildArtifacts();
  buildMinimap();
  fireflyObj = buildFireflies(70);
  buildPlayer();
  buildPostProcessing();
  setupInput();
  animate();
}
init();
</script>

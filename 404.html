<style>
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
:root {
  --ink: #0e0e0e; --paper: #f5f2ec;
  --gold: #b8933a; --neon: #00d4ff;
  --serif: 'Cormorant Garamond', Georgia, serif;
  --mono: 'DM Mono', monospace;
}
html, body { height: 100%; }
body {
  font-family: var(--serif);
  background: var(--ink);
  color: var(--paper);
  display: flex; align-items: center; justify-content: center;
  padding: 2rem;
  background-image:
    radial-gradient(ellipse at 20% 0%, rgba(0,212,255,0.08), transparent 55%),
    radial-gradient(ellipse at 80% 100%, rgba(184,147,58,0.10), transparent 55%);
}
.wrap { max-width: 640px; text-align: center; }
.label {
  font-family: var(--mono); font-size: 0.75rem; letter-spacing: 0.3em;
  text-transform: uppercase; color: var(--neon); opacity: 0.8;
}
.code {
  font-size: clamp(6rem, 22vw, 12rem); font-weight: 300; line-height: 1;
  color: transparent; -webkit-text-stroke: 1px rgba(245,242,236,0.35);
  margin: 0.5rem 0 0.25rem;
}
h1 { font-size: clamp(1.8rem, 5vw, 2.6rem); font-weight: 400; margin-bottom: 0.75rem; }
h1 em { font-style: italic; color: var(--gold); }
p { font-size: 1.15rem; line-height: 1.7; opacity: 0.8; margin-bottom: 2rem; }
.actions { display: flex; flex-wrap: wrap; gap: 0.75rem; justify-content: center; }
.btn {
  font-family: var(--mono); font-size: 0.8rem; letter-spacing: 0.12em; text-transform: uppercase;
  text-decoration: none; padding: 0.75rem 1.4rem; border: 1px solid rgba(184,147,58,0.5);
  color: var(--paper); transition: background 0.2s, border-color 0.2s, color 0.2s;
}
.btn:hover { background: var(--gold); border-color: var(--gold); color: var(--ink); }
.btn.neon { border-color: rgba(0,212,255,0.5); }
.btn.neon:hover { background: var(--neon); border-color: var(--neon); }
.path {
  font-family: var(--mono); font-size: 0.8rem; opacity: 0.5; margin-top: 2.5rem;
  word-break: break-all;
}

/* ── REDUCED MOTION ──────────────────────────────────────────────────────────
   Honours the OS "reduce motion" setting: stops the ambient animation and the
   custom cursor, and gives the native pointer back. */
@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after {
    animation-duration: 1ms !important;
    animation-iteration-count: 1 !important;
    animation-delay: 0ms !important;
    transition-duration: 1ms !important;
    transition-delay: 0ms !important;
  }
  html { scroll-behavior: auto; }
  body, a, button, [role="button"], input, textarea, select { cursor: auto !important; }
  #cursor, #cursor-ring, .cursor-trail { display: none !important; }
}
</style>

<body>
<div class="wrap">
  <div class="label">// 404 — not found</div>
  <div class="code">404</div>
  <h1>This room isn't on the <em>map.</em></h1>
  <p>The page you're looking for was moved, renamed, or never existed. Head back to the fortress and try again.</p>
  <div class="actions">
    <a class="btn" href="/">← Home</a>
    <a class="btn neon" href="/tools/">Security Tools</a>
    <a class="btn" href="/career.html">Career</a>
  </div>
  <div class="path" id="path"></div>
</div>
<script>
  document.getElementById('path').textContent = 'requested: ' + location.pathname;
</script>
</body>
